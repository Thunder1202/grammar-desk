</div><script src="app.js"></script><script>window.GD_QUIZ={"id":"present-simple","rules":{"s":{"en":"With <b>he / she / it</b>, add <b>-s</b> to the verb: work → works.","ru":"С <b>he / she / it</b> к глаголу добавляется <b>-s</b>: work → works.","uz":"<b>he / she / it</b> bilan fe'lga <b>-s</b> qo'shiladi: work → works."},"es":{"en":"If the verb ends in <b>-s, -sh, -ch, -x, -o</b>, add <b>-es</b>: watch → watches, go → goes.","ru":"Если глагол оканчивается на <b>-s, -sh, -ch, -x, -o</b>, добавляется <b>-es</b>: watch → watches, go → goes.","uz":"Fe'l <b>-s, -sh, -ch, -x, -o</b> bilan tugasa, <b>-es</b> qo'shiladi: watch → watches, go → goes."},"ies":{"en":"If the verb ends in <b>consonant + y</b>, <b>y → ies</b>: study → studies.","ru":"Если глагол оканчивается на <b>согласную + y</b>, <b>y → ies</b>: study → studies.","uz":"Fe'l <b>undosh + y</b> bilan tugasa, <b>y → ies</b> bo'ladi: study → studies."},"has":{"en":"<b>have</b> is irregular. With he / she / it it becomes <b>has</b>.","ru":"<b>have</b> — неправильный глагол. С he / she / it он становится <b>has</b>.","uz":"<b>have</b> — noto'g'ri fe'l. he / she / it bilan <b>has</b> bo'ladi."},"base":{"en":"With <b>I / you / we / they</b> and plurals (my friends, dogs...) the verb does not change: <b>no -s</b>.","ru":"С <b>I / you / we / they</b> и множественным числом (my friends, dogs...) глагол не меняется: <b>без -s</b>.","uz":"<b>I / you / we / they</b> va ko'plik (my friends, dogs...) bilan fe'l o'zgarmaydi, <b>-s qo'shilmaydi</b>."},"dont":{"en":"Negative with <b>I / you / we / they</b>: <b>don't + verb</b>.","ru":"Отрицание с <b>I / you / we / they</b>: <b>don't + глагол</b>.","uz":"<b>I / you / we / they</b> bilan inkor: <b>don't + fe'l</b>."},"doesnt":{"en":"Negative with <b>he / she / it</b>: <b>doesn't + verb</b>. No -s on the verb!","ru":"Отрицание с <b>he / she / it</b>: <b>doesn't + глагол</b>. К глаголу -s не добавляется!","uz":"<b>he / she / it</b> bilan inkor: <b>doesn't + fe'l</b>. Fe'lga -s qo'shilmaydi!"},"doq":{"en":"Question with <b>I / you / we / they</b>: <b>Do + subject + verb?</b> Short answer: Yes, I do / No, they don't.","ru":"Вопрос с <b>I / you / we / they</b>: <b>Do + подлежащее + глагол?</b> Краткий ответ: Yes, I do / No, they don't.","uz":"<b>I / you / we / they</b> bilan so'roq: <b>Do + ega + fe'l?</b> Qisqa javob: Yes, I do / No, they don't."},"doesq":{"en":"Question with <b>he / she / it</b>: <b>Does + subject + verb?</b> No -s on the verb. Short answer: Yes, she does / No, he doesn't.","ru":"Вопрос с <b>he / she / it</b>: <b>Does + подлежащее + глагол?</b> К глаголу -s не добавляется. Краткий ответ: Yes, she does / No, he doesn't.","uz":"<b>he / she / it</b> bilan so'roq: <b>Does + ega + fe'l?</b> Fe'lga -s qo'shilmaydi. Qisqa javob: Yes, she does / No, he doesn't."},"adv":{"en":"<b>always, usually, often, sometimes, rarely, never</b> go <b>before</b> the main verb: I never drink...","ru":"<b>always, usually, often, sometimes, rarely, never</b> стоят <b>перед</b> основным глаголом: I never drink...","uz":"<b>always, usually, often, sometimes, rarely, never</b> asosiy fe'ldan <b>oldin</b> keladi: I never drink..."},"advbe":{"en":"With <b>be (am / is / are)</b>, the frequency word goes <b>after</b> it: She is always late.","ru":"С <b>be (am / is / are)</b> наречие частоты стоит <b>после</b> него: She is always late.","uz":"<b>be (am / is / are)</b> bo'lsa, chastota ravishi undan <b>keyin</b> keladi: She is always late."},"order":{"en":"Word order: <b>subject + verb + object + place / time</b>.","ru":"Порядок слов: <b>подлежащее + глагол + дополнение + место / время</b>.","uz":"Gap tartibi: <b>Ega + fe'l + to'ldiruvchi + joy / vaqt</b>."},"qorder":{"en":"Question order: <b>(question word) + do / does + subject + verb?</b>","ru":"Порядок в вопросе: <b>(вопросительное слово) + do / does + подлежащее + глагол?</b>","uz":"So'roq tartibi: <b>(So'roq so'zi) + do / does + ega + fe'l?</b>"}},"ex":[{"h":{"en":"Write the he / she / it form. Example: work → works.","ru":"Напишите форму для he / she / it. Например: work → works.","uz":"He / she / it shaklini yozing. Masalan: work → works"}},{"h":{"en":"Write the correct word: one of the two in brackets.","ru":"Напишите верное слово: одно из двух в скобках.","uz":"To'g'ri so'zni yozing (qavs ichidagi ikkitadan biri)."}},{"h":{"en":"Write the verb in brackets in the correct form.","ru":"Напишите глагол из скобок в правильной форме.","uz":"Qavs ichidagi fe'lni to'g'ri shaklda yozing."}},{"h":{"en":"Jasur's day. Use the verbs in the box in the correct form.","ru":"День Жасура. Используйте глаголы из рамки в правильной форме.","uz":"Jasurning kuni. Qutidagi fe'llardan foydalanib, to'g'ri shaklda yozing."},"box":"wake up, have, go, start, finish, come, do, watch, go to bed"},{"h":{"en":"Make the sentence negative. Write the full sentence.","ru":"Сделайте предложение отрицательным. Напишите его полностью.","uz":"Gapni inkor shaklga o'tkazing. To'liq gapni yozing."}},{"h":{"en":"Write don't or doesn't.","ru":"Напишите don't или doesn't.","uz":"don't yoki doesn't yozing."}},{"h":{"en":"Write the question and a short answer. ✓ = yes, ✗ = no. Example: Do you like tea? Yes, I do.","ru":"Напишите вопрос и краткий ответ. ✓ = да, ✗ = нет. Например: Do you like tea? Yes, I do.","uz":"So'roq gap va qisqa javob yozing. ✓ = Ha, ✗ = Yo'q. Masalan: Do you like tea? Yes, I do."}},{"h":{"en":"Write do or does.","ru":"Напишите do или does.","uz":"do yoki does yozing."}},{"h":{"en":"Put the word in brackets in the right place. Write the full sentence.","ru":"Поставьте слово из скобок на нужное место. Напишите предложение полностью.","uz":"Qavs ichidagi so'zni to'g'ri joyga qo'yib, to'liq gapni yozing."}},{"h":{"en":"Find the mistake and write the correct sentence.","ru":"Найдите ошибку и напишите правильное предложение.","uz":"Xatoni toping va to'g'ri gapni to'liq yozing."}},{"h":{"en":"Put the words in the correct order.","ru":"Расставьте слова в правильном порядке.","uz":"So'zlarni to'g'ri tartibda yozing."}}],"q":[{"e":0,"q":"play → ___","a":["plays"],"r":"s","uz":"play — o'ynamoq","ru":"play — играть"},{"e":0,"q":"watch → ___","a":["watches"],"r":"es","uz":"watch — tomosha qilmoq","ru":"watch — смотреть"},{"e":0,"q":"study → ___","a":["studies"],"r":"ies","uz":"study — o'qimoq, o'rganmoq","ru":"study — учиться, изучать"},{"e":0,"q":"go → ___","a":["goes"],"r":"es","uz":"go — bormoq","ru":"go — идти, ехать"},{"e":0,"q":"eat → ___","a":["eats"],"r":"s","uz":"eat — yemoq","ru":"eat — есть"},{"e":0,"q":"have → ___","a":["has"],"r":"has","uz":"have — ega bo'lmoq, bor bo'lmoq","ru":"have — иметь"},{"e":0,"q":"wash → ___","a":["washes"],"r":"es","uz":"wash — yuvmoq","ru":"wash — мыть"},{"e":0,"q":"fly → ___","a":["flies"],"r":"ies","uz":"fly — uchmoq","ru":"fly — летать"},{"e":0,"q":"read → ___","a":["reads"],"r":"s","uz":"read — o'qimoq (kitob)","ru":"read — читать"},{"e":0,"q":"do → ___","a":["does"],"r":"es","uz":"do — qilmoq","ru":"do — делать"},{"e":0,"q":"drink → ___","a":["drinks"],"r":"s","uz":"drink — ichmoq","ru":"drink — пить"},{"e":0,"q":"fix → ___","a":["fixes"],"r":"es","uz":"fix — tuzatmoq","ru":"fix — чинить"},{"e":0,"q":"cry → ___","a":["cries"],"r":"ies","uz":"cry — yig'lamoq","ru":"cry — плакать"},{"e":0,"q":"live → ___","a":["lives"],"r":"s","uz":"live — yashamoq","ru":"live — жить"},{"e":0,"q":"teach → ___","a":["teaches"],"r":"es","uz":"teach — o'rgatmoq, dars bermoq","ru":"teach — учить, преподавать"},{"e":1,"q":"I (drink / drinks) milk every day.","a":["drink"],"r":"base","uz":"Men har kuni sut ichaman.","ru":"Я пью молоко каждый день."},{"e":1,"q":"She (like / likes) cats.","a":["likes"],"r":"s","uz":"U mushuklarni yaxshi ko'radi.","ru":"Она любит кошек."},{"e":1,"q":"They (live / lives) in Tashkent.","a":["live"],"r":"base","uz":"Ular Toshkentda yashaydi.","ru":"Они живут в Ташкенте."},{"e":1,"q":"My brother (play / plays) football.","a":["plays"],"r":"s","uz":"Akam futbol o'ynaydi.","ru":"Мой брат играет в футбол.","n":"My brother = he"},{"e":1,"q":"We (go / goes) to school by bus.","a":["go"],"r":"base","uz":"Biz maktabga avtobusda boramiz.","ru":"Мы ездим в школу на автобусе."},{"e":1,"q":"The cat (sleep / sleeps) a lot.","a":["sleeps"],"r":"s","uz":"Mushuk ko'p uxlaydi.","ru":"Кошка много спит.","n":"The cat = it"},{"e":1,"q":"You (speak / speaks) English well.","a":["speak"],"r":"base","uz":"Sen ingliz tilida yaxshi gapirasan.","ru":"Ты хорошо говоришь по-английски."},{"e":1,"q":"Ali and Aziz (study / studies) at university.","a":["study"],"r":"base","uz":"Ali va Aziz universitetda o'qiydi.","ru":"Али и Азиз учатся в университете.","n":"Ali and Aziz = they"},{"e":1,"q":"My mother (cook / cooks) plov on Sundays.","a":["cooks"],"r":"s","uz":"Onam yakshanba kunlari palov pishiradi.","ru":"Моя мама готовит плов по воскресеньям.","n":"My mother = she"},{"e":1,"q":"It (rain / rains) a lot in autumn.","a":["rains"],"r":"s","uz":"Kuzda ko'p yomg'ir yog'adi.","ru":"Осенью часто идёт дождь."},{"e":2,"q":"My father ___ (work) in a bank.","a":["works"],"r":"s","uz":"Otam bankda ishlaydi.","ru":"Мой отец работает в банке."},{"e":2,"q":"I ___ (get up) at 7 o'clock.","a":["get up"],"r":"base","uz":"Men soat 7 da turaman.","ru":"Я встаю в 7 часов."},{"e":2,"q":"She ___ (watch) TV in the evening.","a":["watches"],"r":"es","uz":"U kechqurun televizor ko'radi.","ru":"Она смотрит телевизор вечером."},{"e":2,"q":"We ___ (have) breakfast at home.","a":["have"],"r":"base","uz":"Biz uyda nonushta qilamiz.","ru":"Мы завтракаем дома."},{"e":2,"q":"He ___ (have) two sisters.","a":["has"],"r":"has","uz":"Uning ikkita singlisi bor.","ru":"У него две сестры."},{"e":2,"q":"The shop ___ (open) at 9 a.m.","a":["opens"],"r":"s","uz":"Do'kon ertalab soat 9 da ochiladi.","ru":"Магазин открывается в 9 утра."},{"e":2,"q":"My friends ___ (play) computer games.","a":["play"],"r":"base","uz":"Do'stlarim kompyuter o'yinlarini o'ynaydi.","ru":"Мои друзья играют в компьютерные игры.","n":"My friends = they"},{"e":2,"q":"Madina ___ (study) English.","a":["studies"],"r":"ies","uz":"Madina ingliz tilini o'rganadi.","ru":"Мадина изучает английский язык."},{"e":2,"q":"The bus ___ (go) to the city centre.","a":["goes"],"r":"es","uz":"Avtobus shahar markaziga boradi.","ru":"Автобус идёт в центр города."},{"e":2,"q":"They ___ (eat) lunch at 1 p.m.","a":["eat"],"r":"base","uz":"Ular soat 1 da tushlik qilishadi.","ru":"Они обедают в час дня."},{"e":2,"q":"My teacher ___ (teach) maths.","a":["teaches"],"r":"es","uz":"O'qituvchim matematikadan dars beradi.","ru":"Мой учитель преподаёт математику."},{"e":2,"q":"Water ___ (boil) at 100°C.","a":["boils"],"r":"s","uz":"Suv 100°C da qaynaydi.","ru":"Вода кипит при 100°C.","n":"Water = it"},{"e":2,"q":"You ___ (read) a lot of books.","a":["read"],"r":"base","uz":"Sen ko'p kitob o'qiysan.","ru":"Ты читаешь много книг."},{"e":2,"q":"My sister ___ (wash) the dishes.","a":["washes"],"r":"es","uz":"Singlim idishlarni yuvadi.","ru":"Моя сестра моет посуду."},{"e":2,"q":"Dogs ___ (like) bones.","a":["like"],"r":"base","uz":"Itlar suyakni yaxshi ko'radi.","ru":"Собаки любят кости.","n":"Dogs = they"},{"e":3,"q":"Every day Jasur ___ at 6:30.","a":["wakes up"],"r":"s","uz":"Har kuni Jasur soat 6:30 da uyg'onadi.","ru":"Каждый день Жасур просыпается в 6:30."},{"e":3,"q":"He ___ breakfast with his family.","a":["has"],"r":"has","uz":"U oilasi bilan nonushta qiladi.","ru":"Он завтракает с семьёй."},{"e":3,"q":"Then he ___ to school by bus.","a":["goes"],"r":"es","uz":"Keyin u maktabga avtobusda boradi.","ru":"Потом он едет в школу на автобусе."},{"e":3,"q":"Lessons ___ at 8:00.","a":["start"],"r":"base","uz":"Darslar soat 8:00 da boshlanadi.","ru":"Уроки начинаются в 8:00.","n":"Lessons = they"},{"e":3,"q":"Lessons start at 8:00 and ___ at 1:00.","a":["finish"],"r":"base","uz":"Darslar soat 8 da boshlanib, soat 1 da tugaydi.","ru":"Уроки начинаются в 8:00 и заканчиваются в 1:00."},{"e":3,"q":"He ___ home at 2:00.","a":["comes"],"r":"s","uz":"U uyga soat 2:00 da kelad
