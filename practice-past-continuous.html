</div><script src="app.js"></script><script>window.GD_QUIZ={"id":"past-continuous","rules":{"be":{"en":"Past Continuous: <b>was / were + verb-ing</b>. Use <b>was</b> with I / he / she / it and <b>were</b> with you / we / they: I <b>was</b> reading, they <b>were</b> reading.","ru":"Past Continuous: <b>was / were + глагол-ing</b>. <b>was</b> с I / he / she / it, <b>were</b> с you / we / they: I <b>was</b> reading, they <b>were</b> reading.","uz":"Past Continuous: <b>was / were + fe'l-ing</b>. <b>was</b> I / he / she / it bilan, <b>were</b> you / we / they bilan: I <b>was</b> reading, they <b>were</b> reading."},"use":{"en":"We use it for an action that was <b>in progress at a moment in the past</b>: At 8 pm yesterday I <b>was watching</b> TV.","ru":"Используем для действия, которое <b>шло в определённый момент в прошлом</b>: At 8 pm yesterday I <b>was watching</b> TV.","uz":"O'tmishdagi aniq bir paytda <b>davom etayotgan</b> ish uchun ishlatiladi: At 8 pm yesterday I <b>was watching</b> TV."},"ing":{"en":"Spelling is the same as the Present Continuous: make → making, run → running, lie → lying, study → studying.","ru":"Правописание такое же, как в Present Continuous: make → making, run → running, lie → lying, study → studying.","uz":"Imlo Present Continuous dagidek: make → making, run → running, lie → lying, study → studying."},"neg":{"en":"Negative: <b>wasn't / weren't + verb-ing</b>: She <b>wasn't</b> sleeping. They <b>weren't</b> working. Do not use didn't!","ru":"Отрицание: <b>wasn't / weren't + глагол-ing</b>: She <b>wasn't</b> sleeping. They <b>weren't</b> working. Не используйте didn't!","uz":"Inkor: <b>wasn't / weren't + fe'l-ing</b>: She <b>wasn't</b> sleeping. They <b>weren't</b> working. didn't ishlatilmaydi!"},"q":{"en":"Question: <b>Was / Were + subject + verb-ing?</b> Was she sleeping? Were they working?","ru":"Вопрос: <b>Was / Were + подлежащее + глагол-ing?</b> Was she sleeping? Were they working?","uz":"So'roq: <b>Was / Were + ega + fe'l-ing?</b> Was she sleeping? Were they working?"},"sa":{"en":"Short answers use <b>was / were</b>: Yes, I <b>was</b>. / No, they <b>weren't</b>. Do not use did.","ru":"Краткие ответы с <b>was / were</b>: Yes, I <b>was</b>. / No, they <b>weren't</b>. did не используется.","uz":"Qisqa javoblar <b>was / were</b> bilan: Yes, I <b>was</b>. / No, they <b>weren't</b>. did ishlatilmaydi."},"wh":{"en":"Question word first: <b>What / Where / Why + was / were + subject + verb-ing?</b> What were you doing?","ru":"Сначала вопросительное слово: <b>What / Where / Why + was / were + подлежащее + глагол-ing?</b> What were you doing?","uz":"Avval so'roq so'z: <b>What / Where / Why + was / were + ega + fe'l-ing?</b> What were you doing?"},"int":{"en":"A <b>long action</b> (Past Continuous) is interrupted by a <b>short action</b> (Past Simple): I <b>was cooking</b> when the phone <b>rang</b>.","ru":"<b>Длинное действие</b> (Past Continuous) прерывается <b>коротким</b> (Past Simple): I <b>was cooking</b> when the phone <b>rang</b>.","uz":"<b>Uzoq davom etgan ish</b> (Past Continuous) <b>qisqa ish</b> (Past Simple) bilan to'xtatiladi: I <b>was cooking</b> when the phone <b>rang</b>."},"whi":{"en":"<b>while</b> + Past Continuous: two actions at the same time: I <b>was cooking</b> while my brother <b>was washing</b> the car. <b>when</b> goes with the short action.","ru":"<b>while</b> + Past Continuous: два действия одновременно: I <b>was cooking</b> while my brother <b>was washing</b> the car. <b>when</b> ставится с коротким действием.","uz":"<b>while</b> + Past Continuous: bir vaqtda bo'lgan ikki ish: I <b>was cooking</b> while my brother <b>was washing</b> the car. <b>when</b> qisqa ish bilan keladi."},"ps":{"en":"Finished action = Past Simple (<b>I watched</b> the film). Action in progress = Past Continuous (<b>I was watching</b> the film when you called).","ru":"Завершённое действие = Past Simple (<b>I watched</b> the film). Действие в процессе = Past Continuous (<b>I was watching</b> the film when you called).","uz":"Tugagan ish = Past Simple (<b>I watched</b> the film). Davom etayotgan ish = Past Continuous (<b>I was watching</b> the film when you called)."},"state":{"en":"<b>State verbs</b> (know, like, want, need, understand, believe) are not used in the continuous: I <b>knew</b> him (not I was knowing).","ru":"<b>Глаголы состояния</b> (know, like, want, need, understand, believe) не употребляются в continuous: I <b>knew</b> him (не I was knowing).","uz":"<b>Holat fe'llari</b> (know, like, want, need, understand, believe) continuous da ishlatilmaydi: I <b>knew</b> him (I was knowing emas)."},"order":{"en":"Word order: <b>subject + was / were + verb-ing + the rest</b>. Questions: <b>(question word) + was / were + subject + verb-ing?</b>","ru":"Порядок слов: <b>подлежащее + was / were + глагол-ing + остальное</b>. Вопросы: <b>(вопросительное слово) + was / were + подлежащее + глагол-ing?</b>","uz":"So'zlar tartibi: <b>ega + was / were + fe'l-ing + qolgani</b>. So'roq: <b>(so'roq so'z) + was / were + ega + fe'l-ing?</b>"}},"ex":[{"h":{"en":"Write was or were.","ru":"Напишите was или were.","uz":"was yoki were yozing."}},{"h":{"en":"Write the verb in brackets in the Past Continuous. Write both words, for example: was reading.","ru":"Напишите глагол из скобок в Past Continuous. Пишите оба слова, например: was reading.","uz":"Qavs ichidagi fe'lni Past Continuous da yozing. Ikkala so'zni yozing, masalan: was reading."}},{"h":{"en":"Make the sentence negative. Write the full sentence.","ru":"Сделайте предложение отрицательным. Напишите его полностью.","uz":"Gapni inkor qiling. To'liq gapni yozing."}},{"h":{"en":"Make a question. Write the full question.","ru":"Составьте вопрос. Напишите вопрос полностью.","uz":"Savol tuzing. To'liq savolni yozing."}},{"h":{"en":"Write a short answer. ✓ = yes, ✗ = no. Example: Was he sleeping? (✓) → Yes, he was.","ru":"Напишите краткий ответ. ✓ = да, ✗ = нет. Например: Was he sleeping? (✓) → Yes, he was.","uz":"Qisqa javob yozing. ✓ = ha, ✗ = yo'q. Masalan: Was he sleeping? (✓) → Yes, he was."}},{"h":{"en":"Questions with a question word. Write the missing word or the full question.","ru":"Вопросы с вопросительным словом. Напишите пропущенное слово или весь вопрос.","uz":"So'roq so'zli savollar. Tushib qolgan so'zni yoki to'liq savolni yozing."}},{"h":{"en":"A long action and a short action. Write the verb in brackets: Past Simple (short action) or Past Continuous (long action).","ru":"Длинное и короткое действие. Напишите глагол: Past Simple (короткое) или Past Continuous (длинное).","uz":"Uzoq va qisqa ish. Fe'lni yozing: Past Simple (qisqa) yoki Past Continuous (uzoq)."}},{"h":{"en":"Two actions at the same time. Write the verb in the Past Continuous.","ru":"Два действия одновременно. Напишите глагол в Past Continuous.","uz":"Bir vaqtdagi ikki ish. Fe'lni Past Continuous da yozing."}},{"h":{"en":"At a time in the past. Write the verb in the Past Continuous.","ru":"В определённый момент в прошлом. Напишите глагол в Past Continuous.","uz":"O'tmishdagi aniq paytda. Fe'lni Past Continuous da yozing."}},{"h":{"en":"Find the mistake and write the correct sentence.","ru":"Найдите ошибку и напишите правильное предложение.","uz":"Xatoni toping va to'g'ri gapni yozing."}},{"h":{"en":"Put the words in the correct order.","ru":"Расставьте слова в правильном порядке.","uz":"So'zlarni to'g'ri tartibga qo'ying."}}],"q":[{"e":0,"q":"I ___ reading a book.","a":["was"],"r":"be","ru":"Я читал книгу.","uz":"Men kitob o'qiyotgan edim."},{"e":0,"q":"She ___ sleeping.","a":["was"],"r":"be","ru":"Она спала.","uz":"U uxlayotgan edi."},{"e":0,"q":"They ___ playing football.","a":["were"],"r":"be","ru":"Они играли в футбол.","uz":"Ular futbol o'ynayotgan edi."},{"e":0,"q":"We ___ eating dinner.","a":["were"],"r":"be","ru":"Мы ужинали.","uz":"Biz kechki ovqat yeyotgan edik."},{"e":0,"q":"My brother ___ watching TV.","a":["was"],"r":"be","ru":"Мой брат смотрел телевизор.","uz":"Akam televizor ko'rayotgan edi.","n":"My brother = he"},{"e":0,"q":"You ___ running very fast.","a":["were"],"r":"be","ru":"Ты бежал очень быстро.","uz":"Siz juda tez yugurayotgan edingiz."},{"e":0,"q":"The children ___ singing.","a":["were"],"r":"be","ru":"Дети пели.","uz":"Bolalar qo'shiq aytayotgan edi.","n":"The children = they"},{"e":0,"q":"It ___ raining.","a":["was"],"r":"be","ru":"Шёл дождь.","uz":"Yomg'ir yog'ayotgan edi."},{"e":1,"q":"At 8 pm yesterday I ___ (watch) TV.","a":["was watching"],"r":"use","ru":"Вчера в 8 вечера я смотрел телевизор.","uz":"Kecha soat 8 da men televizor ko'rayotgan edim."},{"e":1,"q":"At noon she ___ (cook) lunch.","a":["was cooking"],"r":"use","ru":"В полдень она готовила обед.","uz":"Tush paytida u tushlik pishirayotgan edi."},{"e":1,"q":"They ___ (play) tennis at 4 o'clock.","a":["were playing"],"r":"use","ru":"В 4 часа они играли в теннис.","uz":"Soat 4 da ular tennis o'ynayotgan edi."},{"e":1,"q":"I ___ (write) an email at 9 o'clock.","a":["was writing"],"r":"ing","ru":"В 9 часов я писал письмо.","uz":"Soat 9 da men xat yozayotgan edim."},{"e":1,"q":"We ___ (sit) in the garden all afternoon.","a":["were sitting"],"r":"ing","ru":"Мы весь день сидели в саду.","uz":"Biz butun tushdan keyin bog'da o'tirgan edik."},{"e":1,"q":"He ___ (run) in the park at 7 am.","a":["was running"],"r":"ing","ru":"В 7 утра он бегал в парке.","uz":"Ertalab soat 7 da u parkda yugurayotgan edi."},{"e":1,"q":"The students ___ (study) in the library.","a":["were studying"],"r":"use","ru":"Студенты занимались в библиотеке.","uz":"Talabalar kutubxonada o'qiyotgan edi."},{"e":1,"q":"My mother ___ (make) tea.","a":["was making"],"r":"ing","ru":"Мама заваривала чай.","uz":"Onam choy damlayotgan edi."},{"e":1,"q":"We ___ (lie) on the beach at that time.","a":["were lying"],"r":"ing","ru":"В то время мы лежали на пляже.","uz":"O'sha paytda biz sohilda yotgan edik."},{"e":1,"q":"I ___ (wait) for the bus at 6 o'clock.","a":["was waiting"],"r":"use","ru":"В 6 часов я ждал автобус.","uz":"Soat 6 da men avtobusni kutayotgan edim."},{"e":1,"q":"It ___ (snow) all night.","a":["was snowing"],"r":"use","ru":"Всю ночь шёл снег.","uz":"Butun tun qor yog'ayotgan edi."},{"e":1,"q":"The baby ___ (cry) at midnight.","a":["was crying"],"r":"use","ru":"В полночь малыш плакал.","uz":"Yarim tunda chaqaloq yig'layotgan edi."},{"e":2,"q":"I was working.","a":["I wasn't working.","I was not working."],"r":"neg","ru":"Я не работал.","uz":"Men ishlamayotgan edim."},{"e":2,"q":"She was listening to music.","a":["She wasn't listening to music.","She was not listening to music."],"r":"neg","ru":"Она не слушала музыку.","uz":"U musiqa tinglamayotgan edi."},{"e":2,"q":"They were playing outside.","a":["They weren't playing outside.","They were not playing outside."],"r":"neg","ru":"Они не играли на улице.","uz":"Ular tashqarida o'ynamayotgan edi."},{"e":2,"q":"He was driving fast.","a":["He wasn't driving fast.","He was not driving fast."],"r":"neg","ru":"Он не ехал быстро.","uz":"U tez haydamayotgan edi."},{"e":2,"q":"We were waiting for you.","a":["We weren't waiting for you.","We were not waiting for you."],"r":"neg","ru":"Мы не ждали тебя.","uz":"Biz sizni kutmayotgan edik."},{"e":2,"q":"The sun was shining.","a":["The sun wasn't shining.","The sun was not shining."],"r":"neg","ru":"Солнце не светило.","uz":"Quyosh charaqlamayotgan edi."},{"e":2,"q":"You were paying attention.","a":["You weren't paying attention.","You were not paying attention."],"r":"neg","ru":"Ты не обращал внимания.","uz":"Siz e'tibor bermayotgan edingiz."},{"e":2,"q":"I was sleeping.","a":["I wasn't sleeping.","I was not sleeping."],"r":"neg","ru":"Я не спал.","uz":"Men uxlamayotgan edim."},{"e":3,"q":"You were sleeping.","a":["Were you sleeping?"],"r":"q","ru":"Ты спал?","uz":"Siz uxlayotgan edingizmi?"},{"e":3,"q":"She was cooking.","a":["Was she cooking?"],"r":"q","ru":"Она готовила?","uz":"U ovqat pishirayotgan edimi?"},{"e":3,"q":"They were waiting.","a":["Were they waiting?"],"r":"q","ru":"Они ждали?","uz"
