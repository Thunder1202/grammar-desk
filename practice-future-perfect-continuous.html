</div><script src="app.js"></script><script>window.GD_QUIZ={"id":"future-perfect-continuous","rules":{"f":{"en":"Form: <b>will + have + been + verb-ing</b> for all people: I <b>will have been working</b>, she <b>will have been working</b>. Short form: I'll have been working.","ru":"Форма: <b>will + have + been + глагол-ing</b> для всех лиц: I <b>will have been working</b>, she <b>will have been working</b>. Краткая форма: I'll have been working.","uz":"Shakli: <b>will + have + been + fe'l-ing</b> barcha shaxslar uchun: I <b>will have been working</b>, she <b>will have been working</b>. Qisqa shakl: I'll have been working."},"ing":{"en":"Spelling of -ing: make → making, run → running, lie → lying, study → studying.","ru":"Правописание -ing: make → making, run → running, lie → lying, study → studying.","uz":"-ing imlosi: make → making, run → running, lie → lying, study → studying."},"dur":{"en":"<b>Duration up to a future moment</b>: we look back from the future and say <b>how long</b> an action will have been going on. By June I <b>will have been working</b> here for five years.","ru":"<b>Длительность до момента в будущем</b>: мы смотрим из будущего и говорим, <b>как долго</b> будет продолжаться действие. By June I <b>will have been working</b> here for five years.","uz":"<b>Kelajakdagi paytgacha davomiylik</b>: kelajakdan orqaga qarab, ish <b>qancha vaqt</b> davom etgan bo'lishini aytamiz. By June I <b>will have been working</b> here for five years."},"fs":{"en":"<b>for</b> + a period (for two hours, for ten years). We usually say <b>by + time</b>, <b>by the time</b> or <b>when</b> to show the future moment: By 6 pm I will have been waiting for three hours. We use <b>for</b>, not since, because we count the length of time up to the future moment.","ru":"<b>for</b> + период (for two hours, for ten years). Будущий момент обычно показывают словами <b>by + время</b>, <b>by the time</b> или <b>when</b>: By 6 pm I will have been waiting for three hours. Используем <b>for</b>, а не since, потому что считаем длительность до будущего момента.","uz":"<b>for</b> + davr (for two hours, for ten years). Kelajakdagi payt odatda <b>by + vaqt</b>, <b>by the time</b> yoki <b>when</b> bilan ko'rsatiladi: By 6 pm I will have been waiting for three hours. Biz since emas, <b>for</b> ishlatamiz, chunki kelajakdagi paytgacha bo'lgan davrni sanaymiz."},"neg":{"en":"Negative: <b>won't have been + verb-ing</b>: I <b>won't have been working</b> long. They <b>won't have been waiting</b>.","ru":"Отрицание: <b>won't have been + глагол-ing</b>: I <b>won't have been working</b> long. They <b>won't have been waiting</b>.","uz":"Inkor: <b>won't have been + fe'l-ing</b>: I <b>won't have been working</b> long. They <b>won't have been waiting</b>."},"q":{"en":"Question: <b>Will + subject + have been + verb-ing?</b> Will you have been working for long? Will she have been studying?","ru":"Вопрос: <b>Will + подлежащее + have been + глагол-ing?</b> Will you have been working for long? Will she have been studying?","uz":"So'roq: <b>Will + ega + have been + fe'l-ing?</b> Will you have been working for long? Will she have been studying?"},"sa":{"en":"Short answers: Yes, I <b>will</b>. / No, she <b>won't</b>. Do not repeat have been + verb-ing.","ru":"Краткие ответы: Yes, I <b>will</b>. / No, she <b>won't</b>. have been + глагол-ing не повторяйте.","uz":"Qisqa javoblar: Yes, I <b>will</b>. / No, she <b>won't</b>. have been + fe'l-ing ni takrorlamang."},"hl":{"en":"Question: <b>How long + will + subject + have been + verb-ing?</b> How long will you have been working by June?","ru":"Вопрос: <b>How long + will + подлежащее + have been + глагол-ing?</b> How long will you have been working by June?","uz":"So'roq: <b>How long + will + ega + have been + fe'l-ing?</b> How long will you have been working by June?"},"pp":{"en":"<b>Future Perfect Continuous</b> = the activity and its <b>length</b> (I'll have been reading for hours). <b>Future Perfect</b> = the <b>result</b>, finished (I'll have read ten books).","ru":"<b>Future Perfect Continuous</b> = процесс и его <b>длительность</b> (I'll have been reading for hours). <b>Future Perfect</b> = <b>результат</b>, завершено (I'll have read ten books).","uz":"<b>Future Perfect Continuous</b> = jarayon va uning <b>davomiyligi</b> (I'll have been reading for hours). <b>Future Perfect</b> = <b>natija</b>, tugagan (I'll have read ten books)."},"fc":{"en":"<b>Future Continuous</b> = in progress at a future moment (At 6 I'll be working). <b>Future Perfect Continuous</b> = how long it has been in progress by then (At 6 I'll have been working for ten hours).","ru":"<b>Future Continuous</b> = в процессе в будущий момент (At 6 I'll be working). <b>Future Perfect Continuous</b> = как долго это продолжается к тому моменту (At 6 I'll have been working for ten hours).","uz":"<b>Future Continuous</b> = kelajakdagi paytda davom etayotgan (At 6 I'll be working). <b>Future Perfect Continuous</b> = o'sha paytgacha qancha vaqt davom etgani (At 6 I'll have been working for ten hours)."},"state":{"en":"<b>State verbs</b> (know, like, love, want, need, believe, own) do not take the continuous: By June I <b>will have known</b> him for ten years (not will have been knowing).","ru":"<b>Глаголы состояния</b> (know, like, love, want, need, believe, own) не используются в continuous: By June I <b>will have known</b> him for ten years (не will have been knowing).","uz":"<b>Holat fe'llari</b> (know, like, love, want, need, believe, own) continuous da ishlatilmaydi: By June I <b>will have known</b> him for ten years (will have been knowing emas)."},"bythe":{"en":"<b>By the time / when</b> + <b>Present Simple</b> (not will): By the time she <b>arrives</b>, I <b>will have been waiting</b> for an hour. Never: By the time she will arrive.","ru":"<b>By the time / when</b> + <b>Present Simple</b> (не will): By the time she <b>arrives</b>, I <b>will have been waiting</b> for an hour. Нельзя: By the time she will arrive.","uz":"<b>By the time / when</b> + <b>Present Simple</b> (will emas): By the time she <b>arrives</b>, I <b>will have been waiting</b> for an hour. Mumkin emas: By the time she will arrive."},"order":{"en":"Word order: <b>subject + will + have been + verb-ing + for + time</b>. Questions: <b>(How long) + will + subject + have been + verb-ing?</b>","ru":"Порядок слов: <b>подлежащее + will + have been + глагол-ing + for + время</b>. Вопросы: <b>(How long) + will + подлежащее + have been + глагол-ing?</b>","uz":"So'zlar tartibi: <b>ega + will + have been + fe'l-ing + for + vaqt</b>. So'roq: <b>(How long) + will + ega + have been + fe'l-ing?</b>"}},"ex":[{"h":{"en":"Write the verb in brackets in the Future Perfect Continuous. Write all words, for example: will have been working.","ru":"Напишите глагол из скобок в Future Perfect Continuous. Пишите все слова, например: will have been working.","uz":"Qavs ichidagi fe'lni Future Perfect Continuous da yozing. Hamma so'zlarni yozing, masalan: will have been working."}},{"h":{"en":"Make the sentence negative. Write the full sentence.","ru":"Сделайте предложение отрицательным. Напишите его полностью.","uz":"Gapni inkor qiling. To'liq gapni yozing."}},{"h":{"en":"Make a question. Write the full question.","ru":"Составьте вопрос. Напишите вопрос полностью.","uz":"Savol tuzing. To'liq savolni yozing."}},{"h":{"en":"Write a short answer. ✓ = yes, ✗ = no. Example: Will he have been working? (✓) → Yes, he will.","ru":"Напишите краткий ответ. ✓ = да, ✗ = нет. Например: Will he have been working? (✓) → Yes, he will.","uz":"Qisqa javob yozing. ✓ = ha, ✗ = yo'q. Masalan: Will he have been working? (✓) → Yes, he will."}},{"h":{"en":"Make a question with How long. Write the full question.","ru":"Составьте вопрос с How long. Напишите вопрос полностью.","uz":"How long bilan savol tuzing. To'liq savolni yozing."}},{"h":{"en":"Future Perfect or Future Perfect Continuous? Continuous = the activity and its length. Simple = the result.","ru":"Future Perfect или Future Perfect Continuous? Continuous = процесс и длительность. Simple = результат.","uz":"Future Perfect yoki Future Perfect Continuous? Continuous = jarayon va davomiylik. Simple = natija."}},{"h":{"en":"Future Continuous or Future Perfect Continuous? Write the verb in brackets in the correct form.","ru":"Future Continuous или Future Perfect Continuous? Напишите глагол из скобок в нужной форме.","uz":"Future Continuous yoki Future Perfect Continuous? Qavs ichidagi fe'lni to'g'ri shaklda yozing."}},{"h":{"en":"Write for or by.","ru":"Напишите for или by.","uz":"for yoki by yozing."}},{"h":{"en":"By the time or when: write the verb in brackets in the correct form (Future Perfect Continuous or Present Simple).","ru":"By the time или when: напишите глагол из скобок в нужной форме (Future Perfect Continuous или Present Simple).","uz":"By the time yoki when: qavs ichidagi fe'lni to'g'ri shaklda yozing (Future Perfect Continuous yoki Present Simple)."}},{"h":{"en":"State verb or action verb? Write the verb in brackets in the correct form.","ru":"Глагол состояния или действия? Напишите глагол из скобок в нужной форме.","uz":"Holat fe'li yoki harakat fe'li? Qavs ichidagi fe'lni to'g'ri shaklda yozing."}},{"h":{"en":"Find the mistake and write the correct sentence.","ru":"Найдите ошибку и напишите правильное предложение.","uz":"Xatoni toping va to'g'ri gapni yozing."}},{"h":{"en":"Put the words in the correct order.","ru":"Расставьте слова в правильном порядке.","uz":"So'zlarni to'g'ri tartibga qo'ying."}}],"q":[{"e":0,"q":"By June I ___ (work) here for five years.","a":["will have been working"],"r":"dur","ru":"К июню я буду работать здесь пять лет.","uz":"Iyunga kelib men bu yerda besh yildan beri ishlayotgan bo'laman."},{"e":0,"q":"By 6 pm she ___ (study) for three hours.","a":["will have been studying"],"r":"dur","ru":"К 6 вечера она будет заниматься уже три часа.","uz":"Kechki 6 ga kelib u uch soatdan beri o'qiyotgan bo'ladi."},{"e":0,"q":"By the time you arrive, I ___ (wait) for an hour.","a":["will have been waiting"],"r":"bythe","ru":"К тому времени как ты приедешь, я буду ждать уже час.","uz":"Siz yetib kelguningizcha men bir soatdan beri kutayotgan bo'laman."},{"e":0,"q":"Next month they ___ (live) here for ten years.","a":["will have been living"],"r":"dur","ru":"В следующем месяце они будут жить здесь десять лет.","uz":"Kelasi oy ular bu yerda o'n yildan beri yashayotgan bo'ladi."},{"e":0,"q":"By midnight we ___ (drive) for twelve hours.","a":["will have been driving"],"r":"dur","ru":"К полуночи мы будем ехать уже двенадцать часов.","uz":"Yarim tunga kelib biz o'n ikki soatdan beri haydayotgan bo'lamiz."},{"e":0,"q":"In December he ___ (teach) for twenty years.","a":["will have been teaching"],"r":"dur","ru":"В декабре он будет преподавать уже двадцать лет.","uz":"Dekabrda u yigirma yildan beri dars berayotgan bo'ladi."},{"e":0,"q":"By the end of the week I ___ (run) every morning for a month.","a":["will have been running"],"r":"ing","ru":"К концу недели я буду бегать каждое утро уже месяц.","uz":"Hafta oxiriga kelib men bir oydan beri har ertalab yugurayotgan bo'laman."},{"e":0,"q":"By the time the film ends, we ___ (sit) here for three hours.","a":["will have been sitting"],"r":"ing","ru":"К концу фильма мы будем сидеть здесь уже три часа.","uz":"Film tugaguncha biz uch soatdan beri shu yerda o'tirgan bo'lamiz."},{"e":0,"q":"By next summer she ___ (learn) English for two years.","a":["will have been learning"],"r":"dur","ru":"К следующему лету она будет учить английский два года.","uz":"Kelasi yozga kelib u ikki yildan beri ingliz tilini o'rganayotgan bo'ladi."},{"e":0,"q":"In an hour it ___ (snow) for a whole day.","a":["will have been snowing"],"r":"dur","ru":"Через час снег будет идти уже целые сутки.","uz":"Bir soatdan keyin qor butun kundan beri yog'ayotgan bo'ladi."},{"e":0,"q":"When he arrives, I ___ (cook) all afternoon.","a":["will have been cooking"],"r":"bythe","ru":"Когда он приедет, я буду готовить весь день.","uz":"U yetib kelganida men tushdan keyin butun vaqt ovqat pishirayotgan bo'laman."},{"e":0,"q":"By 2030 scientists ___ (research) this for 30 years.","a":["will have been researching"],"r":"dur","ru":"К 2030 году учёные будут изучать это уже 30 лет.","uz":"2030-yilga kelib olimlar buni 30 yildan beri o'rganayotgan bo'ladi."},{"e":1,"q":"I will have been working for long.","a":["I won't have been working for long.","I will not have been working for long."],"r":"neg","ru":"Я не буду работать долго.","uz":"Men uzoq ishlamayotgan bo'laman."},{"e":1,"q":"She will have been waiting for an hour.","a":["She won't have been waiting for an hour.","She will not have been waiting for an hour."],"r":"neg","ru":"Она не будет ждать час.","uz":"U bir soatdan beri kutmayotgan bo'ladi."},{"e":1,"q":"They will have been living here for ten years.","a":["They won't have been living here for ten years.","They will not have been living here for ten years."],"r":"neg","ru":"Они не будут жить здесь десять лет.","uz":"Ular bu yerda o'n yildan beri yashamayotgan bo'ladi."},{"e":1,"q":"We will have been travelling for a week.","a":["We won't have been travelling for a week.","We will not have been travelling for a week."],"r":"neg","ru":"Мы не будем путешествовать неделю.","uz":"Biz bir haftadan beri sayohat qilmayotgan bo'lamiz."},{"e":1,"q":"He will have been studying all night.","a":["He won't have been studying all night.","He will not have been studying all night."],"r":"neg","ru":"Он не будет заниматься всю ночь.","uz":"U tun bo'yi o'qimayotgan bo'ladi."},{"e":1,"q":"You will have been sleeping for ten hours.","a":["You won't have been sleeping for ten hours.","You will not have been sleeping for ten hours."],"r":"neg","ru":"Ты не будешь спать десять часов.","uz":"Siz o'n soatdan beri uxlamayotgan bo'lasiz."},{"e":2,"q":"you / work / here / for ten years","a":["Will you have been working here for ten years?"],"r":"q","ru":"Ты будешь работать здесь десять лет?","uz":"Siz bu yerda o'
