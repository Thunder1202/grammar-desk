</div><script src="app.js"></script><script>window.GD_EXAM={"id":"c1-1","level":"c1.html","lvl":"C1/C2","topics":{"inversion-full":"Inversion (full)","emphasis-cleft-sentences":"Emphasis: cleft sentences","nominalisation":"Nominalisation","participle-clauses":"Participle clauses","subjunctive-and-unreal-past":"Subjunctive and unreal past","advanced-passives":"Advanced passives"},"next":{"u":"alternatives-to-if.html","t":"Alternatives to if","k":"nxt"},"q":[{"s":"inversion-full","q":"Hardly ___ home when the phone rang.","o":["had I got","I had got","did I get to"],"a":0,"w":[["Hardly ... when takes the past perfect with inversion.","Hardly ... when требует past perfect с инверсией.","Hardly ... when inversiya bilan past perfect talab qiladi."],["Normal word order is wrong after Hardly at the start.","После Hardly в начале обычный порядок неверен.","Boshida Hardly bo'lsa, oddiy tartib xato."],["The first action came earlier, so the past perfect is needed.","Первое действие было раньше, поэтому нужен past perfect.","Birinchi ish oldinroq bo'lgan, shuning uchun past perfect kerak."]]},{"s":"inversion-full","q":"Only after the meeting ___ the truth.","o":["did she learn","she learned","she did learn"],"a":0,"w":[["Only after + time at the start needs inversion: did she learn.","Only after + время в начале требует инверсии: did she learn.","Boshida only after + vaqt bo'lsa, inversiya kerak: did she learn."],["Normal word order is wrong here.","Обычный порядок здесь неверен.","Bu yerda oddiy tartib xato."],["She did learn is emphasis, not inversion.","She did learn — усиление, а не инверсия.","She did learn kuchaytirish, inversiya emas."]]},{"s":"emphasis-cleft-sentences","q":"___ I need is a long holiday.","o":["What","That","Which"],"a":0,"w":[["What + clause + is focuses on the thing you need.","What + придаточное + is выделяет то, что нужно.","What + gap + is kerakli narsani ta'kidlaydi."],["That cannot start this kind of cleft sentence.","That не может начинать такую конструкцию.","That bunday konstruksiyani boshlay olmaydi."],["Which needs a noun or a choice; it does not fit here.","Which требует выбора или существительного и здесь не подходит.","Which tanlov yoki ot talab qiladi, bu yerga mos emas."]]},{"s":"emphasis-cleft-sentences","q":"It was Sara ___ broke the window, not Tom.","o":["who","what","whom"],"a":0,"w":[["It was + person + who stresses the person.","It was + человек + who выделяет человека.","It was + odam + who odamni ta'kidlaydi."],["What is not used after a person in this pattern.","What не ставится после человека в этой конструкции.","Bu tuzilmada odamdan keyin what kelmaydi."],["Whom is an object form, but Sara did the breaking.","Whom — объектная форма, а окно разбила сама Сара.","Whom obyekt shakli, oynani esa Saraning o'zi sindirgan."]]},{"s":"nominalisation","q":"Prices increased, which worried people. = The ___ prices worried people.","o":["increase in","increasing of the","increased in"],"a":0,"w":[["The noun increase takes in: the increase in prices.","Существительное increase идёт с in: the increase in prices.","Increase oti in bilan keladi: the increase in prices."],["This is a clumsy noun form that formal writing avoids.","Это неуклюжая форма, в формальном письме её избегают.","Bu qo'pol shakl, rasmiy yozuvda ishlatilmaydi."],["Increased is a verb form; here we need a noun.","Increased — форма глагола, а нужно существительное.","Increased fe'l shakli, bu yerda ot kerak."]]},{"s":"nominalisation","q":"They decided to close the factory. = Their ___ the factory surprised everyone.","o":["decision to close","deciding close","decide to close"],"a":0,"w":[["The noun decision takes to + verb.","Существительное decision идёт с to + глагол.","Decision oti to + fe'l bilan keladi."],["Deciding close has no link between the two verbs.","В deciding close нет связи между глаголами.","Deciding close da ikki fe'l o'rtasida bog'lanish yo'q."],["After their we need a noun, not the verb decide.","После their нужно существительное, а не глагол decide.","Their dan keyin decide fe'li emas, ot kerak."]]},{"s":"participle-clauses","q":"___ the letter, she started to cry.","o":["Having read","Have read","Had reading"],"a":0,"w":[["Having + past participle shows the earlier action.","Having + третья форма показывает более раннее действие.","Having + uchinchi shakl oldinroq bo'lgan ishni bildiradi."],["Have read is not a participle form.","Have read — не причастная форма.","Have read sifatdosh shakli emas."],["Had reading is not a real form.","Had reading — такой формы нет.","Had reading degan shakl yo'q."]]},{"s":"participle-clauses","q":"___ in 1900, the house is now a museum.","o":["Built","Building","Having built"],"a":0,"w":[["The house was built by someone: passive participle.","Дом кем-то построен: пассивное причастие.","Uyni kimdir qurgan: majhul sifatdosh."],["Building means the house built something.","Building значит, что дом что-то строил.","Building uy nimadir qurgan degan ma'noni beradi."],["Having built also means the house did the building.","Having built тоже значит, что строил сам дом.","Having built ham uyning o'zi qurganini bildiradi."]]},{"s":"subjunctive-and-unreal-past","q":"The doctor suggested that he ___ more rest.","o":["get","gets","will get"],"a":0,"w":[["After suggest that, formal English uses the base verb.","После suggest that в формальном языке — начальная форма.","Rasmiy tilda suggest that dan keyin fe'lning asl shakli keladi."],["No -s in the subjunctive form.","В сослагательной форме нет -s.","Subjunktivda -s qo'shilmaydi."],["Will is not used in this structure.","В этой конструкции will не используется.","Bu tuzilmada will ishlatilmaydi."]]},{"s":"subjunctive-and-unreal-past","q":"It's time we ___ home.","o":["went","go","will go"],"a":0,"w":[["After it's time + subject we use the past form for the present.","После it's time + подлежащее о настоящем — форма прошедшего.","It's time + ega dan keyin hozir uchun o'tgan shakl keladi."],["The present form is wrong after it's time we.","После it's time we настоящее время неверно.","It's time we dan keyin hozirgi zamon xato."],["Will is not used after it's time we.","После it's time we не используем will.","It's time we dan keyin will ishlatilmaydi."]]},{"s":"advanced-passives","q":"He ___ to be the best surgeon in the city.","o":["is said","says","is saying"],"a":0,"w":[["Impersonal passive: he is said to be.","Безличный пассив: he is said to be.","Shaxssiz passiv: he is said to be."],["He says to be is not correct.","He says to be — неправильно.","He says to be xato."],["Is saying is active, and it does not fit to be.","Is saying — актив, он не сочетается с to be.","Is saying faol shakl, to be bilan mos kelmaydi."]]},{"s":"advanced-passives","q":"The prisoners are believed ___ last night.","o":["to have escaped","to escape","escaping"],"a":0,"w":[["An earlier action: to have + past participle.","Более раннее действие: to have + третья форма.","Oldinroq bo'lgan ish: to have + uchinchi shakl."],["To escape does not show the past, and last night is past.","To escape не показывает прошлое, а last night — прошлое.","To escape o'tmishni ko'rsatmaydi, last night esa o'tgan."],["Believed is not followed by -ing here.","После believed здесь не ставим -ing.","Bu yerda believed dan keyin -ing kelmaydi."]]}]};
</script><script src="exam.js"></script></body></html>
