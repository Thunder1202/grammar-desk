</div><script src="app.js"></script><script>window.GD_QUIZ={"id":"to-be","rules":{"am":{"en":"With <b>I</b> we always use <b>am</b>: I am a student.","ru":"С <b>I</b> всегда используем <b>am</b>: I am a student.","uz":"<b>I</b> bilan doim <b>am</b> ishlatiladi: I am a student."},"is":{"en":"With <b>he / she / it</b> or one person or thing, use <b>is</b>: She is my sister.","ru":"С <b>he / she / it</b> или одним человеком либо предметом используем <b>is</b>: She is my sister.","uz":"<b>he / she / it</b> yoki bitta odam yo narsa bilan <b>is</b> ishlatiladi: She is my sister."},"are":{"en":"With <b>you / we / they</b> or more than one person or thing, use <b>are</b>: They are at home.","ru":"С <b>you / we / they</b> или несколькими людьми либо предметами используем <b>are</b>: They are at home.","uz":"<b>you / we / they</b> yoki bir nechta odam yo narsa bilan <b>are</b> ishlatiladi: They are at home."},"neg":{"en":"To say no, put <b>not</b> after am, is or are: I'm not, she isn't, they aren't.","ru":"Чтобы сказать «нет», ставим <b>not</b> после am, is или are: I'm not, she isn't, they aren't.","uz":"Inkor uchun am, is yoki are dan keyin <b>not</b> qo'yiladi: I'm not, she isn't, they aren't."},"short":{"en":"Short forms use an apostrophe: I'm, he's, they're, isn't, aren't.","ru":"В коротких формах есть апостроф: I'm, he's, they're, isn't, aren't.","uz":"Qisqa shakllarda apostrof bor: I'm, he's, they're, isn't, aren't."},"q":{"en":"For a question, put <b>am, is, are</b> before the person: Are you a student?","ru":"В вопросе ставим <b>am, is, are</b> перед человеком: Are you a student?","uz":"So'roqda <b>am, is, are</b> odamdan oldin keladi: Are you a student?"},"sa":{"en":"Short answers repeat the word: Yes, I am. No, he isn't. After yes we do not use a short form: Yes, she is.","ru":"В кратком ответе повторяем слово: Yes, I am. No, he isn't. После yes не сокращаем: Yes, she is.","uz":"Qisqa javobda so'z takrorlanadi: Yes, I am. No, he isn't. Yes dan keyin qisqartirilmaydi: Yes, she is."},"wh":{"en":"Question words go first, then am, is or are: Where are you from?","ru":"Вопросительное слово идёт первым, затем am, is или are: Where are you from?","uz":"So'roq so'zi birinchi, keyin am, is yoki are keladi: Where are you from?"},"adv":{"en":"<b>always, usually, often, sometimes, never</b> go <b>after</b> am, is, are: She is always late.","ru":"<b>always, usually, often, sometimes, never</b> ставим <b>после</b> am, is, are: She is always late.","uz":"<b>always, usually, often, sometimes, never</b> am, is, are dan <b>keyin</b> keladi: She is always late."},"need":{"en":"English sentences need am, is or are. We cannot leave them out: She is tired.","ru":"В английском предложении нужны am, is или are, их нельзя пропустить: She is tired.","uz":"Ingliz tilida gapda am, is yoki are kerak, ularni tushirib bo'lmaydi: She is tired."},"age":{"en":"For age we use <b>be</b>, not have: I am 20 years old.","ru":"Для возраста используем <b>be</b>, а не have: I am 20 years old.","uz":"Yosh uchun have emas, <b>be</b> ishlatiladi: I am 20 years old."},"order":{"en":"Normal order: person + am, is, are + the rest: The house is very big.","ru":"Обычный порядок: человек + am, is, are + остальное: The house is very big.","uz":"Oddiy tartib: odam + am, is, are + qolgani: The house is very big."}},"ex":[{"h":{"en":"Write am, is or are for each word. Example: I → am.","ru":"Напишите am, is или are для каждого слова. Например: I → am.","uz":"Har bir so'z uchun am, is yoki are yozing. Masalan: I → am."}},{"h":{"en":"Write the correct word: one of the two in brackets.","ru":"Напишите правильное слово: одно из двух в скобках.","uz":"To'g'ri so'zni yozing: qavsdagi ikkitadan birini."}},{"h":{"en":"Write am, is or are in the sentence.","ru":"Напишите am, is или are в предложении.","uz":"Gapga am, is yoki are yozing."}},{"h":{"en":"Madina's family. Use the words in the box.","ru":"Семья Мадины. Используйте слова из рамки.","uz":"Madinaning oilasi. Qutidagi so'zlardan
