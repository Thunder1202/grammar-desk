</div><script src="app.js"></script><script>window.GD_EXAM={"id":"c1-2","level":"c1.html","lvl":"C1/C2","topics":{"alternatives-to-if":"Alternatives to if","register-and-style":"Register and style","cohesive-devices-for-writing":"Cohesive devices for writing","ellipsis-and-substitution":"Ellipsis and substitution"},"next":{"u":"index.html","k":"home"},"q":[{"s":"alternatives-to-if","q":"___ you need help, call this number.","o":["Should","Would","Had"],"a":0,"w":[["Should + subject means if, in formal English.","Should + подлежащее значит if в формальном языке.","Should + ega rasmiy tilda if ma'nosini beradi."],["Would cannot replace if at the start like this.","Would так не заменяет if в начале.","Would boshida if o'rnini bunday bosa olmaydi."],["Had needs a past participle: had you needed.","После had нужна третья форма: had you needed.","Had dan keyin uchinchi shakl keladi: had you needed."]]},{"s":"alternatives-to-if","q":"You can borrow it ___ you bring it back on Friday.","o":["provided that","unless","even so"],"a":0,"w":[["Provided that means only if.","Provided that значит «только если».","Provided that faqat agar degani."],["Unless means if not, which reverses the meaning.","Unless значит «если не», смысл меняется на обратный.","Unless agar ... bo'lmasa degani, ma'no teskari bo'ladi."],["Even so joins two sentences. It does not give a condition.","Even so связывает предложения, а условия не задаёт.","Even so gaplarni bog'laydi, shart bildirmaydi."]]},{"s":"register-and-style","q":"Which sentence is best for a formal email?","o":["I regret to inform you of the delay.","Sorry, it's gonna be late.","Bad news, guys: it's late."],"a":0,"w":[["Regret to inform is polite and formal.","Regret to inform вежливо и формально.","Regret to inform muloyim va rasmiy."],["Gonna is spoken English, not for a formal email.","Gonna — разговорное слово, не для формального письма.","Gonna og'zaki so'z, rasmiy xatga mos emas."],["Guys and bad news are too informal.","Guys и bad news слишком неформальны.","Guys va bad news juda norasmiy."]]},{"s":"register-and-style","q":"Which word is most formal for 'get' in 'get a refund'?","o":["obtain","grab","nab"],"a":0,"w":[["Obtain is the formal choice.","Obtain — формальный вариант.","Obtain rasmiy variant."],["Grab is informal.","Grab — разговорное слово.","Grab norasmiy so'z."],["Nab is slang.","Nab — сленг.","Nab jargon so'z."]]},{"s":"cohesive-devices-for-writing","q":"Sales fell sharply. ___ decline was caused by high prices.","o":["This","These","They"],"a":0,"w":[["This + noun points back to the whole idea and links the sentences.","This + существительное отсылает к предыдущей мысли.","This + ot oldingi fikrga ishora qilib, gaplarni bog'laydi."],["These needs a plural noun, but decline is singular.","These требует множественного числа, а decline — единственное.","These ko'plik talab qiladi, decline esa birlikda."],["They cannot go before a noun.","They не ставится перед существительным.","They otdan oldin kelmaydi."]]},{"s":"cohesive-devices-for-writing","q":"Many students work part-time. ___, they have less time to study.","o":["As a result","In contrast","For instance"],"a":0,"w":[["The second idea is a result of the first.","Вторая мысль — результат первой.","Ikkinchi fikr birinchisining natijasi."],["In contrast shows a difference, and there is none here.","In contrast показывает различие, а его здесь нет.","In contrast farqni bildiradi, bu yerda esa farq yo'q."],["For instance gives an example, not a result.","For instance приводит пример, а не результат.","For instance misol keltiradi, natija emas."]]},{"s":"ellipsis-and-substitution","q":"\"Is it going to rain?\" \"I hope ___.\" (I don't want rain.)","o":["not","so","don't"],"a":0,"w":[["Hope not replaces I hope it won't.","Hope not заменяет I hope it won't.","Hope not I hope it won't o'rnini bosadi."],["Hope so would mean you want rain.","Hope so значило бы, что вы хотите дождя.","Hope so yomg'irni xohlashni bildirardi."],["We never say I hope don't.","I hope don't не говорят.","I hope don't deyilmaydi."]]},{"s":"ellipsis-and-substitution","q":"I wanted a large coffee, but they only had small ___.","o":["ones","one","some of"],"a":0,"w":[["Ones replaces a plural noun after an adjective.","Ones заменяет существительное во множественном числе.","Ones ko'plikdagi otning o'rnini bosadi."],["One needs a before the adjective: a small one.","Перед one нужен a: a small one.","One bilan sifat oldidan a kerak: a small one."],["Some of needs a noun after it.","После some of нужно существительное.","Some of dan keyin ot kerak."]]}]};
