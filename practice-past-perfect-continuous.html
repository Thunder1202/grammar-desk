</div><script src="app.js"></script><script>window.GD_QUIZ={"id":"past-perfect-continuous","rules":{"f":{"en":"Form: <b>had + been + verb-ing</b> for all people: I <b>had been</b> waiting, she <b>had been</b> waiting, they <b>had been</b> waiting. Short form: I'd been.","ru":"Форма: <b>had + been + глагол-ing</b> для всех лиц: I <b>had been</b> waiting, she <b>had been</b> waiting, they <b>had been</b> waiting. Краткая форма: I'd been.","uz":"Shakli: <b>had + been + fe'l-ing</b> barcha shaxslar uchun: I <b>had been</b> waiting, she <b>had been</b> waiting, they <b>had been</b> waiting. Qisqa shakl: I'd been."},"ing":{"en":"Spelling of -ing: make → making, run → running, lie → lying, study → studying.","ru":"Правописание -ing: make → making, run → running, lie → lying, study → studying.","uz":"-ing imlosi: make → making, run → running, lie → lying, study → studying."},"dur":{"en":"<b>Duration before a moment in the past</b>: an action was going on for some time before another past event. When she arrived, I <b>had been waiting</b> for an hour.","ru":"<b>Длительность до момента в прошлом</b>: действие продолжалось некоторое время до другого события в прошлом. When she arrived, I <b>had been waiting</b> for an hour.","uz":"<b>O'tmishdagi paytgacha davomiylik</b>: ish boshqa o'tgan voqeadan oldin bir muddat davom etgan. When she arrived, I <b>had been waiting</b> for an hour."},"cause":{"en":"<b>Cause of a past situation</b>: we explain a result we saw in the past. Her eyes were red. She <b>had been crying</b>. He was tired. He <b>had been working</b> all night.","ru":"<b>Причина прошлой ситуации</b>: объясняем результат, который мы видели в прошлом. Her eyes were red. She <b>had been crying</b>. He was tired. He <b>had been working</b> all night.","uz":"<b>O'tmishdagi holat sababi</b>: o'tmishda ko'rgan natijamizni tushuntiramiz. Her eyes were red. She <b>had been crying</b>. He was tired. He <b>had been working</b> all night."},"fs":{"en":"<b>for</b> + a period (for an hour, for two years). <b>since</b> + a starting point (since 8 o'clock, since 2019, since morning).","ru":"<b>for</b> + период (for an hour, for two years). <b>since</b> + точка начала (since 8 o'clock, since 2019, since morning).","uz":"<b>for</b> + davr (for an hour, for two years). <b>since</b> + boshlanish nuqtasi (since 8 o'clock, since 2019, since morning)."},"neg":{"en":"Negative: <b>hadn't + been + verb-ing</b>: I <b>hadn't been</b> sleeping well. They <b>hadn't been</b> working.","ru":"Отрицание: <b>hadn't + been + глагол-ing</b>: I <b>hadn't been</b> sleeping well. They <b>hadn't been</b> working.","uz":"Inkor: <b>hadn't + been + fe'l-ing</b>: I <b>hadn't been</b> sleeping well. They <b>hadn't been</b> working."},"q":{"en":"Question: <b>Had + subject + been + verb-ing?</b> Had you been waiting long? Had she been crying?","ru":"Вопрос: <b>Had + подлежащее + been + глагол-ing?</b> Had you been waiting long? Had she been crying?","uz":"So'roq: <b>Had + ega + been + fe'l-ing?</b> Had you been waiting long? Had she been crying?"},"sa":{"en":"Short answers use <b>had</b>: Yes, I <b>had</b>. / No, she <b>hadn't</b>. Do not repeat been + verb-ing.","ru":"Краткие ответы с <b>had</b>: Yes, I <b>had</b>. / No, she <b>hadn't</b>. been + глагол-ing не повторяйте.","uz":"Qisqa javoblar <b>had</b> bilan: Yes, I <b>had</b>. / No, she <b>hadn't</b>. been + fe'l-ing ni takrorlamang."},"hl":{"en":"Question: <b>How long + had + subject + been + verb-ing?</b> How long had you been waiting?","ru":"Вопрос: <b>How long + had + подлежащее + been + глагол-ing?</b> How long had you been waiting?","uz":"So'roq: <b>How long + had + ega + been + fe'l-ing?</b> How long had you been waiting?"},"pp":{"en":"<b>Continuous</b> = the activity and how long (I'd been reading for hours). <b>Simple</b> = the result, how many, finished (I'd read three books).","ru":"<b>Continuous</b> = процесс и его длительность (I'd been reading for hours). <b>Simple</b> = результат, сколько, завершено (I'd read three books).","uz":"<b>Continuous</b> = jarayon va davomiylik (I'd been reading for hours). <b>Simple</b> = natija, nechta, tugagan (I'd read three books)."},"ps":{"en":"Past Simple = the main event (<b>arrived</b>). Past Perfect Continuous = the longer action before it (<b>had been waiting</b>). Order: first the long action, then the event.","ru":"Past Simple = главное событие (<b>arrived</b>). Past Perfect Continuous = более длинное действие до него (<b>had been waiting</b>). Порядок: сначала длинное действие, потом событие.","uz":"Past Simple = asosiy voqea (<b>arrived</b>). Past Perfect Continuous = undan oldingi uzoqroq ish (<b>had been waiting</b>). Tartib: avval uzoq ish, keyin voqea."},"state":{"en":"<b>State verbs</b> (know, like, love, want, need, believe) do not take the continuous: I <b>had known</b> him for years (not had been knowing).","ru":"<b>Глаголы состояния</b> (know, like, love, want, need, believe) не используются в continuous: I <b>had known</b> him for years (не had been knowing).","uz":"<b>Holat fe'llari</b> (know, like, love, want, need, believe) continuous da ishlatilmaydi: I <b>had known</b> him for years (had been knowing emas)."},"order":{"en":"Word order: <b>subject + had + been + verb-ing + the rest</b>. Questions: <b>(How long) + had + subject + been + verb-ing?</b>","ru":"Порядок слов: <b>подлежащее + had + been + глагол-ing + остальное</b>. Вопросы: <b>(How long) + had + подлежащее + been + глагол-ing?</b>","uz":"So'zlar tartibi: <b>ega + had + been + fe'l-ing + qolgani</b>. So'roq: <b>(How long) + had + ega + been + fe'l-ing?</b>"}},"ex":[{"h":{"en":"Write the verb in brackets in the Past Perfect Continuous. Write all words, for example: had been waiting.","ru":"Напишите глагол из скобок в Past Perfect Continuous. Пишите все слова, например: had been waiting.","uz":"Qavs ichidagi fe'lni Past Perfect Continuous da yozing. Hamma so'zlarni yozing, masalan: had been waiting."}},{"h":{"en":"Make the sentence negative. Write the full sentence.","ru":"Сделайте предложение отрицательным. Напишите его полностью.","uz":"Gapni inkor qiling. To'liq gapni yozing."}},{"h":{"en":"Make a question. Write the full question.","ru":"Составьте вопрос. Напишите вопрос полностью.","uz":"Savol tuzing. To'liq savolni yozing."}},{"h":{"en":"Write a short answer. ✓ = yes, ✗ = no. Example: Had he been working? (✓) → Yes, he had.","ru":"Напишите краткий ответ. ✓ = да, ✗ = нет. Например: Had he been working? (✓) → Yes, he had.","uz":"Qisqa javob yozing. ✓ = ha, ✗ = yo'q. Masalan: Had he been working? (✓) → Yes, he had."}},{"h":{"en":"Write for or since.","ru":"Напишите for или since.","uz":"for yoki since yozing."}},{"h":{"en":"Past Perfect or Past Perfect Continuous? Continuous = the activity and how long. Simple = the result and how many.","ru":"Past Perfect или Past Perfect Continuous? Continuous = процесс и длительность. Simple = результат и количество.","uz":"Past Perfect yoki Past Perfect Continuous? Continuous = jarayon va davomiylik. Simple = natija va miqdor."}},{"h":{"en":"Why was it like that? Write the verb in brackets in the Past Perfect Continuous.","ru":"Почему так было? Напишите глагол из скобок в Past Perfect Continuous.","uz":"Nega shunday edi? Qavs ichidagi fe'lni Past Perfect Continuous da yozing."}},{"h":{"en":"A long action before an event. Write the verbs in brackets in the correct tense.","ru":"Длинное действие до события. Напишите глагол из скобок в нужном времени.","uz":"Voqeadan oldingi uzoq ish. Qavs ichidagi fe'lni to'g'ri zamonda yozing."}},{"h":{"en":"Questions with How long. Write the full question.","ru":"Вопросы с How long. Напишите вопрос полностью.","uz":"How long bilan savollar. To'liq savolni yozing."}},{"h":{"en":"State verb or action verb? Write the verb in brackets in the correct form.","ru":"Глагол состояния или действия? Напишите глагол из скобок в нужной форме.","uz":"Holat fe'li yoki harakat fe'li? Qavs ichidagi fe'lni to'g'ri shaklda yozing."}},{"h":{"en":"Find the mistake and write the correct sentence.","ru":"Найдите ошибку и напишите правильное предложение.","uz":"Xatoni toping va to'g'ri gapni yozing."}},{"h":{"en":"Put the words in the correct order.","ru":"Расставьте слова в правильном порядке.","uz":"So'zlarni to'g'ri tartibga qo'ying."}}],"q":[{"e":0,"q":"When she arrived, I ___ (wait) for an hour.","a":["had been waiting"],"r":"dur","ru":"Когда она пришла, я ждал уже час.","uz":"U kelganida men bir soatdan beri kutayotgan edim."},{"e":0,"q":"He was tired because he ___ (work) all night.","a":["had been working"],"r":"cause","ru":"Он устал, потому что работал всю ночь.","uz":"U charchagan edi, chunki tun bo'yi ishlagan edi."},{"e":0,"q":"They ___ (play) football for two hours when it started to rain.","a":["had been playing"],"r":"dur","ru":"Они играли в футбол уже два часа, когда пошёл дождь.","uz":"Yomg'ir yog'a boshlaganida ular ikki soatdan beri futbol o'ynayotgan edi."},{"e":0,"q":"She ___ (cry), so her eyes were red.","a":["had been crying"],"r":"cause","ru":"Она плакала, поэтому у неё были красные глаза.","uz":"U yig'lagan edi, shuning uchun ko'zlari qizargan edi."},{"e":0,"q":"We ___ (drive) for six hours before we stopped.","a":["had been driving"],"r":"dur","ru":"Мы ехали шесть часов, прежде чем остановились.","uz":"Biz to'xtashimizdan oldin olti soat haydagan edik."},{"e":0,"q":"I ___ (study) English for two years before I moved to London.","a":["had been studying"],"r":"dur","ru":"Я учил английский два года, прежде чем переехал в Лондон.","uz":"Londonga ko'chishimdan oldin men ikki yil ingliz tilini o'rganayotgan edim."},{"e":0,"q":"The ground was wet. It ___ (rain).","a":["had been raining"],"r":"cause","ru":"Земля была мокрой. Шёл дождь.","uz":"Yer nam edi. Yomg'ir yog'gan edi."},{"e":0,"q":"My hands were dirty. I ___ (work) in the garden.","a":["had been working"],"r":"cause","ru":"Мои руки были грязными. Я работал в саду.","uz":"Qo'llarim iflos edi. Men bog'da ishlagan edim."},{"e":0,"q":"The children ___ (run) around, so they were out of breath.","a":["had been running"],"r":"cause","ru":"Дети бегали, поэтому они запыхались.","uz":"Bolalar yugurib yurgan edi, shuning uchun nafaslari qisilgan edi."},{"e":0,"q":"He ___ (lie) in the sun for hours, so his face was red.","a":["had been lying"],"r":"ing","ru":"Он часами лежал на солнце, поэтому его лицо было красным.","uz":"U soatlab quyoshda yotgan edi, shuning uchun yuzi qizargan edi."},{"e":0,"q":"She ___ (sit) there since morning when we found her.","a":["had been sitting"],"r":"ing","ru":"Она сидела там с утра, когда мы её нашли.","uz":"Biz uni topganimizda u ertalabdan beri o'sha yerda o'tirgan edi."},{"e":0,"q":"They ___ (talk) on the phone for ages.","a":["had been talking"],"r":"dur","ru":"Они разговаривали по телефону целую вечность.","uz":"Ular telefonda uzoq gaplashayotgan edi."},{"e":1,"q":"I had been sleeping well.","a":["I hadn't been sleeping well.","I had not been sleeping well."],"r":"neg","ru":"Я плохо спал.","uz":"Men yaxshi uxlamagan edim."},{"e":1,"q":"They had been working hard.","a":["They hadn't been working hard.","They had not been working hard."],"r":"neg","ru":"Они не работали усердно.","uz":"Ular qattiq ishlamagan edi."},{"e":1,"q":"She had been waiting for a long time.","a":["She hadn't been waiting for a long time.","She had not been waiting for a long time."],"r":"neg","ru":"Она ждала не так уж долго.","uz":"U uzoq kutmagan edi."},{"e":1,"q":"It had been raining.","a":["It hadn't been raining.","It had not been raining."],"r":"neg","ru":"Дождя не было.","uz":"Yomg'ir yog'magan edi."},{"e":1,"q":"We had been studying.","a":["We hadn't been studying.","We had not been studying."],"r":"neg","ru":"Мы не занимались.","uz":"Biz o'qimagan edik."},{"e":1,"q":"He had been running.","a":["He hadn't been running.","He had not been running."],"r":"neg","ru":"Он не бегал.","uz":"U yugurmagan edi."},{"e":2,"q":"you / wait / long","a":["Had you been waiting long?"],"r":"q","ru":"Ты давно ждал?","uz":"Siz uzoq kutgan edingizmi?"},{"e":2,"q":"she / cry","a":["Had she been crying?"],"r":"q","ru":"Она плакала?","uz":"U yig'lagan edimi?"},{"e":2,"q":"they / work / all day","a":["Had they been working all day?"],"r":"q","ru":"Они работали весь день?","uz":"Ular kun bo'yi ishlagan edimi?"},{"e":2,"q":"it / snow","a":["Had it been snowing?"],"r":"q","ru":"Шёл снег?","uz":"Qor yog'gan edimi?"},{"e":2,"q":"he / drive / for hours","a":["Had he been driving for hours?"],"r":"q","ru":"Он ехал несколько часов?","uz":"U soatlab mashina haydagan edimi?"},{"e":2,"q":"the children / play / outside","a":["Had the children been playing outside?"],"r":"q","ru":"Дети играли на улице?","uz":"Bolalar tashqarida o'ynagan edimi?"},{"e":3,"q":"Had you been waiting long? (✓)","a":["Yes, I had."],"r":"sa","ru":"Ты давно ждал? Да.","uz":"Uzoq kutgan edingizmi? Ha."},{"e":3,"q":"Had she been crying? (✗)","a":["No, she hadn't.","No, she had not."],"r":"sa","ru":"Она плакала? Нет.","uz":"U yig'lagan edimi? Yo'q."},{"e":3,"q":"Had they been working? (✓)","a":["Yes, they had."],"r":"sa","ru":"Они работали? Да.","uz":"Ular ishlagan edimi? Ha."},{"e":3,"q":"Had it been raining? (✗)","a":["No, it hadn't.","No, it had not."],"r":"sa","ru":"Шёл дождь? Нет.","uz":"Yomg'ir yog'gan edimi? Yo'q."},{"e":4,"q":"She had been working here ___ 2015.","a":["since"],"r":"fs","ru":"Она работала здесь с 2015 года.","uz":"U bu yerda 2015-yildan beri ishlagan edi."},{"e":4,"q":"I had been waiting ___ an hour.","a":["for"],"r":"fs","ru":"Я ждал уже час.","uz":"Men bir soatdan beri kutgan edim."},{"e":4,"q":"They had been living there ___ ten years.","a":["for"],"r":"fs","ru":"Они жили там десять лет.","uz":"Ular u yerda o'n yildan beri yashagan edi."},{"e":4,"q":"He had been studying ___ morning.","a":["since"],"r":"fs","ru":"Он занимался с утра.","uz":"U ertalabdan beri o'qigan edi."},{"e":4,"q":"We had been friends ___ we were children.","a":["since"],"r":"fs","ru":"Мы дружили с детства.","uz":"Biz bolaligimizdan beri do'st edik."},{"e":4,"q":"She had been ill ___ a week.","a":["for"],"r":"fs","ru":"Она болела неделю.","uz":"U bir haftadan beri kasal edi."},{"e":5,"q":"I was tired. I ___ (run) for an hour.","a":["had been running"],"r":"pp","ru":"Я устал. Я бегал час.","uz":"Men charchagan edim. Bir soat yugurgan edim."},{"e":5,"q":"I was proud. I ___ (run) five kilometres.","a":["had run"],"r":"pp","ru":"Я гордился. Я пробежал пять километров.","uz":"Men faxrlanardim. Besh kilometr yugurgan edim."},{"e":5,"q":"She ___ (read) three books by the end of the week.","a":["had read"],"r":"pp","ru":"К концу недели она прочитала три книги.","uz":"Hafta oxiriga kelib u uchta kitob o'qigan edi."},{"e":5,"q":"She ___ (read) all afternoon, so her eyes hurt.","a":["had been reading"],"r":"pp","ru":"Она читала весь день, поэтому у неё болели глаза.","uz":"U tushdan keyin butun vaqt o'qigan edi, shuning uchun ko'zlari og'rirdi."},{"e":5,"q":"He ___ (paint) the room. It looked new.","a":["had painted"],"r":"pp","ru":"Он покрасил комнату. Она выглядела как новая.","uz":"U xonani bo'yagan edi. Xona yangidek ko'rinardi."},{"e":5,"q":"He ___ (paint) all day, so he was covered in paint.","a":["had been painting"],"r":"pp","ru":"Он красил весь день, поэтому был весь в краске.","uz":"U kun bo'yi bo'yagan edi, shuning uchun bo'yoqqa belangan edi."},{"e":5,"q":"They ___ (build) the bridge for two years when the money ran out.","a":["had been building"],"r":"pp","ru":"Они строили мост два года, когда закончились деньги.","uz":"Pul tugaganida ular ikki yildan beri ko'prik qurayotgan edi."},{"e":5,"q":"By midnight, I ___ (write) ten pages.","a":["had written"],"r":"pp","ru":"К полуночи я написал десять страниц.","uz":"Yarim tungacha men o'n bet yozgan edim."},{"e":6,"q":"Her face was red. She ___ (run).","a":["had been running"],"r":"cause","ru":"Её лицо было красным. Она бегала.","uz":"Uning yuzi qizargan edi. U yugurgan edi."},{"e":6,"q":"The kitchen was hot. Dad ___ (cook).","a":["had been cooking"],"r":"cause","ru":"На кухне было жарко. Папа готовил.","uz":"Oshxona issiq edi. Dadam ovqat pishirgan edi."},{"e":6,"q":"He looked sleepy. He ___ (study) all night.","a":["had been studying"],"r":"cause","ru":"Он выглядел сонным. Он занимался всю ночь.","uz":"U uyquchan ko'rinardi. U tun bo'yi o'qigan edi."},{"e":6,"q":"The road was white. It ___ (snow) for hours.","a":["had been snowing"],"r":"cause","ru":"Дорога была белой. Снег шёл несколько часов.","uz":"Yo'l oppoq edi. Qor soatlab yog'gan edi."},{"e":6,"q":"Her hair was wet. She ___ (swim).","a":["had been swimming"],"r":"cause","ru":"Её волосы были мокрыми. Она плавала.","uz":"Uning sochlari nam edi. U suzgan edi."},{"e":6,"q":"I had a headache. I ___ (look) at the screen too long.","a":["had been looking"],"r":"cause","ru":"У меня болела голова. Я слишком долго смотрел в экран.","uz":"Boshim og'rirdi. Men ekranga juda uzoq qaragan edim."},{"e":7,"q":"I ___ (wait) for twenty minutes when the bus finally ___ (come).","a":["had been waiting, came"],"r":"ps","ru":"Я ждал уже двадцать минут, когда наконец пришёл автобус.","uz":"Avtobus nihoyat kelganida men yigirma daqiqadan beri kutayotgan edim.","n":"Write both verbs, separated by a comma."},{"e":7,"q":"When the teacher came in, we ___ (talk) for ten minutes.","a":["had been talking"],"r":"ps","ru":"Когда вошёл учитель, мы разговаривали уже десять минут.","uz":"O'qituvchi kirganida biz o'n daqiqadan beri gaplashayotgan edik."},{"e":7,"q":"He ___ (work) at the bank for ten years when he lost his job.","a":["had been working"],"r":"ps","ru":"Он работал в банке десять лет, когда потерял работу.","uz":"U ishdan ayrilganida o'n yildan beri bankda ishlayotgan edi."},{"e":7,"q":"The train arrived at six. We ___ (wait) since five.","a":["had been waiting"],"r":"ps","ru":"Поезд пришёл в шесть. Мы ждали с пяти.","uz":"Poyezd oltida keldi. Biz beshdan beri kutayotgan edik."},{"e":7,"q":"She was happy because she ___ (learn) to swim for months, and finally she could.","a":["had be
