</div><script src="app.js"></script><script>window.GD_QUIZ={"id":"future-continuous","rules":{"f":{"en":"Form: <b>will + be + verb-ing</b> for all people: I <b>will be working</b>, she <b>will be working</b>. Short form: I'll be working.","ru":"Форма: <b>will + be + глагол-ing</b> для всех лиц: I <b>will be working</b>, she <b>will be working</b>. Краткая форма: I'll be working.","uz":"Shakli: <b>will + be + fe'l-ing</b> barcha shaxslar uchun: I <b>will be working</b>, she <b>will be working</b>. Qisqa shakl: I'll be working."},"ing":{"en":"Spelling of -ing: make → making, run → running, lie → lying, study → studying.","ru":"Правописание -ing: make → making, run → running, lie → lying, study → studying.","uz":"-ing imlosi: make → making, run → running, lie → lying, study → studying."},"prog":{"en":"<b>An action in progress at a moment in the future</b>: This time tomorrow I <b>will be flying</b> to Paris. At 8 o'clock tonight we <b>will be having</b> dinner.","ru":"<b>Действие, которое будет идти в определённый момент в будущем</b>: This time tomorrow I <b>will be flying</b> to Paris. At 8 o'clock tonight we <b>will be having</b> dinner.","uz":"<b>Kelajakdagi aniq paytda davom etayotgan ish</b>: This time tomorrow I <b>will be flying</b> to Paris. At 8 o'clock tonight we <b>will be having</b> dinner."},"time":{"en":"Typical time words: <b>this time tomorrow, at 5 pm tomorrow, this time next week, in a year's time, all day tomorrow, at midnight</b>.","ru":"Типичные слова времени: <b>this time tomorrow, at 5 pm tomorrow, this time next week, in a year's time, all day tomorrow, at midnight</b>.","uz":"Odatiy vaqt so'zlari: <b>this time tomorrow, at 5 pm tomorrow, this time next week, in a year's time, all day tomorrow, at midnight</b>."},"neg":{"en":"Negative: <b>won't + be + verb-ing</b>: I <b>won't be working</b> tomorrow. They <b>won't be sleeping</b>.","ru":"Отрицание: <b>won't + be + глагол-ing</b>: I <b>won't be working</b> tomorrow. They <b>won't be sleeping</b>.","uz":"Inkor: <b>won't + be + fe'l-ing</b>: I <b>won't be working</b> tomorrow. They <b>won't be sleeping</b>."},"q":{"en":"Question: <b>Will + subject + be + verb-ing?</b> Will you be working tomorrow? Will she be using the car?","ru":"Вопрос: <b>Will + подлежащее + be + глагол-ing?</b> Will you be working tomorrow? Will she be using the car?","uz":"So'roq: <b>Will + ega + be + fe'l-ing?</b> Will you be working tomorrow? Will she be using the car?"},"sa":{"en":"Short answers: Yes, I <b>will</b>. / No, she <b>won't</b>. Do not repeat be + verb-ing.","ru":"Краткие ответы: Yes, I <b>will</b>. / No, she <b>won't</b>. be + глагол-ing не повторяйте.","uz":"Qisqa javoblar: Yes, I <b>will</b>. / No, she <b>won't</b>. be + fe'l-ing ni takrorlamang."},"wh":{"en":"Question word first: <b>What / Where / Who + will + subject + be + verb-ing?</b> What will you be doing at 8 pm?","ru":"Сначала вопросительное слово: <b>What / Where / Who + will + подлежащее + be + глагол-ing?</b> What will you be doing at 8 pm?","uz":"Avval so'roq so'z: <b>What / Where / Who + will + ega + be + fe'l-ing?</b> What will you be doing at 8 pm?"},"fs":{"en":"<b>Future Simple</b> = a decision, promise or fact (I'll call you). <b>Future Continuous</b> = what will be in progress at that time (I'll be sleeping at 11).","ru":"<b>Future Simple</b> = решение, обещание или факт (I'll call you). <b>Future Continuous</b> = что будет происходить в то время (I'll be sleeping at 11).","uz":"<b>Future Simple</b> = qaror, va'da yoki fakt (I'll call you). <b>Future Continuous</b> = o'sha paytda nima davom etayotgan bo'lishi (I'll be sleeping at 11)."},"pol":{"en":"<b>Polite questions about plans</b>: Will you be using the car tonight? (= I would like to borrow it). It sounds softer than Can I use your car? or Are you going to use it?","ru":"<b>Вежливые вопросы о планах</b>: Will you be using the car tonight? (= я хотел бы её взять). Звучит мягче, чем Can I use your car? или Are you going to use it?","uz":"<b>Rejalar haqida muloyim savollar</b>: Will you be using the car tonight? (= men uni olmoqchiman). Can I use your car? yoki Are you going to use it? dan yumshoqroq eshitiladi."},"exp":{"en":"We use it for things that <b>will happen anyway</b>, as part of the normal course of events (not a choice): I'll be seeing Ali at work tomorrow. We'll be arriving at noon.","ru":"Используем для событий, которые <b>произойдут сами по себе</b>, в обычном ходе событий (не по выбору): I'll be seeing Ali at work tomorrow. We'll be arriving at noon.","uz":"<b>O'z-o'zidan bo'ladigan</b> voqealar uchun, odatiy hayot yo'lida (tanlov emas): I'll be seeing Ali at work tomorrow. We'll be arriving at noon."},"two":{"en":"Two actions at the same time in the future: While I <b>am working</b>, she <b>will be studying</b>. Use the Present Simple after <b>when / while / as soon as</b>.","ru":"Два одновременных действия в будущем: While I <b>am working</b>, she <b>will be studying</b>. После <b>when / while / as soon as</b> используйте Present Simple.","uz":"Kelajakdagi bir vaqtdagi ikki ish: While I <b>am working</b>, she <b>will be studying</b>. <b>when / while / as soon as</b> dan keyin Present Simple ishlating."},"state":{"en":"<b>State verbs</b> (know, like, love, want, need, believe, own) do not take the continuous: Next year I <b>will know</b> him well (not will be knowing).","ru":"<b>Глаголы состояния</b> (know, like, love, want, need, believe, own) не используются в continuous: Next year I <b>will know</b> him well (не will be knowing).","uz":"<b>Holat fe'llari</b> (know, like, love, want, need, believe, own) continuous da ishlatilmaydi: Next year I <b>will know</b> him well (will be knowing emas)."},"order":{"en":"Word order: <b>subject + will + be + verb-ing + the rest</b>. Questions: <b>(question word) + will + subject + be + verb-ing?</b>","ru":"Порядок слов: <b>подлежащее + will + be + глагол-ing + остальное</b>. Вопросы: <b>(вопросительное слово) + will + подлежащее + be + глагол-ing?</b>","uz":"So'zlar tartibi: <b>ega + will + be + fe'l-ing + qolgani</b>. So'roq: <b>(so'roq so'z) + will + ega + be + fe'l-ing?</b>"}},"ex":[{"h":{"en":"Write the verb in brackets in the Future Continuous. Write all words, for example: will be working.","ru":"Напишите глагол из скобок в Future Continuous. Пишите все слова, например: will be working.","uz":"Qavs ichidagi fe'lni Future Continuous da yozing. Hamma so'zlarni yozing, masalan: will be working."}},{"h":{"en":"Make the sentence negative. Write the full sentence.","ru":"Сделайте предложение отрицательным. Напишите его полностью.","uz":"Gapni inkor qiling. To'liq gapni yozing."}},{"h":{"en":"Make a question. Write the full question.","ru":"Составьте вопрос. Напишите вопрос полностью.","uz":"Savol tuzing. To'liq savolni yozing."}},{"h":{"en":"Write a short answer. ✓ = yes, ✗ = no. Example: Will he be working? (✓) → Yes, he will.","ru":"Напишите краткий ответ. ✓ = да, ✗ = нет. Например: Will he be working? (✓) → Yes, he will.","uz":"Qisqa javob yozing. ✓ = ha, ✗ = yo'q. Masalan: Will he be working? (✓) → Yes, he will."}},{"h":{"en":"Questions with a question word. Write the missing word or the full question.","ru":"Вопросы с вопросительным словом. Напишите пропущенное слово или весь вопрос.","uz":"So'roq so'zli savollar. Tushib qolgan so'zni yoki to'liq savolni yozing."}},{"h":{"en":"Future Simple or Future Continuous? Write the verb in brackets in the correct form.","ru":"Future Simple или Future Continuous? Напишите глагол из скобок в нужной форме.","uz":"Future Simple yoki Future Continuous? Qavs ichidagi fe'lni to'g'ri shaklda yozing."}},{"h":{"en":"Polite questions about plans. Write the full question with the Future Continuous.","ru":"Вежливые вопросы о планах. Напишите вопрос полностью в Future Continuous.","uz":"Rejalar haqida muloyim savollar. Future Continuous da to'liq savol yozing."}},{"h":{"en":"At a time in the future. Write the verb in brackets in the Future Continuous.","ru":"В определённый момент в будущем. Напишите глагол из скобок в Future Continuous.","uz":"Kelajakdagi aniq paytda. Qavs ichidagi fe'lni Future Continuous da yozing."}},{"h":{"en":"Two actions. Write the verb in brackets: Future Continuous or Present Simple.","ru":"Два действия. Напишите глагол из скобок: Future Continuous или Present Simple.","uz":"Ikki ish. Qavs ichidagi fe'lni yozing: Future Continuous yoki Present Simple."}},{"h":{"en":"State verb or action verb? Write the verb in brackets in the correct form.","ru":"Глагол состояния или действия? Напишите глагол из скобок в нужной форме.","uz":"Holat fe'li yoki harakat fe'li? Qavs ichidagi fe'lni to'g'ri shaklda yozing."}},{"h":{"en":"Find the mistake and write the correct sentence.","ru":"Найдите ошибку и напишите правильное предложение.","uz":"Xatoni toping va to'g'ri gapni yozing."}},{"h":{"en":"Put the words in the correct order.","ru":"Расставьте слова в правильном порядке.","uz":"So'zlarni to'g'ri tartibga qo'ying."}}],"q":[{"e":0,"q":"This time tomorrow I ___ (fly) to Paris.","a":["will be flying"],"r":"prog","ru":"Завтра в это время я буду лететь в Париж.","uz":"Ertaga shu paytda men Parijga uchib ketayotgan bo'laman."},{"e":0,"q":"At 8 o'clock tonight we ___ (have) dinner.","a":["will be having"],"r":"prog","ru":"Сегодня в 8 вечера мы будем ужинать.","uz":"Bugun kechqurun soat 8 da biz kechki ovqat qilayotgan bo'lamiz."},{"e":0,"q":"She ___ (work) in her office at 9 am tomorrow.","a":["will be working"],"r":"prog","ru":"Завтра в 9 утра она будет работать в офисе.","uz":"Ertaga ertalab soat 9 da u ofisida ishlayotgan bo'ladi."},{"e":0,"q":"They ___ (travel) around Europe next summer.","a":["will be travelling","will be traveling"],"r":"prog","ru":"Следующим летом они будут путешествовать по Европе.","uz":"Kelasi yozda ular Yevropa bo'ylab sayohat qilayotgan bo'ladi."},{"e":0,"q":"I ___ (lie) on the beach this time next week.","a":["will be lying"],"r":"ing","ru":"На следующей неделе в это время я буду лежать на пляже.","uz":"Kelasi hafta shu paytda men sohilda yotgan bo'laman."},{"e":0,"q":"We ___ (sit) in the exam room at 10 o'clock.","a":["will be sitting"],"r":"ing","ru":"В 10 часов мы будем сидеть в экзаменационной аудитории.","uz":"Soat 10 da biz imtihon xonasida o'tirgan bo'lamiz."},{"e":0,"q":"He ___ (run) in the marathon on Sunday morning.","a":["will be running"],"r":"ing","ru":"В воскресенье утром он будет бежать марафон.","uz":"Yakshanba kuni ertalab u marafonda yugurayotgan bo'ladi."},{"e":0,"q":"The children ___ (sleep) at midnight.","a":["will be sleeping"],"r":"prog","ru":"В полночь дети будут спать.","uz":"Yarim tunda bolalar uxlayotgan bo'ladi."},{"e":0,"q":"In a year's time, I ___ (study) at university.","a":["will be studying"],"r":"prog","ru":"Через год я буду учиться в университете.","uz":"Bir yildan keyin men universitetda o'qiyotgan bo'laman."},{"e":0,"q":"Don't call me at 7. I ___ (cook).","a":["will be cooking"],"r":"prog","ru":"Не звони мне в 7. Я буду готовить.","uz":"Soat 7 da qo'ng'iroq qilmang. Men ovqat pishirayotgan bo'laman."},{"e":1,"q":"I will be working tomorrow.","a":["I won't be working tomorrow.","I will not be working tomorrow."],"r":"neg","ru":"Завтра я не буду работать.","uz":"Ertaga men ishlamayotgan bo'laman."},{"e":1,"q":"She will be sleeping at 6.","a":["She won't be sleeping at 6.","She will not be sleeping at 6."],"r":"neg","ru":"В 6 она не будет спать.","uz":"Soat 6 da u uxlamayotgan bo'ladi."},{"e":1,"q":"They will be waiting for us.","a":["They won't be waiting for us.","They will not be waiting for us."],"r":"neg","ru":"Они не будут нас ждать.","uz":"Ular bizni kutmayotgan bo'ladi."},{"e":1,"q":"We will be travelling in June.","a":["We won't be travelling in June.","We will not be travelling in June."],"r":"neg","ru":"В июне мы не будем путешествовать.","uz":"Iyun oyida biz sayohat qilmayotgan bo'lamiz."},{"e":1,"q":"He will be using the car.","a":["He won't be using the car.","He will not be using the car."],"r":"neg","ru":"Он не будет пользоваться машиной.","uz":"U mashinadan foydalanmayotgan bo'ladi."},{"e":1,"q":"You will be studying tonight.","a":["You won't be studying tonight.","You will not be studying tonight."],"r":"neg","ru":"Сегодня вечером ты не будешь заниматься.","uz":"Bugun kechqurun siz o'qimayotgan bo'lasiz."},{"e":1,"q":"The shop will be selling that model.","a":["The shop won't be selling that model.","The shop will not be selling that model."],"r":"neg","ru":"Магазин не будет продавать эту модель.","uz":"Do'kon bu modelni sotmayotgan bo'ladi."},{"e":1,"q":"I will be waiting outside.","a":["I won't be waiting outside.","I will not be waiting outside."],"r":"neg","ru":"Я не буду ждать снаружи.","uz":"Men tashqarida kutmayotgan bo'laman."},{"e":2,"q":"you / work / tomorrow","a":["Will you be working tomorrow?"],"r":"q","ru":"Ты будешь работать завтра?","uz":"Ertaga ishlayotgan bo'lasizmi?"},{"e":2,"q":"she / use / the car","a":["Will she be using the car?"],"r":"q","ru":"Она будет пользоваться машиной?","uz":"U mashinadan foydalanayotgan bo'ladimi?"},{"e":2,"q":"they / travel / in July","a":["Will they be travelling in July?"],"r":"q","ru":"Они будут путешествовать в июле?","uz":"Ular iyul oyida sayohat qilayotgan bo'ladimi?"},{"e":2,"q":"he / wait / at the station","a":["Will he be waiting at the station?"],"r":"q","ru":"Он будет ждать на станции?","uz":"U bekatda kutayotgan bo'ladimi?"},{"e":2,"q":"you / sleep / at midnight","a":["Will you be sleeping at midnight?"],"r":"q","ru":"Ты будешь спать в полночь?","uz":"Yarim tunda uxlayotgan bo'lasizmi?"},{"e":2,"q":"your parents / visit / us / next week","a":["Will your parents be visiting us next week?"],"r":"q","ru":"Твои родители будут навещать нас на следующей неделе?","uz":"Ota-onangiz kelasi hafta bizning oldimizga kelayotgan bo'ladimi?"},{"e":2,"q":"the shop / open / on Sunday","a":["Will the shop be opening on Sunday?"],"r":"q","ru":"Магазин будет открыт в воскресенье?","uz":"Do'kon yakshanba kuni ochilayotgan bo'ladimi?"},{"e":2,"q":"Madina / join / us / for lunch","a":["Will Madina be joining us for lunch?"],"r":"q","ru":"Мадина присоединится к нам за обедом?","uz":"Madina tushlikda bizga qo'shilayotgan bo'ladimi?"},{"e":3,"q":"Will you be working? (✓)","a":["Yes, I will."],"r":"sa","ru":"Ты будешь работать? Да.","uz":"Ishlayotgan bo'lasizmi? Ha."},{"e":3,"q":"Will she be sleeping? (✗)","a":["No, she won't.","No, she will not."],"r":"sa","ru":"Она будет спать? Нет.","uz":"U uxlayotgan bo'ladimi? Yo'q."},{"e":3,"q":"Will they be waiting? (✓)","a":["Yes, they will."],"r":"sa","ru":"Они будут ждать? Да.","uz":"Ular kutayotgan bo'ladimi? Ha."},{"e":3,"q":"Will he be using the car? (✗)","a":["No, he won't.","No, he will not."],"r":"sa","ru":"Он будет пользоваться машиной? Нет.","uz":"U mashinadan foydalanayotgan bo'ladimi? Yo'q."},{"e":4,"q":"What ___ you be doing at 8 o'clock tonight?","a":["will"],"r":"wh","ru":"Что ты будешь делать сегодня в 8 вечера?","uz":"Bugun kechqurun soat 8 da nima qilayotgan bo'lasiz?"},{"e":4,"q":"Where ___ she be working next year?","a":["will"],"r":"wh","ru":"Где она будет работать в следующем году?","uz":"Kelasi yili u qayerda ishlayotgan bo'ladi?"},{"e":4,"q":"what / they / do / this time tomorrow","a":["What will they be doing this time tomorrow?"],"r":"wh","ru":"Что они будут делать завтра в это время?","uz":"Ular ertaga shu paytda nima qilayotgan bo'ladi?"},{"e":4,"q":"where / you / stay / in Rome","a":["Where will you be staying in Rome?"],"r":"wh","ru":"Где ты будешь жить в Риме?","uz":"Rimda qayerda turayotgan bo'lasiz?"},{"e":4,"q":"who / she / travel / with","a":["Who will she be travelling with?"],"r":"wh","ru":"С кем она будет путешествовать?","uz":"U kim bilan sayohat qilayotgan bo'ladi?"},{"e":5,"q":"I'm tired. I think I ___ (go) to bed. (a quick decision)","a":["will go","'ll go"],"r":"fs","ru":"Я устал. Думаю, я лягу спать.","uz":"Charchadim. Menimcha, yotaman."},{"e":5,"q":"Don't phone at 11. I ___ (sleep). (in progress)","a":["will be sleeping"],"r":"fs","ru":"Не звони в 11. Я буду спать.","uz":"Soat 11 da qo'ng'iroq qilmang. Men uxlayotgan bo'laman."},{"e":5,"q":"Wait here. I ___ (get) the car. (a promise)","a":["will get","'ll get"],"r":"fs","ru":"Подожди здесь. Я подгоню машину.","uz":"Shu yerda kuting. Men mashinani olib kelaman."},{"e":5,"q":"This time next week we ___ (lie) on a beach. (in progress)","a":["will be lying"],"r":"fs","ru":"На следующей неделе в это время мы будем лежать на пляже.","uz":"Kelasi hafta shu paytda biz sohilda yotgan bo'lamiz."},{"e":5,"q":"I promise I ___ (help) you tomorrow.","a":["will help","'ll help"],"r":"fs","ru":"Обещаю, что завтра я тебе помогу.","uz":"Va'da beramanki, ertaga sizga yordam beraman."},{"e":5,"q":"At 9 o'clock tomorrow, the manager ___ (give) a speech. (in progress)","a":["will be giving"],"r":"fs","ru":"Завтра в 9 часов менеджер будет выступать с речью.","uz":"Ertaga soat 9 da menejer nutq so'zlayotgan bo'ladi."},{"e":5,"q":"The phone is ringing. I ___ (answer) it. (a quick decision)","a":["will answer","'ll answer"],"r":"fs","ru":"Звонит телефон. Я отвечу.","uz":"Telefon jiringlayapti. Men javob beraman."},{"e":5,"q":"All day tomorrow I ___ (clean) the house. (in progress)","a":["will be cleaning"],"r":"fs","ru":"Завтра весь день я буду убирать дом.","uz":"Ertaga kun bo'yi men uyni tozalayotgan bo'laman."},{"e":6,"q":"you / use / the laptop / tonight","a":["Will you be using the laptop tonight?"],"r":"pol","ru":"Ты будешь пользоваться ноутбуком сегодня вечером? (Можно мне его взять?)","uz":"Bugun kechqurun noutbukdan foydalanasizmi? (Menga bersangiz bo'ladimi?)"},{"e":6,"q":"you / go / to the supermarket / later","a":["Will you be going to the supermarket later?"],"r":"pol","ru":"Ты пойдёшь в супермаркет позже? (Купи мне, пожалуйста, хлеб.)","uz":"Keyinroq supermarketga borasizmi? (Menga non olib bersangiz.)"},{"e":6,"q":"you / see / Aziz / today","a":["Will you be seeing Aziz today?"],"r":"pol","ru":"Ты увидишь сегодня Азиза? (Передай ему привет.)",
