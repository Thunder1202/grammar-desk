</div><script src="app.js"></script><script>window.GD_EXAM={"id":"a2-3","level":"a2.html","lvl":"A2","topics":{"adjectives-and-adverbs":"Adjectives and adverbs","prepositions-of-movement":"Prepositions of movement","zero-conditional":"Zero conditional","time-clauses":"Time clauses (when, before, after)"},"next":{"u":"b1.html","t":"B1","k":"nlv"},"q":[{"s":"adjectives-and-adverbs","q":"She drives very ___.","o":["careful","carefully","care"],"a":1,"w":[["Careful is an adjective. It describes a noun.","Careful — прилагательное, оно описывает существительное.","Careful sifat, u otni tasvirlaydi."],["We describe how she drives, so we need an adverb.","Описываем, как она водит, поэтому нужно наречие.","Qanday haydashini tasvirlayapmiz, shuning uchun ravish kerak."],["Care is a noun or a verb.","Care — существительное или глагол.","Care ot yoki fe'l."]]},{"s":"adjectives-and-adverbs","q":"He is a ___ runner.","o":["fast","fastly","quickly"],"a":0,"w":[["Before a noun we use an adjective: a fast runner.","Перед существительным нужно прилагательное: a fast runner.","Ot oldidan sifat keladi: a fast runner."],["Fastly is not a word. Fast does not change.","Слова fastly нет, fast не меняется.","Fastly degan so'z yo'q, fast o'zgarmaydi."],["Quickly is an adverb, so it cannot go before a noun.","Quickly — наречие, перед существительным не ставится.","Quickly ravish, otdan oldin kelmaydi."]]},{"s":"prepositions-of-movement","q":"The cat jumped ___ the table.","o":["onto","during","of"],"a":0,"w":[["Onto shows moving to a surface.","Onto показывает движение на поверхность.","Onto sirtga harakatni bildiradi."],["During is about time, not movement.","During — о времени, а не о движении.","During vaqt haqida, harakat haqida emas."],["Of does not show movement.","Of не показывает движение.","Of harakatni bildirmaydi."]]},{"s":"prepositions-of-movement","q":"We walked ___ the bridge to the other side.","o":["across","in","at"],"a":0,"w":[["Across means from one side to the other.","Across значит с одной стороны на другую.","Across bir tomondan ikkinchi tomonga degani."],["In shows being inside, not going to the other side.","In показывает нахождение внутри.","In ichkarida bo'lishni bildiradi."],["At shows a point, not going to the other side.","At показывает точку, а не переход.","At nuqtani bildiradi, o'tishni emas."]]},{"s":"zero-conditional","q":"If you heat ice, it ___.","o":["melts","will melted","melting"],"a":0,"w":[["A fact that is always true: present + present.","Факт, верный всегда: настоящее + настоящее.","Har doim to'g'ri fakt: hozirgi + hozirgi zamon."],["After will we need the base verb, and this is a general fact.","После will нужна начальная форма, а это общий факт.","Will dan keyin asl shakl kerak, bu esa umumiy fakt."],["Melting needs is before it.","Перед melting нужен is.","Melting oldidan is kerak."]]},{"s":"zero-conditional","q":"If people ___ enough water, they get thirsty.","o":["don't drink","didn't drank","doesn't drink"],"a":0,"w":[["People takes don't, and the fact is general.","С people нужно don't, а факт общий.","People bilan don't keladi, fakt esa umumiy."],["After did we need the base verb, and this is not the past.","После did нужна начальная форма, и это не прошлое.","Did dan keyin asl shakl kerak, bu o'tgan zamon ham emas."],["Doesn't goes with he, she and it. People is plural.","Doesn't ставим с he, she и it, а people — множественное.","Doesn't he, she va it bilan keladi. People ko'plikda."]]},{"s":"time-clauses","q":"I will call you when I ___ home.","o":["get","will get","got"],"a":0,"w":[["After when we use the present, even for the future.","После when ставим настоящее время, даже о будущем.","When dan keyin kelasi zamon haqida ham hozirgi zamon keladi."],["We do not use will after when here.","После when здесь не используем will.","Bu yerda when dan keyin will kelmaydi."],["Got is past, but the sentence is about the future.","Got — прошлое, а предложение о будущем.","Got o'tgan zamon, gap esa kelasi zamon haqida."]]},{"s":"time-clauses","q":"Wash your hands ___ you eat.","o":["before","during","while to"],"a":0,"w":[["Before + a sentence: first wash, then eat.","Before + предложение: сначала мыть, потом есть.","Before + gap: avval yuvish, keyin ovqatlanish."],["During goes with a noun, not a sentence: during lunch.","During идёт с существительным: during lunch.","During ot bilan keladi: during lunch."],["While to is not correct English.","While to — неправильно.","While to xato."]]}]};
