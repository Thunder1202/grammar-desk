</div><script src="app.js"></script><script>window.GD_QUIZ={"id":"have-has","rules":{"hv":{"en":"Use <b>have</b> with <b>I / you / we / they</b>: I <b>have</b> a dog. They <b>have</b> two cats.","ru":"Используйте <b>have</b> с <b>I / you / we / they</b>: I <b>have</b> a dog. They <b>have</b> two cats.","uz":"<b>I / you / we / they</b> bilan <b>have</b> ishlatiladi: I <b>have</b> a dog. They <b>have</b> two cats."},"hs":{"en":"Use <b>has</b> with <b>he / she / it</b>: She <b>has</b> a dog. One person or thing (Ali, my mom, the dog) = he / she / it, so we use <b>has</b>.","ru":"Используйте <b>has</b> с <b>he / she / it</b>: She <b>has</b> a dog. Один человек или предмет (Ali, my mom, the dog) = he / she / it, поэтому <b>has</b>.","uz":"<b>he / she / it</b> bilan <b>has</b> ishlatiladi: She <b>has</b> a dog. Bitta odam yoki narsa (Ali, my mom, the dog) = he / she / it, shuning uchun <b>has</b>."},"pl":{"en":"Two or more people or things = <b>they</b> → <b>have</b>: My parents <b>have</b> a car. Ali and I = <b>we</b> → <b>have</b>.","ru":"Два и более человека или предмета = <b>they</b> → <b>have</b>: My parents <b>have</b> a car. Ali and I = <b>we</b> → <b>have</b>.","uz":"Ikki va undan ortiq odam yoki narsa = <b>they</b> → <b>have</b>: My parents <b>have</b> a car. Ali and I = <b>we</b> → <b>have</b>."},"do":{"en":"Questions with <b>I / you / we / they</b>: <b>Do</b> + subject + <b>have</b>? Do they <b>have</b> a dog?","ru":"Вопросы с <b>I / you / we / they</b>: <b>Do</b> + подлежащее + <b>have</b>? Do they <b>have</b> a dog?","uz":"<b>I / you / we / they</b> bilan so'roq: <b>Do</b> + ega + <b>have</b>? Do they <b>have</b> a dog?"},"does":{"en":"Questions with <b>he / she / it</b> (one person or thing): <b>Does</b> + subject + <b>have</b>? Does she <b>have</b> a dog?","ru":"Вопросы с <b>he / she / it</b> (один человек или предмет): <b>Does</b> + подлежащее + <b>have</b>? Does she <b>have</b> a dog?","uz":"<b>he / she / it</b> (bitta odam yoki narsa) bilan so'roq: <b>Does</b> + ega + <b>have</b>? Does she <b>have</b> a dog?"},"qh":{"en":"After <b>does</b> we always write <b>have</b>, never has. The -s is already in does: Does she <b>have</b>...? (not Does she has).","ru":"После <b>does</b> всегда пишем <b>have</b>, а не has. Буква -s уже есть в does: Does she <b>have</b>...? (не Does she has).","uz":"<b>does</b> dan keyin doim <b>have</b> yoziladi, has emas. -s harfi does da bor: Does she <b>have</b>...? (Does she has emas)."},"sa":{"en":"Short answers use <b>do / does</b>: Yes, she <b>does</b>. / No, she <b>doesn't</b>. Yes, they <b>do</b>. / No, they <b>don't</b>. Do not repeat have.","ru":"Краткие ответы строятся с <b>do / does</b>: Yes, she <b>does</b>. / No, she <b>doesn't</b>. Yes, they <b>do</b>. / No, they <b>don't</b>. have не повторяйте.","uz":"Qisqa javoblar <b>do / does</b> bilan: Yes, she <b>does</b>. / No, she <b>doesn't</b>. Yes, they <b>do</b>. / No, they <b>don't</b>. have ni takrorlamang."},"dont":{"en":"Negative with <b>I / you / we / they</b>: <b>don't</b> + <b>have</b>. I <b>don't have</b> a car.","ru":"Отрицание с <b>I / you / we / they</b>: <b>don't</b> + <b>have</b>. I <b>don't have</b> a car.","uz":"<b>I / you / we / they</b> bilan inkor: <b>don't</b> + <b>have</b>. I <b>don't have</b> a car."},"doesnt":{"en":"Negative with <b>he / she / it</b>: <b>doesn't</b> + <b>have</b>. She <b>doesn't have</b> a car. Not doesn't has!","ru":"Отрицание с <b>he / she / it</b>: <b>doesn't</b> + <b>have</b>. She <b>doesn't have</b> a car. Не doesn't has!","uz":"<b>he / she / it</b> bilan inkor: <b>doesn't</b> + <b>have</b>. She <b>doesn't have</b> a car. doesn't has emas!"},"order":{"en":"Word order: <b>subject + have / has + object</b>. Question: <b>Do / Does + subject + have + object?</b> Negative: <b>subject + don't / doesn't + have + object</b>.","ru":"Порядок слов: <b>подлежащее + have / has + дополнение</b>. Вопрос: <b>Do / Does + подлежащее + have + дополнение?</b> Отрицание: <b>подлежащее + don't / doesn't + have + дополнение</b>.","uz":"So'zlar tartibi: <b>ega + have / has + to'ldiruvchi</b>. So'roq: <b>Do / Does + ega + have + to'ldiruvchi?</b> Inkor: <b>ega + don't / doesn't + have + to'ldiruvchi</b>."}},"ex":[{"h":{"en":"Write have or has. Example: I → have.","ru":"Напишите have или has. Например: I → have.","uz":"have yoki has yozing. Masalan: I → have."}},{"h":{"en":"Write have or has in the sentence. Think: is it he / she / it, or I / you / we / they?","ru":"Напишите have или has в предложении. Подумайте: это he / she / it или I / you / we / they?","uz":"Gapga have yoki has yozing. O'ylang: bu he / she / it yoki I / you / we / they?"}},{"h":{"en":"Write Do or Does.","ru":"Напишите Do или Does.","uz":"Do yoki Does yozing."}},{"h":{"en":"Make a question. Write the full question. Example: He has a pencil. → Does he have a pencil?","ru":"Составьте вопрос. Напишите вопрос полностью. Например: He has a pencil. → Does he have a pencil?","uz":"Savol tuzing. To'liq savolni yozing. Masalan: He has a pencil. → Does he have a pencil?"}},{"h":{"en":"Write a short answer. ✓ = yes, ✗ = no. Example: Does she have a cat? (✓) → Yes, she does.","ru":"Напишите краткий ответ. ✓ = да, ✗ = нет. Например: Does she have a cat? (✓) → Yes, she does.","uz":"Qisqa javob yozing. ✓ = ha, ✗ = yo'q. Masalan: Does she have a cat? (✓) → Yes, she does."}},{"h":{"en":"Make the sentence negative. Write the full sentence. Example: She has a cat. → She doesn't have a cat.","ru":"Сделайте предложение отрицательным. Напишите его полностью. Например: She has a cat. → She doesn't have a cat.","uz":"Gapni inkor qiling. To'liq gapni yozing. Masalan: She has a cat. → She doesn't have a cat."}},{"h":{"en":"Write don't or doesn't.","ru":"Напишите don't или doesn't.","uz":"don't yoki doesn't yozing."}},{"h":{"en":"Find the mistake and write the correct sentence.","ru":"Найдите ошибку и напишите правильное предложение.","uz":"Xatoni toping va to'g'ri gapni yozing."}},{"h":{"en":"Put the words in the correct order.","ru":"Расставьте слова в правильном порядке.","uz":"So'zlarni to'g'ri tartibga qo'ying."}},{"h":{"en":"Mixed practice. Write have, has, Do, Does, don't or doesn't.","ru":"Смешанная практика. Напишите have, has, Do, Does, don't или doesn't.","uz":"Aralash mashq. have, has, Do, Does, don't yoki doesn't yozing."}}],"q":[{"e":0,"q":"I → ___","a":["have"],"r":"hv","ru":"I — я","uz":"I — men"},{"e":0,"q":"you → ___","a":["have"],"r":"hv","ru":"you — ты, вы","uz":"you — sen, siz"},{"e":0,"q":"he → ___","a":["has"],"r":"hs","ru":"he — он","uz":"he — u (erkak)"},{"e":0,"q":"she → ___","a":["has"],"r":"hs","ru":"she — она","uz":"she — u (ayol)"},{"e":0,"q":"it → ___","a":["has"],"r":"hs","ru":"it — оно (предмет или животное)","uz":"it — u (narsa yoki hayvon)"},{"e":0,"q":"we → ___","a":["have"],"r":"hv","ru":"we — мы","uz":"we — biz"},{"e":0,"q":"they → ___","a":["have"],"r":"hv","ru":"they — они","uz":"they — ular"},{"e":1,"q":"I ___ a red ball.","a":["have"],"r":"hv","ru":"У меня красный мяч.","uz":"Menda qizil to'p bor."},{"e":1,"q":"She ___ a pink bag.","a":["has"],"r":"hs","ru":"У неё розовая сумка.","uz":"Unda pushti sumka bor."},{"e":1,"q":"They ___ two cats.","a":["have"],"r":"hv","ru":"У них две кошки.","uz":"Ularda ikkita mushuk bor."},{"e":1,"q":"He ___ a new pencil.","a":["has"],"r":"hs","ru":"У него новый карандаш.","uz":"Unda yangi qalam bor."},{"e":1,"q":"We ___ a big house.","a":["have"],"r":"hv","ru":"У нас большой дом.","uz":"Bizda katta uy bor."},{"e":1,"q":"The dog ___ a long tail.","a":["has"],"r":"hs","ru":"У собаки длинный хвост.","uz":"Itning dumi uzun.","n":"The dog = it (one animal)"},{"e":1,"q":"You ___ a nice friend.","a":["have"],"r":"hv","ru":"У тебя хороший друг.","uz":"Sizda yaxshi do'st bor."},{"e":1,"q":"My mom ___ a blue car.","a":["has"],"r":"hs","ru":"У моей мамы синяя машина.","uz":"Onamning ko'k mashinasi bor.","n":"My mom = she"},{"e":1,"q":"My parents ___ a small farm.","a":["have"],"r":"pl","ru":"У моих родителей маленькая ферма.","uz":"Ota-onamning kichik fermasi bor.","n":"My parents = they (two people)"},{"e":1,"q":"Ali and I ___ the same book.","a":["have"],"r":"pl","ru":"У нас с Али одна и та же книга.","uz":"Aliyda ham, menda ham bir xil kitob bor.","n":"Ali and I = we"},{"e":2,"q":"___ you have a pencil?","a":["Do"],"r":"do","ru":"У тебя есть карандаш?","uz":"Sizda qalam bormi?"},{"e":2,"q":"___ he have a dog?","a":["Does"],"r":"does","ru":"У него есть собака?","uz":"Unda it bormi?"},{"e":2,"q":"___ they have a car?","a":["Do"],"r":"do","ru":"У них есть машина?","uz":"Ularda mashina bormi?"},{"e":2,"q":"___ the teacher have a book?","a":["Does"],"r":"does","ru":"У учителя есть книга?","uz":"O'qituvchida kitob bormi?","n":"The teacher = he / she (one person)"},{"e":2,"q":"___ I have time?","a":["Do"],"r":"do","ru":"У меня есть время?","uz":"Menda vaqt bormi?"},{"e":2,"q":"___ she have a sister?","a":["Does"],"r":"does","ru":"У неё есть сестра?","uz":"Unda opa-singil bormi?"},{"e":2,"q":"___ your sister have a phone?","a":["Does"],"r":"does","ru":"У твоей сестры есть телефон?","uz":"Singlingizda telefon bormi?","n":"your sister = she"},{"e":2,"q":"___ the students have homework?","a":["Do"],"r":"do","ru":"У студентов есть домашнее задание?","uz":"Talabalarda uy vazifasi bormi?","n":"the students = they"},{"e":3,"q":"She has a book.","a":["Does she have a book?"],"r":"qh","ru":"У неё есть книга?","uz":"Unda kitob bormi?"},{"e":3,"q":"They have a ball.","a":["Do they have a ball?"],"r":"do","ru":"У них есть мяч?","uz":"Ularda to'p bormi?"},{"e":3,"q":"The cat has a toy.","a":["Does the cat have a toy?"],"r":"does","ru":"У кошки есть игрушка?","uz":"Mushukda o'yinchoq bormi?"},{"e":3,"q":"You have a pen.","a":["Do you have a pen?"],"r":"do","ru":"У тебя есть ручка?","uz":"Sizda ruchka bormi?"},{"e":3,"q":"My brother has a bike.","a":["Does my brother have a bike?"],"r":"does","ru":"У моего брата есть велосипед?","uz":"Akamda velosiped bormi?"},{"e":3,"q":"We have homework.","a":["Do we have homework?"],"r":"do","ru":"У нас есть домашнее задание?","uz":"Bizda uy vazifasi bormi?"},{"e":3,"q":"Ali has a new bag.","a":["Does Ali have a new bag?"],"r":"does","ru":"У Али есть новая сумка?","uz":"Alida yangi sumka bormi?"},{"e":3,"q":"My friends have a boat.","a":["Do my friends have a boat?"],"r":"do","ru":"У моих друзей есть лодка?","uz":"Do'stlarimda qayiq bormi?"},{"e":4,"q":"Do you have a pen? (✓)","a":["Yes, I do."],"r":"sa","ru":"У тебя есть ручка? Да.","uz":"Sizda ruchka bormi? Ha."},{"e":4,"q":"Does he have a bike? (✗)","a":["No, he doesn't.","No, he does not."],"r":"sa","ru":"У него есть велосипед? Нет.","uz":"Unda velosiped bormi? Yo'q."},{"e":4,"q":"Do they have a dog? (✓)","a":["Yes, they do."],"r":"sa","ru":"У них есть собака? Да.","uz":"Ularda it bormi? Ha."},{"e":4,"q":"Does she have a phone? (✗)","a":["No, she doesn't.","No, she does not."],"r":"sa","ru":"У неё есть телефон? Нет.","uz":"Unda telefon bormi? Yo'q."},{"e":4,"q":"Does your mom have a car? (✓)","a":["Yes, she does."],"r":"sa","ru":"У твоей мамы есть машина? Да.","uz":"Onangizda mashina bormi? Ha."},{"e":4,"q":"Do you have a brother? (✗)","a":["No, I don't.","No, I do not."],"r":"sa","ru":"У тебя есть брат? Нет.","uz":"Sizda aka yoki uka bormi? Yo'q."},{"e":4,"q":"Does the dog have a bed? (✓)","a":["Yes, it does."],"r":"sa","ru":"У собаки есть лежанка? Да.","uz":"Itda to'shak bormi? Ha."},{"e":4,"q":"Do your friends have a ball? (✗)","a":["No, they don't.","No, they do not."],"r":"sa","ru":"У твоих друзей есть мяч? Нет.","uz":"Do'stlaringizda to'p bormi? Yo'q."},{"e":5,"q":"I have a car.","a":["I don't have a car.","I do not have a car."],"r":"dont","ru":"У меня нет машины.","uz":"Menda mashina yo'q."},{"e":5,"q":"She has a bike.","a":["She doesn't have a bike.","She does not have a bike."],"r":"doesnt","ru":"У неё нет велосипеда.","uz":"Unda velosiped yo'q."},{"e":5,"q":"They have a dog.","a":["They don't have a dog.","They do not have a dog."],"r":"dont","ru":"У них нет собаки.","uz":
