</div><script src="app.js"></script><script>window.GD_EXAM={"id":"a2-1","level":"a2.html","lvl":"A2","topics":{"future-going-to":"Future: going to","future-arrangements-and-will":"Future: arrangements and will","comparatives-and-superlatives":"Comparatives and superlatives","quantifiers":"Quantifiers","present-perfect-basic":"Present Perfect (basic)","past-continuous":"Past Continuous"},"next":{"u":"object-pronouns.html","t":"Object pronouns","k":"nxt"},"q":[{"s":"future-going-to","q":"Look at those black clouds! It ___ rain.","o":["is going to","going to","go to"],"a":0,"w":[["We can see it coming, so we use be going to.","Мы видим признаки, поэтому be going to.","Belgilari ko'rinib turibdi, shuning uchun be going to."],["We cannot drop is before going to.","Нельзя убрать is перед going to.","Going to oldidan is tushib qolmasligi kerak."],["Go to means move to a place. It is not a future form.","Go to значит идти куда-то, это не будущее время.","Go to biror joyga borishni bildiradi, kelasi zamon emas."]]},{"s":"future-going-to","q":"We ___ visit our grandmother this weekend. We decided last week.","o":["will to","are going to","going"],"a":1,"w":[["There is no to after will.","После will нет to.","Will dan keyin to kelmaydi."],["It is a plan we made before: be going to.","Это план, принятый заранее: be going to.","Bu oldindan qilingan reja: be going to."],["This form needs are and to.","Здесь нужны are и to.","Bu yerda are va to kerak."]]},{"s":"future-arrangements-and-will","q":"The phone is ringing. I ___ answer it!","o":["will","'ll to","am"],"a":0,"w":[["We decide right now, so we use will.","Решаем прямо сейчас, поэтому will.","Hozir qaror qilyapmiz, shuning uchun will."],["There is no to after 'll.","После 'll нет to.","'ll dan keyin to kelmaydi."],["Am answer is not correct. We need am answering or will answer.","Am answer неправильно: нужно am answering или will answer.","Am answer xato: am answering yoki will answer kerak."]]},{"s":"future-arrangements-and-will","q":"I ___ the dentist at 4 tomorrow. It's in my diary.","o":["seen","am seeing","seeing"],"a":1,"w":[["Seen needs have before it, and this is about tomorrow.","Перед seen нужен have, а речь о завтрашнем дне.","Seen oldidan have kerak, gap esa ertangi kun haqida."],["A fixed plan with a time and place: present continuous.","Договорённость со временем и местом: present continuous.","Vaqti va joyi belgilangan reja: present continuous."],["We cannot drop am before seeing.","Нельзя убрать am перед seeing.","Seeing oldidan am tushib qolmasligi kerak."]]},{"s":"comparatives-and-superlatives","q":"My bag is ___ than yours.","o":["heavy","heavier","heaviest"],"a":1,"w":[["With than we need the comparative form.","С than нужна сравнительная степень.","Than bilan qiyosiy daraja kerak."],["Short word ending in -y: change y to i and add -er.","Короткое слово на -y: y меняем на i и добавляем -er.","-y bilan tugagan qisqa so'z: y i ga aylanadi va -er qo'shiladi."],["Heaviest compares three or more things and needs the.","Heaviest сравнивает три и более предмета и требует the.","Heaviest uch va undan ortiq narsani qiyoslaydi, the talab qiladi."]]},{"s":"comparatives-and-superlatives","q":"This is ___ film I have ever seen.","o":["the best","better","the most good"],"a":0,"w":[["Ever seen compares it with all films: the best.","Ever seen сравнивает со всеми фильмами: the best.","Ever seen barcha filmlar bilan qiyoslaydi: the best."],["Better compares two things, and there is no than here.","Better сравнивает двух, и здесь нет than.","Better ikkita narsani qiyoslaydi, bu yerda than ham yo'q."],["Good is irregular. We never say most good.","Good — неправильное слово, most good не говорят.","Good noto'g'ri so'z, most good deyilmaydi."]]},{"s":"quantifiers","q":"How ___ money do you have?","o":["many","much","a few"],"a":1,"w":[["Many goes with things we can count.","Many — с тем, что можно посчитать.","Many sanaladigan narsalar bilan keladi."],["Money cannot be counted, so we use much.","Money не считается, поэтому much.","Money sanalmaydi, shuning uchun much."],["How a few is not correct, and few needs a plural.","How a few неправильно, а few нужно множественное.","How a few xato, few esa ko'plik talab qiladi."]]},{"s":"quantifiers","q":"There isn't ___ milk in the fridge.","o":["many","some","any"],"a":2,"w":[["Many goes with plural nouns, and milk is not plural.","Many — со множественным числом, а milk не такое.","Many ko'plikdagi otlar bilan keladi, milk esa unday emas."],["Some is for positive sentences.","Some — для утвердительных предложений.","Some tasdiq gaplar uchun."],["Negative sentences use any.","В отрицании используем any.","Inkor gapda any ishlatiladi."]]},{"s":"present-perfect-basic","q":"I ___ this film twice.","o":["have seen","has seen","have saw"],"a":0,"w":[["An experience, no time given: have + past participle.","Опыт без указания времени: have + третья форма.","Vaqti aytilmagan tajriba: have + uchinchi shakl."],["Has goes with he, she and it.","Has ставим с he, she и it.","Has he, she va it bilan keladi."],["After have we need seen, not saw.","После have нужно seen, а не saw.","Have dan keyin saw emas, seen keladi."]]},{"s":"present-perfect-basic","q":"___ you ever been to Samarkand?","o":["Did","Were","Have"],"a":2,"w":[["Did goes with a base verb, like did you go.","Did идёт с начальной формой: did you go.","Did fe'lning asl shakli bilan keladi: did you go."],["Were you ever been is not correct.","Were you ever been — неправильно.","Were you ever been xato."],["Ever + been: Have you ever been...?","Правильно: Have you ever been...?","To'g'ri shakl: Have you ever been...?"]]},{"s":"past-continuous","q":"I ___ TV when you called.","o":["was watching","watched were","am watching"],"a":0,"w":[["An action already going on in the past: was + -ing.","Действие уже шло в прошлом: was + -ing.","O'tmishda davom etayotgan ish: was + -ing."],["Watched were is not a real form.","Watched were — такой формы нет.","Watched were degan shakl yo'q."],["Am watching is about now, but you called in the past.","Am watching — о настоящем, а you called — прошлое.","Am watching hozir haqida, you called esa o'tgan zamon."]]},{"s":"past-continuous","q":"They ___ football when it started to rain.","o":["was playing","were playing","are play"],"a":1,"w":[["Was goes with I, he, she and it.","Was ставим с I, he, she и it.","Was I, he, she va it bilan keladi."],["They takes were + -ing.","С they нужно were + -ing.","They bilan were + -ing keladi."],["Are play is not a real form, and this is the past.","Are play — такой формы нет, и это прошлое.","Are play degan shakl yo'q, bu yerda esa o'tgan zamon."]]}]};
