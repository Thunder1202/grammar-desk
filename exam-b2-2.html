</div><script src="app.js"></script><script>window.GD_EXAM={"id":"b2-2","level":"b2.html","lvl":"B2","topics":{"perfect-modals":"Perfect modals","relative-clauses-advanced":"Relative clauses (advanced)","wish-if-only":"Wish / If only","causative-have-get-something-done":"Causative: have / get something done","inversion-basic":"Inversion (basic)","linking-words-and-cohesion":"Linking words and cohesion","advanced-articles-and-determiners":"Advanced articles and determiners","future-in-the-past":"Future in the past"},"next":{"u":"c1.html","t":"C1/C2","k":"nlv"},"q":[{"s":"perfect-modals","q":"You ___ me. I would have helped you.","o":["should have told","should told","must told"],"a":0,"w":[["Criticism of a past action: should have + past participle.","Упрёк о прошлом: should have + третья форма.","O'tmishdagi ish uchun tanbeh: should have + uchinchi shakl."],["Have is missing after should.","После should пропущено have.","Should dan keyin have tushib qolgan."],["After must we need the base verb or have + past participle.","После must нужна начальная форма или have + третья форма.","Must dan keyin asl shakl yoki have + uchinchi shakl keladi."]]},{"s":"perfect-modals","q":"We ___ the bus, but we decided to walk.","o":["could have taken","could took","can have taken"],"a":0,"w":[["A past possibility that did not happen: could have + past participle.","Возможность в прошлом, которая не случилась: could have + третья форма.","O'tmishda bo'lishi mumkin bo'lgan, ammo bo'lmagan ish: could have + uchinchi shakl."],["After could we need the base verb, not the past form.","После could нужна начальная форма, а не прошедшая.","Could dan keyin o'tgan shakl emas, asl shakl keladi."],["We do not use positive can have for a past possibility.","Утвердительное can have не используем для возможности в прошлом.","O'tmish imkoniyati uchun tasdiq can have ishlatilmaydi."]]},{"s":"relative-clauses-advanced","q":"My brother, ___ lives in Seoul, is an engineer.","o":["who","that","whom"],"a":0,"w":[["Extra information about a person, as subject: who.","Дополнительная информация о человеке, подлежащее: who.","Odam haqida qo'shimcha ma'lumot, ega vazifasida: who."],["That is not used after a comma in this kind of clause.","That не используется после запятой в таком придаточном.","Bunday ergash gapda verguldan keyin that ishlatilmaydi."],["Whom is an object form, but here the person does the action.","Whom — объектная форма, а здесь человек сам делает действие.","Whom obyekt shakli, bu yerda esa shaxs o'zi ish bajaradi."]]},{"s":"relative-clauses-advanced","q":"She is the writer ___ book won the prize.","o":["whose","who's","which"],"a":0,"w":[["Whose shows the book belongs to her.","Whose показывает, что книга её.","Whose kitob unga tegishli ekanini bildiradi."],["Who's means who is, which does not fit before book.","Who's значит who is, перед book не подходит.","Who's who is degani, book oldidan mos kelmaydi."],["Which is for things, not for the writer.","Which — для предметов, а не для писателя.","Which narsalar uchun, yozuvchi uchun emas."]]},{"s":"wish-if-only","q":"I wish I ___ taller.","o":["were","am","will be"],"a":0,"w":[["A wish about now uses the past form; were is common.","Желание о настоящем — форма прошедшего, часто were.","Hozir haqidagi istakda o'tgan shakl keladi, ko'pincha were."],["After wish we do not use the present.","После wish не ставим настоящее время.","Wish dan keyin hozirgi zamon kelmaydi."],["After wish we do not use will for this meaning.","После wish в этом значении не используем will.","Bu ma'noda wish dan keyin will kelmaydi."]]},{"s":"wish-if-only","q":"If only I ___ that yesterday!","o":["hadn't said","didn't say","wouldn't say"],"a":0,"w":[["Regret about the past: past perfect.","Сожаление о прошлом: past perfect.","O'tmish haqida afsus: past perfect."],["Didn't say after if only is about now, not yesterday.","Didn't say после if only — о настоящем, а не о вчера.","If only dan keyin didn't say hozir haqida, kecha haqida emas."],["Wouldn't say is about a wish for change, not past regret.","Wouldn't say — о желании перемен, а не о сожалении о прошлом.","Wouldn't say o'zgarish istagi, o'tmish afsusi emas."]]},{"s":"causative-have-get-something-done","q":"I ___ at the salon last week.","o":["had my hair cut","cut my hair","had cut my hair"],"a":0,"w":[["Someone else did it for me: have + object + past participle.","Это сделал кто-то другой: have + объект + третья форма.","Buni boshqa odam qilgan: have + obyekt + uchinchi shakl."],["Cut my hair means I did it myself.","Cut my hair значит, что я сделал это сам.","Cut my hair o'zim qildim degani."],["This word order is the past perfect: I did it myself earlier.","Такой порядок — past perfect: я сам сделал это раньше.","Bu tartib past perfect: o'zim oldinroq qilganman."]]},{"s":"causative-have-get-something-done","q":"We need to get the car ___.","o":["repaired","repair","repairing"],"a":0,"w":[["Get + object + past participle: someone will repair it.","Get + объект + третья форма: кто-то отремонтирует.","Get + obyekt + uchinchi shakl: kimdir ta'mirlaydi."],["The base verb does not fit: the car does not repair anything.","Начальная форма не подходит: машина сама ничего не чинит.","Asl shakl mos emas: mashina o'zi hech narsani ta'mirlamaydi."],["Repairing would mean the car is doing the repair.","Repairing значило бы, что ремонтирует сама машина.","Repairing mashinaning o'zi ta'mirlayotganini bildirardi."]]},{"s":"inversion-basic","q":"Never ___ such a beautiful place.","o":["have I seen","I have seen","I saw"],"a":0,"w":[["After Never at the start, the verb comes before the subject.","После Never в начале глагол стоит перед подлежащим.","Boshida Never bo'lsa, fe'l egadan oldin keladi."],["This keeps normal word order, which is wrong after Never.","Здесь обычный порядок, а после Never он неверен.","Bu oddiy tartib, Never dan keyin esa u xato."],["Normal order and no helper verb after Never.","Обычный порядок и нет вспомогательного глагола после Never.","Never dan keyin oddiy tartib va yordamchi fe'lsiz xato."]]},{"s":"inversion-basic","q":"Not only ___ late, but he also forgot his bag.","o":["was he","he was","he is being"],"a":0,"w":[["Not only at the start needs inversion: was he.","Not only в начале требует инверсии: was he.","Boshida not only bo'lsa, inversiya kerak: was he."],["He was is normal order, which is wrong here.","He was — обычный порядок, здесь он неверен.","He was oddiy tartib, bu yerda xato."],["This has normal order and the wrong tense.","Здесь обычный порядок и неверное время.","Bu yerda oddiy tartib va noto'g'ri zamon."]]},{"s":"linking-words-and-cohesion","q":"___ the rain, we went for a walk.","o":["Despite","Although","However"],"a":0,"w":[["Despite + noun: despite the rain.","Despite + существительное: despite the rain.","Despite + ot: despite the rain."],["Although needs a full clause: although it rained.","После although нужно предложение: although it rained.","Although dan keyin to'liq gap keladi: although it rained."],["However starts a new idea. It does not go with a noun like this.","However начинает новую мысль и так с существительным не идёт.","However yangi fikrni boshlaydi, ot bilan bunday kelmaydi."]]},{"s":"linking-words-and-cohesion","q":"The hotel was expensive. ___, the rooms were small.","o":["Moreover","Although","Because"],"a":0,"w":[["Moreover adds another point to the same argument.","Moreover добавляет ещё один довод.","Moreover shu fikrga yana bir dalil qo'shadi."],["Although joins two parts of one sentence.","Although соединяет части одного предложения.","Although bir gapning ikki qismini bog'laydi."],["Because gives a reason and needs a clause.","Because даёт причину и требует предложения.","Because sabab bildiradi va gap talab qiladi."]]},{"s":"advanced-articles-and-determiners","q":"___ of my two sisters are doctors.","o":["Both","Every","Each"],"a":0,"w":[["Both is for two together and takes a plural verb.","Both — про двоих вместе, глагол во множественном числе.","Both ikkisi birga, fe'l ko'plikda keladi."],["Every is not followed by of like this.","После every нельзя сразу of.","Every dan keyin bunday of kelmaydi."],["Each takes a singular verb: each of them is.","С each глагол в единственном числе: each of them is.","Each bilan fe'l birlikda keladi: each of them is."]]},{"s":"advanced-articles-and-determiners","q":"___ rich should pay more tax.","o":["The","A","(no word)"],"a":0,"w":[["The + adjective means a whole group of people.","The + прилагательное — целая группа людей.","The + sifat butun guruh odamlarni bildiradi."],["A cannot go with rich for a group.","A не ставится с rich для обозначения группы.","Guruh ma'nosida rich bilan a kelmaydi."],["Rich alone cannot be the subject here.","Одно rich не может быть здесь подлежащим.","Rich yolg'iz bu yerda ega bo'la olmaydi."]]},{"s":"future-in-the-past","q":"I knew she ___ late, as she always was.","o":["would be","will be","is being"],"a":0,"w":[["The future seen from the past: would.","Будущее с точки зрения прошлого: would.","O'tmishdan qaralgan kelajak: would."],["Will does not fit after knew.","Will не подходит после knew.","Knew dan keyin will mos kelmaydi."],["Is being is present, but knew is past.","Is being — настоящее, а knew — прошлое.","Is being hozirgi zamon, knew esa o'tgan."]]},{"s":"future-in-the-past","q":"We ___ leave at six, but the flight was cancelled.","o":["were going to","are going to","will"],"a":0,"w":[["A past plan that did not happen: was or were going to.","План в прошлом, который не состоялся: was или were going to.","Amalga oshmagan o'tmish rejasi: was yoki were going to."],["Are going to is a plan now, but the flight was cancelled.","Are going to — план сейчас, а рейс уже отменили.","Are going to hozirgi reja, parvoz esa bekor qilingan."],["Will does not fit a past plan that failed.","Will не подходит к сорвавшемуся плану в прошлом.","Will amalga oshmagan o'tmish rejasiga mos emas."]]}]};
</script><script src="exam.js"></script></body></html>
