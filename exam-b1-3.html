for means try to find.","Look for значит искать.","Look for qidirish degani."],["Look after means take care of.","Look after значит заботиться.","Look after g'amxo'rlik qilish degani."],["Look up means find information, for example in a dictionary.","Look up значит искать сведения, например в словаре.","Look up ma'lumot topish, masalan lug'atdan."]]},{"s":"reflexive-and-reciprocal-pronouns","q":"She cut ___ when she was cooking.","o":["herself","himself","her"],"a":0,"w":[["The person who cuts and is cut is the same woman: herself.","Порезала и порезалась одна и та же женщина: herself.","Kesgan ham, kesilgan ham o'sha ayol: herself."],["Himself is for a man.","Himself — для мужчины.","Himself erkak uchun."],["Her would mean another woman.","Her означало бы другую женщину.","Her boshqa ayolni bildirardi."]]},{"s":"reflexive-and-reciprocal-pronouns","q":"Ali and Olim help ___ with homework. Ali helps Olim, Olim helps Ali.","o":["each other","themselves","himself"],"a":0,"w":[["Two people do the action to the other: each other.","Двое делают это друг для друга: each other.","Ikki kishi bir-biriga qiladi: each other."],["Themselves means each one helps himself.","Themselves значит, что каждый помогает себе.","Themselves har biri o'ziga yordam beradi degani."],["Himself is for one person.","Himself — для одного человека.","Himself bitta odam uchun."]]},{"s":"so-and-neither","q":"\"I like tea.\" \"___ do I.\"","o":["So","Neither","Too"],"a":0,"w":[["We agree with a positive sentence: So do I.","Соглашаемся с утверждением: So do I.","Tasdiq gapga qo'shilamiz: So do I."],["Neither agrees with a negative sentence.","Neither соглашается с отрицанием.","Neither inkor gapga qo'shiladi."],["Too comes at the end: I do too.","Too ставится в конце: I do too.","Too oxirida keladi: I do too."]]},{"s":"so-and-neither","q":"\"I can't swim.\" \"Neither ___ I.\"","o":["can","can't","do"],"a":0,"w":[["Neither is already negative, so we use positive can.","Neither уже отрицание, поэтому положительное can.","Neither o'zi inkor, shuning uchun tasdiq can keladi."],["Two negatives do not go together here.","Два отрицания здесь вместе не ставятся.","Bu yerda ikki inkor birga kelmaydi."],["The first sentence uses can, so we repeat can.","В первом предложении can, поэтому повторяем can.","Birinchi gapda can bor, shuning uchun can takrorlanadi."]]},{"s":"past-perfect-continuous","q":"Her eyes were red because she ___.","o":["had been crying","has been crying","had cry"],"a":0,"w":[["A long action before a past moment: had been + -ing.","Длительное действие до момента в прошлом: had been + -ing.","O'tmishdagi paytdan oldin davom etgan ish: had been + -ing."],["Has been is linked to now, but this story is in the past.","Has been связано с настоящим, а рассказ о прошлом.","Has been hozirga bog'liq, hikoya esa o'tmish haqida."],["After had we need been crying or a past participle.","После had нужно been crying или третья форма.","Had dan keyin been crying yoki uchinchi shakl keladi."]]},{"s":"past-perfect-continuous","q":"They ___ for two hours when the bus finally came.","o":["had been waiting","were waited","have been waiting"],"a":0,"w":[["For two hours before the bus came: had been + -ing.","Два часа до приезда автобуса: had been + -ing.","Avtobus kelguncha ikki soat: had been + -ing."],["Were waited is a wrong passive form.","Were waited — неверная пассивная форма.","Were waited noto'g'ri passiv shakl."],["Have been is linked to now, but the bus came in the past.","Have been связано с настоящим, а автобус пришёл в прошлом.","Have been hozirga bog'liq, avtobus esa o'tmishda kelgan."]]},{"s":"so-and-such","q":"It was ___ a good film that I watched it twice.","o":["such","so","very"],"a":0,"w":[["Such + a + adjective + noun.","Such + a + прилагательное + существительное.","Such + a + sifat + ot."],["So goes with an adjective alone: so good.","So идёт с одним прилагательным: so good.","So faqat sifat bilan keladi: so good."],["Very cannot be followed by a that result here.","После very здесь не может идти результат с that.","Very dan keyin bu yerda that bilan natija kelmaydi."]]},{"s":"so-and-such","q":"The test was ___ hard that nobody passed.","o":["so","such","such a"],"a":0,"w":[["So + adjective + that.","So + прилагательное + that.","So + sifat + that."],["Such needs a noun: such a hard test.","Such нужно существительное: such a hard test.","Such ot talab qiladi: such a hard test."],["Such a needs a noun after the adjective.","После such a и прилагательного нужно существительное.","Such a dan keyin sifat va ot kerak."]]}]};
