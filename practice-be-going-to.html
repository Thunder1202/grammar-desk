</div><script src="app.js"></script><script>window.GD_QUIZ={"id":"be-going-to","rules":{"f":{"en":"Form: <b>am / is / are + going to + base verb</b>. I <b>am going to</b> study. She <b>is going to</b> study. They <b>are going to</b> study.","ru":"Форма: <b>am / is / are + going to + начальная форма глагола</b>. I <b>am going to</b> study. She <b>is going to</b> study. They <b>are going to</b> study.","uz":"Shakli: <b>am / is / are + going to + fe'lning asosiy shakli</b>. I <b>am going to</b> study. She <b>is going to</b> study. They <b>are going to</b> study."},"base":{"en":"After <b>going to</b> the verb is always the <b>base form</b>: She is going to <b>go</b> (not goes, not going).","ru":"После <b>going to</b> глагол всегда в <b>начальной форме</b>: She is going to <b>go</b> (не goes, не going).","uz":"<b>going to</b> dan keyin fe'l doim <b>asosiy shaklda</b> bo'ladi: She is going to <b>go</b> (goes emas, going emas)."},"neg":{"en":"Negative: <b>am / is / are + not + going to + verb</b>: I'<b>m not</b> going to go. She <b>isn't</b> going to come. They <b>aren't</b> going to wait.","ru":"Отрицание: <b>am / is / are + not + going to + глагол</b>: I'<b>m not</b> going to go. She <b>isn't</b> going to come. They <b>aren't</b> going to wait.","uz":"Inkor: <b>am / is / are + not + going to + fe'l</b>: I'<b>m not</b> going to go. She <b>isn't</b> going to come. They <b>aren't</b> going to wait."},"q":{"en":"Question: <b>Am / Is / Are + subject + going to + verb?</b> Are you going to study tonight?","ru":"Вопрос: <b>Am / Is / Are + подлежащее + going to + глагол?</b> Are you going to study tonight?","uz":"So'roq: <b>Am / Is / Are + ega + going to + fe'l?</b> Are you going to study tonight?"},"sa":{"en":"Short answers use <b>am / is / are</b>: Yes, I <b>am</b>. / No, she <b>isn't</b>. Do not repeat going to.","ru":"Краткие ответы с <b>am / is / are</b>: Yes, I <b>am</b>. / No, she <b>isn't</b>. going to не повторяйте.","uz":"Qisqa javoblar <b>am / is / are</b> bilan: Yes, I <b>am</b>. / No, she <b>isn't</b>. going to ni takrorlamang."},"wh":{"en":"Question word first: <b>What / Where / When + am / is / are + subject + going to + verb?</b> What are you going to do?","ru":"Сначала вопросительное слово: <b>What / Where / When + am / is / are + подлежащее + going to + глагол?</b> What are you going to do?","uz":"Avval so'roq so'z: <b>What / Where / When + am / is / are + ega + going to + fe'l?</b> What are you going to do?"},"plan":{"en":"<b>Plans and intentions</b>: we decided before speaking. I'<b>m going to</b> study medicine. We'<b>re going to</b> visit Bukhara in June.","ru":"<b>Планы и намерения</b>: решили до разговора. I'<b>m going to</b> study medicine. We'<b>re going to</b> visit Bukhara in June.","uz":"<b>Reja va niyatlar</b>: gapirishdan oldin qaror qilingan. I'<b>m going to</b> study medicine. We'<b>re going to</b> visit Bukhara in June."},"evid":{"en":"<b>Predictions with evidence</b>: we can see it now. Look at those clouds! It <b>is going to</b> rain.","ru":"<b>Предсказания по очевидным признакам</b>: мы видим это сейчас. Look at those clouds! It <b>is going to</b> rain.","uz":"<b>Dalilli bashoratlar</b>: hozir ko'rib turibmiz. Look at those clouds! It <b>is going to</b> rain."},"wg":{"en":"<b>going to</b> = plan made before. <b>will</b> = decision at the moment of speaking, promise or opinion: I've decided: I'<b>m going to</b> buy a phone. / The phone's ringing. I'<b>ll</b> answer it.","ru":"<b>going to</b> = план, принятый заранее. <b>will</b> = решение в момент речи, обещание или мнение: I've decided: I'<b>m going to</b> buy a phone. / The phone's ringing. I'<b>ll</b> answer it.","uz":"<b>going to</b> = oldindan qilingan reja. <b>will</b> = gapirish paytidagi qaror, va'da yoki fikr: I've decided: I'<b>m going to</b> buy a phone. / The phone's ringing. I'<b>ll</b> answer it."},"time":{"en":"Future time words: <b>tomorrow, tonight, next week / month, soon, this summer, in June</b>.","ru":"Слова будущего времени: <b>tomorrow, tonight, next week / month, soon, this summer, in June</b>.","uz":"Kelajak zamon so'zlari: <b>tomorrow, tonight, next week / month, soon, this summer, in June</b>."},"order":{"en":"Word order: <b>subject + am / is / are + going to + verb + the rest</b>. Questions: <b>(question word) + am / is / are + subject + going to + verb?</b>","ru":"Порядок слов: <b>подлежащее + am / is / are + going to + глагол + остальное</b>. Вопросы: <b>(вопросительное слово) + am / is / are + подлежащее + going to + глагол?</b>","uz":"So'zlar tartibi: <b>ega + am / is / are + going to + fe'l + qolgani</b>. So'roq: <b>(so'roq so'z) + am / is / are + ega + going to + fe'l?</b>"}},"ex":[{"h":{"en":"Write am, is or are.","ru":"Напишите am, is или are.","uz":"am, is yoki are yozing."}},{"h":{"en":"Write the verb in brackets with going to. Write all words, for example: is going to visit.","ru":"Напишите глагол из скобок с going to. Пишите все слова, например: is going to visit.","uz":"Qavs ichidagi fe'lni going to bilan yozing. Hamma so'zlarni yozing, masalan: is going to visit."}},{"h":{"en":"Make the sentence negative. Write the full sentence.","ru":"Сделайте предложение отрицательным. Напишите его полностью.","uz":"Gapni inkor qiling. To'liq gapni yozing."}},{"h":{"en":"Make a question. Write the full question.","ru":"Составьте вопрос. Напишите вопрос полностью.","uz":"Savol tuzing. To'liq savolni yozing."}},{"h":{"en":"Write a short answer. ✓ = yes, ✗ = no. Example: Is he going to come? (✓) → Yes, he is.","ru":"Напишите краткий ответ. ✓ = да, ✗ = нет. Например: Is he going to come? (✓) → Yes, he is.","uz":"Qisqa javob yozing. ✓ = ha, ✗ = yo'q. Masalan: Is he going to come? (✓) → Yes, he is."}},{"h":{"en":"Questions with a question word. Write the missing word or the full question.","ru":"Вопросы с вопросительным словом. Напишите пропущенное слово или весь вопрос.","uz":"So'roq so'zli savollar. Tushib qolgan so'zni yoki to'liq savolni yozing."}},{"h":{"en":"Look at the picture in the sentence! Write going to + the verb in brackets (a prediction with evidence).","ru":"Посмотрите на ситуацию в предложении! Напишите going to + глагол из скобок (предсказание по признакам).","uz":"Gapdagi holatga qarang! going to + qavs ichidagi fe'lni yozing (dalilli bashorat)."}},{"h":{"en":"Going to or will? Write the correct one: am / is / are going to, or will. Plans made before = going to. Quick decisions = will.","ru":"Going to или will? Напишите верный вариант: am / is / are going to или will. План заранее = going to. Быстрое решение = will.","uz":"Going to yoki will? To'g'risini yozing: am / is / are going to yoki will. Oldindan reja = going to. Tezkor qaror = will."}},{"h":{"en":"Write the missing word: going, to, tomorrow, next or tonight.","ru":"Напишите пропущенное слово: going, to, tomorrow, next или tonight.","uz":"Tushib qolgan so'zni yozing: going, to, tomorrow, next yoki tonight."}},{"h":{"en":"Find the mistake and write the correct sentence.","ru":"Найдите ошибку и напишите правильное предложение.","uz":"Xatoni toping va to'g'ri gapni yozing."}},{"h":{"en":"Put the words in the correct order.","ru":"Расставьте слова в правильном порядке.","uz":"So'zlarni to'g'ri tartibga qo'ying."}}],"q":[{"e":0,"q":"I ___ going to study tonight.","a":["am"],"r":"f","ru":"Сегодня вечером я собираюсь заниматься.","uz":"Bugun kechqurun men o'qimoqchiman."},{"e":0,"q":"She ___ going to visit her aunt.","a":["is"],"r":"f","ru":"Она собирается навестить тётю.","uz":"U xolasinikiga bormoqchi."},{"e":0,"q":"They ___ going to buy a new car.","a":["are"],"r":"f","ru":"Они собираются купить новую машину.","uz":"Ular yangi mashina sotib olmoqchi."},{"e":0,"q":"We ___ going to have a party.","a":["are"],"r":"f","ru":"Мы собираемся устроить вечеринку.","uz":"Biz ziyofat o'tkazmoqchimiz."},{"e":0,"q":"My brother ___ going to learn English.","a":["is"],"r":"f","ru":"Мой брат собирается учить английский.","uz":"Akam ingliz tilini o'rganmoqchi.","n":"My brother = he"},{"e":0,"q":"You ___ going to love this film.","a":["are"],"r":"evid","ru":"Тебе очень понравится этот фильм.","uz":"Bu film sizga juda yoqadi."},{"e":0,"q":"It ___ going to be a hot day.","a":["is"],"r":"evid","ru":"Будет жаркий день.","uz":"Issiq kun bo'ladi."},{"e":0,"q":"The children ___ going to play in the park.","a":["are"],"r":"f","ru":"Дети собираются играть в парке.","uz":"Bolalar parkda o'ynamoqchi."},{"e":1,"q":"I ___ (study) medicine.","a":["am going to study"],"r":"plan","ru":"Я собираюсь изучать медицину.","uz":"Men tibbiyotni o'qimoqchiman."},{"e":1,"q":"She ___ (visit) her uncle next week.","a":["is going to visit"],"r":"plan","ru":"На следующей неделе она собирается навестить дядю.","uz":"Kelasi hafta u amakisinikiga bormoqchi."},{"e":1,"q":"We ___ (travel) to Turkey this summer.","a":["are going to travel"],"r":"plan","ru":"Этим летом мы собираемся поехать в Турцию.","uz":"Bu yozda biz Turkiyaga sayohat qilmoqchimiz."},{"e":1,"q":"They ___ (build) a new house.","a":["are going to build"],"r":"plan","ru":"Они собираются построить новый дом.","uz":"Ular yangi uy qurmoqchi."},{"e":1,"q":"He ___ (watch) a film tonight.","a":["is going to watch"],"r":"plan","ru":"Сегодня вечером он собирается посмотреть фильм.","uz":"U bugun kechqurun film ko'rmoqchi."},{"e":1,"q":"I ___ (cook) dinner for my family.","a":["am going to cook"],"r":"plan","ru":"Я собираюсь приготовить ужин для семьи.","uz":"Men oilam uchun kechki ovqat pishirmoqchiman."},{"e":1,"q":"My sister ___ (get) married in June.","a":["is going to get"],"r":"plan","ru":"Моя сестра выходит замуж в июне.","uz":"Singlim iyun oyida turmushga chiqmoqchi.","n":"My sister = she"},{"e":1,"q":"You ___ (need) a coat. It's very cold.","a":["are going to need"],"r":"evid","ru":"Тебе понадобится пальто. Очень холодно.","uz":"Sizga palto kerak bo'ladi. Juda sovuq."},{"e":1,"q":"They ___ (learn) Spanish next year.","a":["are going to learn"],"r":"plan","ru":"В следующем году они собираются учить испанский.","uz":"Kelasi yili ular ispan tilini o'rganmoqchi."},{"e":1,"q":"I ___ (buy) a new laptop tomorrow.","a":["am going to buy"],"r":"plan","ru":"Завтра я собираюсь купить новый ноутбук.","uz":"Ertaga men yangi noutbuk sotib olmoqchiman."},{"e":2,"q":"I am going to cook dinner.","a":["I'm not going to cook dinner.","I am not going to cook dinner."],"r":"neg","ru":"Я не собираюсь готовить ужин.","uz":"Men kechki ovqat pishirmoqchi emasman."},{"e":2,"q":"She is going to come.","a":["She isn't going to come.","She is not going to come."],"r":"neg","ru":"Она не собирается приходить.","uz":"U kelmoqchi emas."},{"e":2,"q":"They are going to wait.","a":["They aren't going to wait.","They are not going to wait."],"r":"neg","ru":"Они не собираются ждать.","uz":"Ular kutmoqchi emas."},{"e":2,"q":"He is going to call you.","a":["He isn't going to call you.","He is not going to call you."],"r":"neg","ru":"Он не собирается тебе звонить.","uz":"U sizga qo'ng'iroq qilmoqchi emas."},{"e":2,"q":"We are going to move.","a":["We aren't going to move.","We are not going to move."],"r":"neg","ru":"Мы не собираемся переезжать.","uz":"Biz ko'chib o'tmoqchi emasmiz."},{"e":2,"q":"It is going to rain.","a":["It isn't going to rain.","It is not going to rain."],"r":"neg","ru":"Дождя не будет.","uz":"Yomg'ir yog'maydi."},{"e":3,"q":"you / study / tonight","a":["Are you going to study tonight?"],"r":"q","ru":"Ты собираешься заниматься сегодня вечером?","uz":"Bugun kechqurun o'qimoqchimisiz?"},{"e":3,"q":"she / visit / us","a":["Is she going to visit us?"],"r":"q","ru":"Она собирается нас навестить?","uz":"U bizning oldimizga kelmoqchimi?"},{"e":3,"q":"they / buy / a house","a":["Are they going to buy a house?"],"r":"q","ru":"Они собираются купить дом?","uz":"Ular uy sotib olmoqchimi?"},{"e":3,"q":"he / play / football / tomorrow","a":["Is he going to play football tomorrow?"],"r":"q","ru":"Он собирается играть в футбол завтра?","uz":"U ertaga futbol o'ynamoqchimi?"},{"e":3,"q":"it / rain / today","a":["Is it going to r
