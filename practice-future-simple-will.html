</div><script src="app.js"></script><script>window.GD_QUIZ={"id":"future-simple-will","rules":{"f":{"en":"Future Simple: <b>will + base verb</b> for all people: I <b>will go</b>, she <b>will go</b>, they <b>will go</b>. Short form: <b>'ll</b> (I'll, she'll, they'll).","ru":"Future Simple: <b>will + начальная форма глагола</b> для всех лиц: I <b>will go</b>, she <b>will go</b>, they <b>will go</b>. Краткая форма: <b>'ll</b> (I'll, she'll, they'll).","uz":"Future Simple: <b>will + fe'lning asosiy shakli</b> barcha shaxslar uchun: I <b>will go</b>, she <b>will go</b>, they <b>will go</b>. Qisqa shakl: <b>'ll</b> (I'll, she'll, they'll)."},"base":{"en":"After <b>will</b> the verb is always the <b>base form</b>: She will <b>go</b> (not goes, not to go).","ru":"После <b>will</b> глагол всегда в <b>начальной форме</b>: She will <b>go</b> (не goes, не to go).","uz":"<b>will</b> dan keyin fe'l doim <b>asosiy shaklda</b> bo'ladi: She will <b>go</b> (goes emas, to go emas)."},"neg":{"en":"Negative: <b>will not = won't + base verb</b>: I <b>won't</b> be late. She <b>won't</b> come.","ru":"Отрицание: <b>will not = won't + начальная форма</b>: I <b>won't</b> be late. She <b>won't</b> come.","uz":"Inkor: <b>will not = won't + fe'lning asosiy shakli</b>: I <b>won't</b> be late. She <b>won't</b> come."},"q":{"en":"Question: <b>Will + subject + base verb?</b> Will you help me? Will it rain?","ru":"Вопрос: <b>Will + подлежащее + начальная форма?</b> Will you help me? Will it rain?","uz":"So'roq: <b>Will + ega + fe'lning asosiy shakli?</b> Will you help me? Will it rain?"},"sa":{"en":"Short answers: Yes, I <b>will</b>. / No, I <b>won't</b>. Do not repeat the verb.","ru":"Краткие ответы: Yes, I <b>will</b>. / No, I <b>won't</b>. Глагол не повторяйте.","uz":"Qisqa javoblar: Yes, I <b>will</b>. / No, I <b>won't</b>. Fe'lni takrorlamang."},"wh":{"en":"Question word first: <b>What / Where / When / Who + will + subject + base verb?</b> What will you do?","ru":"Сначала вопросительное слово: <b>What / Where / When / Who + will + подлежащее + начальная форма?</b> What will you do?","uz":"Avval so'roq so'z: <b>What / Where / When / Who + will + ega + fe'lning asosiy shakli?</b> What will you do?"},"pred":{"en":"<b>Predictions</b> (what we think will happen): <b>I think / I'm sure / I hope / probably / perhaps</b> + will: I think it <b>will rain</b> tomorrow.","ru":"<b>Предсказания</b> (что, по нашему мнению, случится): <b>I think / I'm sure / I hope / probably / perhaps</b> + will: I think it <b>will rain</b> tomorrow.","uz":"<b>Bashoratlar</b> (nima bo'lishini o'ylaymiz): <b>I think / I'm sure / I hope / probably / perhaps</b> + will: I think it <b>will rain</b> tomorrow."},"dec":{"en":"<b>will</b> is used for a decision at the moment of speaking (<b>spontaneous</b>), for <b>offers</b> and <b>promises</b>: The phone is ringing. — I'll answer it. / I'll help you. / I won't tell anyone.","ru":"<b>will</b> используется для решения в момент речи (<b>спонтанного</b>), для <b>предложений помощи</b> и <b>обещаний</b>: The phone is ringing. — I'll answer it. / I'll help you. / I won't tell anyone.","uz":"<b>will</b> gapirish paytida qabul qilingan qaror (<b>kutilmagan</b>), <b>taklif</b> va <b>va'da</b> uchun ishlatiladi: The phone is ringing. — I'll answer it. / I'll help you. / I won't tell anyone."},"prob":{"en":"<b>probably</b> goes <b>after will</b> and <b>before won't</b>: She will probably win. She probably won't come.","ru":"<b>probably</b> ставится <b>после will</b> и <b>перед won't</b>: She will probably win. She probably won't come.","uz":"<b>probably</b> <b>will dan keyin</b> va <b>won't dan oldin</b> keladi: She will probably win. She probably won't come."},"cond":{"en":"After <b>if, when, as soon as, before, after</b> we use the <b>Present Simple</b>, not will: If it <b>rains</b>, we will stay home. (not If it will rain)","ru":"После <b>if, when, as soon as, before, after</b> используется <b>Present Simple</b>, а не will: If it <b>rains</b>, we will stay home. (не If it will rain)","uz":"<b>if, when, as soon as, before, after</b> dan keyin <b>Present Simple</b> ishlatiladi, will emas: If it <b>rains</b>, we will stay home. (If it will rain emas)"},"time":{"en":"Future time words: <b>tomorrow, tonight, next week / year, in two days, soon, in 2030</b>.","ru":"Слова будущего времени: <b>tomorrow, tonight, next week / year, in two days, soon, in 2030</b>.","uz":"Kelajak zamon so'zlari: <b>tomorrow, tonight, next week / year, in two days, soon, in 2030</b>."},"order":{"en":"Word order: <b>subject + will + verb + the rest</b>. Questions: <b>(question word) + will + subject + verb?</b>","ru":"Порядок слов: <b>подлежащее + will + глагол + остальное</b>. Вопросы: <b>(вопросительное слово) + will + подлежащее + глагол?</b>","uz":"So'zlar tartibi: <b>ega + will + fe'l + qolgani</b>. So'roq: <b>(so'roq so'z) + will + ega + fe'l?</b>"}},"ex":[{"h":{"en":"Write will or won't. (yes) = will, (no) = won't.","ru":"Напишите will или won't. (yes) = will, (no) = won't.","uz":"will yoki won't yozing. (yes) = will, (no) = won't."}},{"h":{"en":"Write the verb in brackets with will. Write both words, for example: will go.","ru":"Напишите глагол из скобок с will. Пишите оба слова, например: will go.","uz":"Qavs ichidagi fe'lni will bilan yozing. Ikkala so'zni yozing, masalan: will go."}},{"h":{"en":"Make the sentence negative. Write the full sentence.","ru":"Сделайте предложение отрицательным. Напишите его полностью.","uz":"Gapni inkor qiling. To'liq gapni yozing."}},{"h":{"en":"Make a question. Write the full question.","ru":"Составьте вопрос. Напишите вопрос полностью.","uz":"Savol tuzing. To'liq savolni yozing."}},{"h":{"en":"Write a short answer. ✓ = yes, ✗ = no. Example: Will he come? (✓) → Yes, he will.","ru":"Напишите краткий ответ. ✓ = да, ✗ = нет. Например: Will he come? (✓) → Yes, he will.","uz":"Qisqa javob yozing. ✓ = ha, ✗ = yo'q. Masalan: Will he come? (✓) → Yes, he will."}},{"h":{"en":"Questions with a question word. Write the missing word or the full question.","ru":"Вопросы с вопросительным словом. Напишите пропущенное слово или весь вопрос.","uz":"So'roq so'zli savollar. Tushib qolgan so'zni yoki to'liq savolni yozing."}},{"h":{"en":"Decide now! Write will + the verb in brackets (a quick decision, an offer or a promise).","ru":"Решите сейчас! Напишите will + глагол из скобок (быстрое решение, предложение помощи или обещание).","uz":"Hozir qaror qiling! will + qavs ichidagi fe'lni yozing (tezkor qaror, taklif yoki va'da)."}},{"h":{"en":"Predictions. Write will + the verb, or put the word in brackets in the right place.","ru":"Предсказания. Напишите will + глагол или поставьте слово из скобок на нужное место.","uz":"Bashoratlar. will + fe'lni yozing yoki qavsdagi so'zni to'g'ri joyga qo'ying."}},{"h":{"en":"If, when, as soon as: will or Present Simple? Write the verb in brackets.","ru":"If, when, as soon as: will или Present Simple? Напишите глагол из скобок.","uz":"If, when, as soon as: will yoki Present Simple? Qavs ichidagi fe'lni yozing."}},{"h":{"en":"Find the mistake and write the correct sentence.","ru":"Найдите ошибку и напишите правильное предложение.","uz":"Xatoni toping va to'g'ri gapni yozing."}},{"h":{"en":"Put the words in the correct order.","ru":"Расставьте слова в правильном порядке.","uz":"So'zlarni to'g'ri tartibga qo'ying."}}],"q":[{"e":0,"q":"It's very cold. I think it ___ snow tomorrow. (yes)","a":["will"],"r":"pred","ru":"Очень холодно. Думаю, завтра пойдёт снег.","uz":"Juda sovuq. Menimcha, ertaga qor yog'adi."},{"e":0,"q":"Don't worry! I ___ tell anyone. (no)","a":["won't"],"r":"dec","ru":"Не волнуйся! Я никому не скажу.","uz":"Xavotir olmang! Men hech kimga aytmayman."},{"e":0,"q":"I'm sure they ___ win the match. (yes)","a":["will"],"r":"pred","ru":"Я уверен, они выиграют матч.","uz":"Ishonchim komilki, ular o'yinda g'alaba qozonadi."},{"e":0,"q":"She is ill. She ___ come to school tomorrow. (no)","a":["won't"],"r":"neg","ru":"Она больна. Завтра она не придёт в школу.","uz":"U kasal. Ertaga u maktabga kelmaydi."},{"e":0,"q":"The test is easy. You ___ have any problems. (no)","a":["won't"],"r":"neg","ru":"Тест лёгкий. У тебя не будет проблем.","uz":"Test oson. Sizda hech qanday muammo bo'lmaydi."},{"e":0,"q":"Wait here. I ___ be back in five minutes. (yes)","a":["will"],"r":"f","ru":"Подожди здесь. Я вернусь через пять минут.","uz":"Shu yerda kuting. Men besh daqiqada qaytaman."},{"e":0,"q":"Take an umbrella. It ___ rain later. (yes)","a":["will"],"r":"pred","ru":"Возьми зонт. Позже пойдёт дождь.","uz":"Soyabon oling. Keyinroq yomg'ir yog'adi."},{"e":0,"q":"Don't be afraid. The dog ___ hurt you. (no)","a":["won't"],"r":"neg","ru":"Не бойся. Собака тебя не укусит.","uz":"Qo'rqmang. It sizga zarar yetkazmaydi."},{"e":1,"q":"She ___ (be) 20 next year.","a":["will be"],"r":"f","ru":"В следующем году ей будет 20 лет.","uz":"Kelasi yili u 20 yoshga to'ladi."},{"e":1,"q":"I ___ (call) you tomorrow.","a":["will call"],"r":"f","ru":"Я позвоню тебе завтра.","uz":"Men senga ertaga qo'ng'iroq qilaman."},{"e":1,"q":"They ___ (arrive) at 6 o'clock.","a":["will arrive"],"r":"f","ru":"Они приедут в 6 часов.","uz":"Ular soat 6 da yetib kelishadi."},{"e":1,"q":"We ___ (have) a party next Saturday.","a":["will have"],"r":"f","ru":"В следующую субботу у нас будет вечеринка.","uz":"Kelasi shanba kuni bizda ziyofat bo'ladi."},{"e":1,"q":"My brother ___ (study) medicine.","a":["will study"],"r":"base","ru":"Мой брат будет изучать медицину.","uz":"Akam tibbiyotni o'qiydi."},{"e":1,"q":"The shop ___ (open) at 9 o'clock.","a":["will open"],"r":"f","ru":"Магазин откроется в 9 часов.","uz":"Do'kon soat 9 da ochiladi."},{"e":1,"q":"You ___ (see) many beautiful places in Italy.","a":["will see"],"r":"f","ru":"В Италии ты увидишь много красивых мест.","uz":"Italiyada siz ko'plab go'zal joylarni ko'rasiz."},{"e":1,"q":"He ___ (be) a good doctor.","a":["will be"],"r":"pred","ru":"Он будет хорошим врачом.","uz":"U yaxshi shifokor bo'ladi."},{"e":1,"q":"I ___ (send) you the photos tonight.","a":["will send"],"r":"f","ru":"Я отправлю тебе фото сегодня вечером.","uz":"Men senga suratlarni bugun kechqurun yuboraman."},{"e":1,"q":"In 2050 people ___ (live) on Mars.","a":["will live"],"r":"pred","ru":"В 2050 году люди будут жить на Марсе.","uz":"2050-yilda odamlar Marsda yashaydi."},{"e":2,"q":"I will be late.","a":["I won't be late.","I will not be late."],"r":"neg","ru":"Я не опоздаю.","uz":"Men kechikmayman."},{"e":2,"q":"She will come to the party.","a":["She won't come to the party.","She will not come to the party."],"r":"neg","ru":"Она не придёт на вечеринку.","uz":"U ziyofatga kelmaydi."},{"e":2,"q":"They will help us.","a":["They won't help us.","They will not help us."],"r":"neg","ru":"Они нам не помогут.","uz":"Ular bizga yordam bermaydi."},{"e":2,"q":"It will rain tomorrow.","a":["It won't rain tomorrow.","It will not rain tomorrow."],"r":"neg","ru":"Завтра дождя не будет.","uz":"Ertaga yomg'ir yog'maydi."},{"e":2,"q":"He will pass the exam.","a":["He won't pass the exam.","He will not pass the exam."],"r":"neg","ru":"Он не сдаст экзамен.","uz":"U imtihondan o'tmaydi."},{"e":2,"q":"We will need a car.","a":["We won't need a car.","We will not need a car."],"r":"neg","ru":"Нам не понадобится машина.","uz":"Bizga mashina kerak bo'lmaydi."},{"e":2,"q":"You will like this book.","a":["You won't like this book.","You will not like this book."],"r":"neg","ru":"Тебе не понравится эта книга.","uz":"Sizga bu kitob yoqmaydi."},{"e":2,"q":"I will tell the truth.","a":["I won't tell the truth.","I will not tell the truth."],"r":"neg","ru":"Я не скажу правду.","uz":"Men haqiqatni aytmayman."},{"e":3,"q":"you / help / me","a":["Will you help me?"],"r":"q","ru":"Ты поможешь мне?","uz":"Menga yordam berasizmi?"},{"e":3,"q":"it / rain / tomorrow","a":["Will it rain tomorrow?"],"r":"q","ru":"Завтра будет дождь?","uz":"Ertaga yomg'ir yog'adimi?"},{"e":3,"q":"she / come / to the party","a":["Will she come to the party?"],"r":"q","ru":"Она придёт на вечеринку?","uz":"U ziyofatga keladimi?"},{"e":3,"q":"they / be / here / on time","a":["Will they be here on time?"],"r":"q","ru":"Они будут здесь вовремя?","uz":"Ular shu yerda o'z vaqtida bo'ladimi?"},{"e":3,"q":"your brother / pass / the exam","a":["Will your brother pass the exam?"],"r":"q","ru":"Твой брат сдаст экзамен?","uz":"Akangiz imtihondan o'tadimi?"},{"e":3,"q":"we / need / our passports","a":["Will we need our passports?"],"r":"q","ru":"Нам понадобятся паспорта?","uz":"Bizga pasportlar kerak bo'ladimi?"},{"e":4,"q":"Will you help me? (✓)","a":["Yes, I will."],"r":"sa","ru":"Ты мне поможешь? Да.","uz":"Menga yordam berasizmi? Ha."},{"e":4,"q":"Will it rain? (✗)","a":["No, it won't.","No, it will not."],"r":"sa","ru":"Будет дождь? Нет.","uz":"Yomg'ir yog'adimi? Yo'q."},{"e":4,"q":"Will she come? (✓)","a":["Yes, she will."],"r":"sa","ru":"Она придёт? Да.","uz":"U keladimi? Ha."},{"e":4,"q":"Will they be late? (✗)","a":["No, they won't.","No, they will not."],"r":"sa","ru":"Они опоздают? Нет.","uz":"Ular kechikadimi? Yo'q."},{"e":4,"q":"Will you tell him? (✗)","a":["No, I won't.","No, I will not."],"r":"sa","ru":"Ты ему скажешь? Нет.","uz":"Siz unga aytasizmi? Yo'q."},{"e":4,"q":"Will we win? (✓)","a":["Yes, we will."],"r":"sa","ru":"Мы выиграем? Да.","uz":"Biz g'alaba qozonamizmi? Ha."},{"e":5,"q":"What ___ you do tomorrow?","a":["will"],"r":"wh","ru":"Что ты будешь делать завтра?","uz":"Ertaga nima qilasiz?"},{"e":5,"q":"Where ___ they stay in Rome?","a":["will"],"r":"wh","ru":"Где они остановятся в Риме?","uz":"Ular Rimda qayerda turadi?"},{"e":5,"q":"when / she / arrive","a":["When will she arrive?"],"r":"wh","ru":"Когда она приедет?","uz":"U qachon yetib keladi?"},{"e":5,"q":"who / help / us","a":["Who will help us?"],"r":"wh","ru":"Кто нам поможет?","uz":"Bizga kim yordam beradi?"},{"e":6,"q":"The phone is ringing. — I ___ (answer) it.","a":["will answer","'ll answer"],"r":"dec","ru":"Телефон звонит. — Я отвечу.","uz":"Telefon jiringlayapti. — Men javob beraman."},{"e":6,"q":"It's hot in here. — I ___ (open) the window.","a":["will open","'ll open"],"r":"dec","ru":"Здесь жарко. — Я открою окно.","uz":"Bu yerda issiq. — Men derazani ochaman."},{"e":6,"q":"I'm thirsty. — I ___ (get) you some water.","a":["will get","'ll get"],"r":"dec","ru":"Я хочу пить. — Я принесу тебе воды.","uz":"Chanqadim. — Men senga suv olib kelaman."},{"e":6,"q":"These bags are heavy. — I ___ (carry) them for you.","a":["will carry","'ll carry"],"r":"dec","ru":"Эти сумки тяжёлые. — Я понесу их за тебя.","uz":"Bu sumkalar og'ir. — Men ularni senga ko'tarib beraman."},{"e":6,"q":"I promise I ___ (not / forget) your birthday.","a":["won't forget","will not forget"],"r":"dec","ru":"Обещаю, что не забуду твой день рождения.","uz":"Va'da beramanki, tug'ilgan kuningni unutmayman."},{"e":6,"q":"I'm tired. — I think I ___ (go) to bed.","a":["will go","'ll go"],"r":"dec","ru":"Я устал. — Думаю, я пойду спать.","uz":"Charchadim. — Menimcha, yotaman."},{"e":7,"q":"She ___ (probably / win) the race.","a":["will probably win"],"r":"prob","ru":"Она, вероятно, выиграет забег.","uz":"U musobaqada, ehtimol, g'alaba qozonadi."},{"e":7,"q":"They ___ (probably / not / come).","a":["probably won't come"],"r":"prob","ru":"Они, вероятно, не придут.","uz":"Ular, ehtimol, kelmaydi."},{"e":7,"q":"I think the exam ___ (be) difficult.","a":["will be"],"r":"pred","ru":"Думаю, экзамен будет трудным.","uz":"Menimcha, imtihon qiyin bo'ladi."},{"e":7,"q":"I hope you ___ (like) the gift.","a":["will like"],"r":"pred","ru":"Надеюсь, тебе понравится подарок.","uz":"Umid qilamanki, sovg'a sizga yoqadi."},{"e":7,"q":"Perhaps he ___ (call) us tonight.","a":["will call"],"r":"pred","ru":"Возможно, он позвонит нам сегодня вечером.","uz":"Ehtimol, u bugun kechqurun bizga qo'ng'iroq qiladi."},{"e":7,"q":"She is very clever. She ___ (be) a great scientist.","a":["will be"],"r":"pred","ru":"Она очень умная. Она станет великим учёным.","uz":"U juda aqlli. U bu
