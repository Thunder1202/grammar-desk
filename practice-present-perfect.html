</div><script src="app.js"></script><script>window.GD_QUIZ={"id":"present-perfect","rules":{"hv":{"en":"Present Perfect: <b>have / has + past participle</b>. Use <b>has</b> with he / she / it and <b>have</b> with I / you / we / they: She <b>has</b> finished. They <b>have</b> finished.","ru":"Present Perfect: <b>have / has + причастие прошедшего времени (3-я форма)</b>. <b>has</b> с he / she / it, <b>have</b> с I / you / we / they: She <b>has</b> finished. They <b>have</b> finished.","uz":"Present Perfect: <b>have / has + o'tgan zamon sifatdoshi (3-shakl)</b>. <b>has</b> he / she / it bilan, <b>have</b> I / you / we / they bilan: She <b>has</b> finished. They <b>have</b> finished."},"pp":{"en":"Regular verbs: the participle is like the Past Simple, add <b>-ed</b>: finish → finished, study → studied, stop → stopped.","ru":"Правильные глаголы: причастие такое же, как Past Simple, добавьте <b>-ed</b>: finish → finished, study → studied, stop → stopped.","uz":"Muntazam fe'llar: sifatdosh Past Simple kabi, <b>-ed</b> qo'shing: finish → finished, study → studied, stop → stopped."},"irr":{"en":"<b>Irregular verbs</b> have a special 3rd form: go → <b>gone</b>, see → <b>seen</b>, eat → <b>eaten</b>, write → <b>written</b>, do → <b>done</b>, be → <b>been</b>, buy → <b>bought</b>.","ru":"У <b>неправильных глаголов</b> особая 3-я форма: go → <b>gone</b>, see → <b>seen</b>, eat → <b>eaten</b>, write → <b>written</b>, do → <b>done</b>, be → <b>been</b>, buy → <b>bought</b>.","uz":"<b>Noto'g'ri fe'llar</b>ning maxsus 3-shakli bor: go → <b>gone</b>, see → <b>seen</b>, eat → <b>eaten</b>, write → <b>written</b>, do → <b>done</b>, be → <b>been</b>, buy → <b>bought</b>."},"neg":{"en":"Negative: <b>haven't / hasn't + past participle</b>: I <b>haven't</b> seen him. She <b>hasn't</b> called.","ru":"Отрицание: <b>haven't / hasn't + причастие</b>: I <b>haven't</b> seen him. She <b>hasn't</b> called.","uz":"Inkor: <b>haven't / hasn't + sifatdosh</b>: I <b>haven't</b> seen him. She <b>hasn't</b> called."},"q":{"en":"Question: <b>Have / Has + subject + past participle?</b> Have you finished? Has she called?","ru":"Вопрос: <b>Have / Has + подлежащее + причастие?</b> Have you finished? Has she called?","uz":"So'roq: <b>Have / Has + ega + sifatdosh?</b> Have you finished? Has she called?"},"sa":{"en":"Short answers use <b>have / has</b>: Yes, I <b>have</b>. / No, she <b>hasn't</b>. Do not repeat the verb.","ru":"Краткие ответы с <b>have / has</b>: Yes, I <b>have</b>. / No, she <b>hasn't</b>. Глагол не повторяйте.","uz":"Qisqa javoblar <b>have / has</b> bilan: Yes, I <b>have</b>. / No, she <b>hasn't</b>. Fe'lni takrorlamang."},"exp":{"en":"<b>Experience</b> (life up to now, no exact time): <b>ever</b> (questions), <b>never</b>, <b>before</b>, <b>twice</b>, <b>three times</b>: Have you <b>ever</b> been to Japan? I have <b>never</b> eaten sushi.","ru":"<b>Опыт</b> (жизнь до сих пор, без точного времени): <b>ever</b> (вопросы), <b>never</b>, <b>before</b>, <b>twice</b>, <b>three times</b>: Have you <b>ever</b> been to Japan? I have <b>never</b> eaten sushi.","uz":"<b>Tajriba</b> (hozirgacha bo'lgan hayot, aniq vaqtsiz): <b>ever</b> (savollarda), <b>never</b>, <b>before</b>, <b>twice</b>, <b>three times</b>: Have you <b>ever</b> been to Japan? I have <b>never</b> eaten sushi."},"fs":{"en":"<b>for</b> + a period of time (for five years). <b>since</b> + a starting point (since 2015, since Monday, since I was a child).","ru":"<b>for</b> + период времени (for five years). <b>since</b> + начальная точка (since 2015, since Monday, since I was a child).","uz":"<b>for</b> + vaqt davomiyligi (for five years). <b>since</b> + boshlanish nuqtasi (since 2015, since Monday, since I was a child)."},"res":{"en":"<b>just</b> = a moment ago. <b>already</b> = earlier than expected. <b>yet</b> = until now, in questions and negatives, at the end: Have you finished <b>yet</b>? I haven't finished <b>yet</b>.","ru":"<b>just</b> = только что. <b>already</b> = уже, раньше, чем ожидалось. <b>yet</b> = до сих пор, в вопросах и отрицаниях, в конце: Have you finished <b>yet</b>? I haven't finished <b>yet</b>.","uz":"<b>just</b> = hozirgina. <b>already</b> = kutilganidan oldin, allaqachon. <b>yet</b> = hozirgacha, savol va inkorda, oxirida: Have you finished <b>yet</b>? I haven't finished <b>yet</b>."},"been":{"en":"<b>been</b> = went and came back: I have <b>been</b> to Paris. <b>gone</b> = went and is still there: She has <b>gone</b> to Paris (she is not here).","ru":"<b>been</b> = съездил и вернулся: I have <b>been</b> to Paris. <b>gone</b> = уехал и ещё там: She has <b>gone</b> to Paris (её здесь нет).","uz":"<b>been</b> = borib qaytgan: I have <b>been</b> to Paris. <b>gone</b> = ketgan va hali o'sha yerda: She has <b>gone</b> to Paris (u bu yerda emas)."},"ps":{"en":"Finished time (yesterday, last year, in 2019, two days ago, when...) = <b>Past Simple</b>. No finished time (ever, never, just, already, yet, so far, this week) = <b>Present Perfect</b>.","ru":"Законченное время (yesterday, last year, in 2019, two days ago, when...) = <b>Past Simple</b>. Нет законченного времени (ever, never, just, already, yet, so far, this week) = <b>Present Perfect</b>.","uz":"Tugagan vaqt (yesterday, last year, in 2019, two days ago, when...) = <b>Past Simple</b>. Tugagan vaqt yo'q (ever, never, just, already, yet, so far, this week) = <b>Present Perfect</b>."},"order":{"en":"Word order: <b>subject + have / has + (never / just / already) + participle + the rest</b>. Questions: <b>Have / Has + subject + (ever) + participle?</b>","ru":"Порядок слов: <b>подлежащее + have / has + (never / just / already) + причастие + остальное</b>. Вопросы: <b>Have / Has + подлежащее + (ever) + причастие?</b>","uz":"So'zlar tartibi: <b>ega + have / has + (never / just / already) + sifatdosh + qolgani</b>. So'roq: <b>Have / Has + ega + (ever) + sifatdosh?</b>"}},"ex":[{"h":{"en":"Write have or has.","ru":"Напишите have или has.","uz":"have yoki has yozing."}},{"h":{"en":"Write the past participle (3rd form). Example: go → gone.","ru":"Напишите причастие (3-ю форму). Например: go → gone.","uz":"Sifatdoshni (3-shaklni) yozing. Masalan: go → gone."}},{"h":{"en":"Write the verb in brackets in the Present Perfect. Write both words, for example: has seen.","ru":"Напишите глагол из скобок в Present Perfect. Пишите оба слова, например: has seen.","uz":"Qavs ichidagi fe'lni Present Perfect da yozing. Ikkala so'zni yozing, masalan: has seen."}},{"h":{"en":"Make the sentence negative. Write the full sentence.","ru":"Сделайте предложение отрицательным. Напишите его полностью.","uz":"Gapni inkor qiling. To'liq gapni yozing."}},{"h":{"en":"Make a question. Write the full question.","ru":"Составьте вопрос. Напишите вопрос полностью.","uz":"Savol tuzing. To'liq savolni yozing."}},{"h":{"en":"Write a short answer. ✓ = yes, ✗ = no. Example: Has he come? (✓) → Yes, he has.","ru":"Напишите краткий ответ. ✓ = да, ✗ = нет. Например: Has he come? (✓) → Yes, he has.","uz":"Qisqa javob yozing. ✓ = ha, ✗ = yo'q. Masalan: Has he come? (✓) → Yes, he has."}},{"h":{"en":"Write for or since.","ru":"Напишите for или since.","uz":"for yoki since yozing."}},{"h":{"en":"Write just, already or yet. (just = a moment ago, already = earlier than expected, yet = until now)","ru":"Напишите just, already или yet. (just = только что, already = уже, yet = до сих пор)","uz":"just, already yoki yet yozing. (just = hozirgina, already = allaqachon, yet = hozirgacha)"}},{"h":{"en":"Write been or gone.","ru":"Напишите been или gone.","uz":"been yoki gone yozing."}},{"h":{"en":"Present Perfect or Past Simple? Write the verb in brackets in the correct tense.","ru":"Present Perfect или Past Simple? Напишите глагол из скобок в нужном времени.","uz":"Present Perfect yoki Past Simple? Qavs ichidagi fe'lni to'g'ri zamonda yozing."}},{"h":{"en":"Find the mistake and write the correct sentence.","ru":"Найдите ошибку и напишите правильное предложение.","uz":"Xatoni toping va to'g'ri gapni yozing."}},{"h":{"en":"Put the words in the correct order.","ru":"Расставьте слова в правильном порядке.","uz":"So'zlarni to'g'ri tartibga qo'ying."}}],"q":[{"e":0,"q":"I ___ finished my homework.","a":["have"],"r":"hv","ru":"Я сделал домашнее задание.","uz":"Men uy vazifamni tugatdim."},{"e":0,"q":"She ___ lost her keys.","a":["has"],"r":"hv","ru":"Она потеряла ключи.","uz":"U kalitlarini yo'qotib qo'ydi."},{"e":0,"q":"They ___ arrived at the hotel.","a":["have"],"r":"hv","ru":"Они приехали в отель.","uz":"Ular mehmonxonaga yetib kelishdi."},{"e":0,"q":"My brother ___ bought a new car.","a":["has"],"r":"hv","ru":"Мой брат купил новую машину.","uz":"Akam yangi mashina sotib oldi.","n":"My brother = he"},{"e":0,"q":"We ___ seen that film.","a":["have"],"r":"hv","ru":"Мы видели этот фильм.","uz":"Biz bu filmni ko'rganmiz."},{"e":0,"q":"It ___ stopped raining.","a":["has"],"r":"hv","ru":"Дождь перестал.","uz":"Yomg'ir to'xtadi."},{"e":0,"q":"You ___ done a good job.","a":["have"],"r":"hv","ru":"Ты хорошо поработал.","uz":"Siz yaxshi ish qildingiz."},{"e":0,"q":"The students ___ finished the test.","a":["have"],"r":"hv","ru":"Студенты закончили тест.","uz":"Talabalar testni tugatdi.","n":"The students = they"},{"e":1,"q":"go → ___","a":["gone"],"r":"irr","ru":"go — идти, ехать","uz":"go — bormoq"},{"e":1,"q":"see → ___","a":["seen"],"r":"irr","ru":"see — видеть","uz":"see — ko'rmoq"},{"e":1,"q":"eat → ___","a":["eaten"],"r":"irr","ru":"eat — есть, кушать","uz":"eat — yemoq"},{"e":1,"q":"write → ___","a":["written"],"r":"irr","ru":"write — писать","uz":"write — yozmoq"},{"e":1,"q":"take → ___","a":["taken"],"r":"irr","ru":"take — брать","uz":"take — olmoq"},{"e":1,"q":"do → ___","a":["done"],"r":"irr","ru":"do — делать","uz":"do — qilmoq"},{"e":1,"q":"be → ___","a":["been"],"r":"irr","ru":"be — быть","uz":"be — bo'lmoq"},{"e":1,"q":"buy → ___","a":["bought"],"r":"irr","ru":"buy — покупать","uz":"buy — sotib olmoq"},{"e":1,"q":"break → ___","a":["broken"],"r":"irr","ru":"break — ломать","uz":"break — sindirmoq"},{"e":1,"q":"know → ___","a":["known"],"r":"irr","ru":"know — знать","uz":"know — bilmoq"},{"e":1,"q":"speak → ___","a":["spoken"],"r":"irr","ru":"speak — говорить","uz":"speak — gapirmoq"},{"e":1,"q":"finish → ___","a":["finished"],"r":"pp","ru":"finish — заканчивать","uz":"finish — tugatmoq"},{"e":2,"q":"I ___ (see) that film.","a":["have seen"],"r":"irr","ru":"Я видел этот фильм.","uz":"Men bu filmni ko'rganman."},{"e":2,"q":"She ___ (finish) her homework.","a":["has finished"],"r":"pp","ru":"Она закончила домашнее задание.","uz":"U uy vazifasini tugatdi."},{"e":2,"q":"We ___ (live) here for ten years.","a":["have lived"],"r":"fs","ru":"Мы живём здесь десять лет.","uz":"Biz bu yerda o'n yildan beri yashaymiz."},{"e":2,"q":"He ___ (lose) his keys.","a":["has lost"],"r":"res","ru":"Он потерял ключи.","uz":"U kalitlarini yo'qotib qo'ydi."},{"e":2,"q":"They ___ (visit) Italy three times.","a":["have visited"],"r":"exp","ru":"Они бывали в Италии три раза.","uz":"Ular Italiyada uch marta bo'lgan."},{"e":2,"q":"My brother ___ (break) his arm.","a":["has broken"],"r":"irr","ru":"Мой брат сломал руку.","uz":"Akam qo'lini sindirib oldi."},{"e":2,"q":"The bus ___ (leave).","a":["has left"],"r":"res","ru":"Автобус ушёл.","uz":"Avtobus ketib qoldi."},{"e":2,"q":"Madina ___ (write) three emails today.","a":["has written"],"r":"irr","ru":"Сегодня Мадина написала три письма.","uz":"Bugun Madina uchta elektron xat yozdi."},{"e":2,"q":"I ___ (eat) Chinese food many times.","a":["have eaten"],"r":"exp","ru":"Я много раз ел китайскую еду.","uz":"Men xitoy taomini ko'p marta yeganman."},{"e":2,"q":"You ___ (do) a lot of work this week.","a":["have done"],"r":"res","ru":"На этой неделе ты сделал много работы.","uz":"Siz bu hafta ko'p ish qildingiz."},{"e":3,"q":"I have seen him.","a":["I haven't seen him.","I have not seen him."],"r":"neg","ru":"Я его не видел.","uz":"Men uni ko'rmaganman."},{"e":3,"q":"She has finished.","a":["She hasn't finished.","She has n
