</div><script src="app.js"></script><script>window.GD_QUIZ={"id":"past-simple","rules":{"ed":{"en":"Regular verbs: add <b>-ed</b> to the verb: play → played, work → worked, visit → visited. The form is the same for all people.","ru":"Правильные глаголы: добавьте <b>-ed</b>: play → played, work → worked, visit → visited. Форма одинакова для всех лиц.","uz":"Muntazam fe'llar: fe'lga <b>-ed</b> qo'shing: play → played, work → worked, visit → visited. Shakl hamma shaxslar uchun bir xil."},"d":{"en":"Verb ends in <b>-e</b>: add only <b>-d</b>: like → liked, live → lived, dance → danced.","ru":"Глагол оканчивается на <b>-e</b>: добавьте только <b>-d</b>: like → liked, live → lived, dance → danced.","uz":"Fe'l <b>-e</b> bilan tugasa: faqat <b>-d</b> qo'shing: like → liked, live → lived, dance → danced."},"ied":{"en":"Consonant + <b>y</b>: y → <b>ied</b>: study → studied, cry → cried, carry → carried. (Vowel + y: just add -ed: play → played, enjoy → enjoyed.)","ru":"Согласная + <b>y</b>: y → <b>ied</b>: study → studied, cry → cried, carry → carried. (Гласная + y: просто -ed: play → played, enjoy → enjoyed.)","uz":"Undosh + <b>y</b>: y → <b>ied</b>: study → studied, cry → cried, carry → carried. (Unli + y: shunchaki -ed: play → played, enjoy → enjoyed.)"},"dbl":{"en":"One short vowel + one consonant: <b>double the consonant</b> and add -ed: stop → stopped, plan → planned.","ru":"Одна короткая гласная + одна согласная: <b>удвойте согласную</b> и добавьте -ed: stop → stopped, plan → planned.","uz":"Bitta qisqa unli + bitta undosh: <b>undoshni ikkilantirib</b> -ed qo'shing: stop → stopped, plan → planned."},"irr":{"en":"<b>Irregular verbs</b> have their own past form. You must learn them: go → went, have → had, see → saw, buy → bought, eat → ate.","ru":"У <b>неправильных глаголов</b> своя форма прошедшего времени. Их нужно выучить: go → went, have → had, see → saw, buy → bought, eat → ate.","uz":"<b>Noto'g'ri fe'llar</b>ning o'z o'tgan zamon shakli bor. Ularni yodlash kerak: go → went, have → had, see → saw, buy → bought, eat → ate."},"didnt":{"en":"Negative: <b>didn't + base verb</b> (the verb does not change): She <b>didn't go</b>. (not She didn't went.)","ru":"Отрицание: <b>didn't + начальная форма глагола</b> (глагол не меняется): She <b>didn't go</b>. (не She didn't went.)","uz":"Inkor: <b>didn't + fe'lning asosiy shakli</b> (fe'l o'zgarmaydi): She <b>didn't go</b>. (She didn't went emas.)"},"q":{"en":"Question: <b>Did + subject + base verb?</b> Did you watch TV? (not Did you watched?)","ru":"Вопрос: <b>Did + подлежащее + начальная форма глагола?</b> Did you watch TV? (не Did you watched?)","uz":"So'roq: <b>Did + ega + fe'lning asosiy shakli?</b> Did you watch TV? (Did you watched emas.)"},"sa":{"en":"Short answers: Yes, I <b>did</b>. / No, I <b>didn't</b>. Do not repeat the verb.","ru":"Краткие ответы: Yes, I <b>did</b>. / No, I <b>didn't</b>. Глагол не повторяйте.","uz":"Qisqa javoblar: Yes, I <b>did</b>. / No, I <b>didn't</b>. Fe'lni takrorlamang."},"wh":{"en":"Question word first: <b>What / Where / When / Why + did + subject + base verb?</b> Where did you go?","ru":"Сначала вопросительное слово: <b>What / Where / When / Why + did + подлежащее + начальная форма?</b> Where did you go?","uz":"Avval so'roq so'z: <b>What / Where / When / Why + did + ega + fe'lning asosiy shakli?</b> Where did you go?"},"base":{"en":"After <b>did / didn't</b> the verb is always in the <b>base form</b>: Did she <b>go</b>? She didn't <b>go</b>.","ru":"После <b>did / didn't</b> глагол всегда в <b>начальной форме</b>: Did she <b>go</b>? She didn't <b>go</b>.","uz":"<b>did / didn't</b> dan keyin fe'l doim <b>asosiy shaklda</b> bo'ladi: Did she <b>go</b>? She didn't <b>go</b>."},"was":{"en":"The past of <b>be</b>: <b>was</b> (I / he / she / it) and <b>were</b> (you / we / they). Negative: wasn't / weren't. Question: Was he...? Were you...? (No did!)","ru":"Прошедшее от <b>be</b>: <b>was</b> (I / he / she / it) и <b>were</b> (you / we / they). Отрицание: wasn't / weren't. Вопрос: Was he...? Were you...? (Без did!)","uz":"<b>be</b> ning o'tgan zamoni: <b>was</b> (I / he / she / it) va <b>were</b> (you / we / they). Inkor: wasn't / weren't. So'roq: Was he...? Were you...? (did kerak emas!)"},"time":{"en":"Past time words: <b>yesterday, last week / year, two days ago, in 2020, on Monday, when I was young</b>. Use <b>ago</b> after the time: three years ago.","ru":"Слова прошедшего времени: <b>yesterday, last week / year, two days ago, in 2020, on Monday, when I was young</b>. <b>ago</b> ставится после времени: three years ago.","uz":"O'tgan zamon so'zlari: <b>yesterday, last week / year, two days ago, in 2020, on Monday, when I was young</b>. <b>ago</b> vaqtdan keyin keladi: three years ago."},"order":{"en":"Word order: <b>subject + verb (past) + object + place / time</b>. Question: <b>(question word) + did + subject + verb?</b>","ru":"Порядок слов: <b>подлежащее + глагол (прош.) + дополнение + место / время</b>. Вопрос: <b>(вопросительное слово) + did + подлежащее + глагол?</b>","uz":"So'zlar tartibi: <b>ega + fe'l (o'tgan) + to'ldiruvchi + joy / vaqt</b>. So'roq: <b>(so'roq so'z) + did + ega + fe'l?</b>"}},"ex":[{"h":{"en":"Write the Past Simple of the regular verb. Example: play → played.","ru":"Напишите Past Simple правильного глагола. Например: play → played.","uz":"Muntazam fe'lning Past Simple shaklini yozing. Masalan: play → played."}},{"h":{"en":"Write the Past Simple of the irregular verb. Example: go → went.","ru":"Напишите Past Simple неправильного глагола. Например: go → went.","uz":"Noto'g'ri fe'lning Past Simple shaklini yozing. Masalan: go → went."}},{"h":{"en":"Write the verb in brackets in the Past Simple.","ru":"Напишите глагол из скобок в Past Simple.","uz":"Qavs ichidagi fe'lni Past Simple da yozing."}},{"h":{"en":"Make the sentence negative. Write the full sentence.","ru":"Сделайте предложение отрицательным. Напишите его полностью.","uz":"Gapni inkor qiling. To'liq gapni yozing."}},{"h":{"en":"Make a question. Write the full question.","ru":"Составьте вопрос. Напишите вопрос полностью.","uz":"Savol tuzing. To'liq savolni yozing."}},{"h":{"en":"Write a short answer. ✓ = yes, ✗ = no. Example: Did he come? (✓) → Yes, he did.","ru":"Напишите краткий ответ. ✓ = да, ✗ = нет. Например: Did he come? (✓) → Yes, he did.","uz":"Qisqa javob yozing. ✓ = ha, ✗ = yo'q. Masalan: Did he come? (✓) → Yes, he did."}},{"h":{"en":"Questions with a question word. Write the missing word or the full question.","ru":"Вопросы с вопросительным словом. Напишите пропущенное слово или весь вопрос.","uz":"So'roq so'zli savollar. Tushib qolgan so'zni yoki to'liq savolni yozing."}},{"h":{"en":"Write the verb in brackets in the correct form (after did / didn't the verb stays the same).","ru":"Напишите глагол из скобок в нужной форме (после did / didn't глагол не меняется).","uz":"Qavs ichidagi fe'lni to'g'ri shaklda yozing (did / didn't dan keyin fe'l o'zgarmaydi)."}},{"h":{"en":"Write was or were.","ru":"Напишите was или were.","uz":"was yoki were yozing."}},{"h":{"en":"Write the missing time word: ago, last, yesterday, in or on.","ru":"Напишите пропущенное слово времени: ago, last, yesterday, in или on.","uz":"Tushib qolgan vaqt so'zini yozing: ago, last, yesterday, in yoki on."}},{"h":{"en":"Find the mistake and write the correct sentence.","ru":"Найдите ошибку и напишите правильное предложение.","uz":"Xatoni toping va to'g'ri gapni yozing."}},{"h":{"en":"Put the words in the correct order.","ru":"Расставьте слова в правильном порядке.","uz":"So'zlarni to'g'ri tartibga qo'ying."}}],"q":[{"e":0,"q":"play → ___","a":["played"],"r":"ed","ru":"play — играть","uz":"play — o'ynamoq"},{"e":0,"q":"work → ___","a":["worked"],"r":"ed","ru":"work — работать","uz":"work — ishlamoq"},{"e":0,"q":"visit → ___","a":["visited"],"r":"ed","ru":"visit — посещать","uz":"visit — tashrif buyurmoq"},{"e":0,"q":"like → ___","a":["liked"],"r":"d","ru":"like — нравиться","uz":"like — yoqtirmoq"},{"e":0,"q":"live → ___","a":["lived"],"r":"d","ru":"live — жить","uz":"live — yashamoq"},{"e":0,"q":"dance → ___","a":["danced"],"r":"d","ru":"dance — танцевать","uz":"dance — raqsga tushmoq"},{"e":0,"q":"study → ___","a":["studied"],"r":"ied","ru":"study — учиться","uz":"study — o'qimoq, o'rganmoq"},{"e":0,"q":"cry → ___","a":["cried"],"r":"ied","ru":"cry — плакать","uz":"cry — yig'lamoq"},{"e":0,"q":"enjoy → ___","a":["enjoyed"],"r":"ed","ru":"enjoy — наслаждаться","uz":"enjoy — zavqlanmoq","n":"enjoy ends in vowel + y, so just add -ed."},{"e":0,"q":"stop → ___","a":["stopped"],"r":"dbl","ru":"stop — останавливаться","uz":"stop — to'xtamoq"},{"e":0,"q":"plan → ___","a":["planned"],"r":"dbl","ru":"plan — планировать","uz":"plan — rejalashtirmoq"},{"e":0,"q":"open → ___","a":["opened"],"r":"ed","ru":"open — открывать","uz":"open — ochmoq"},{"e":1,"q":"go → ___","a":["went"],"r":"irr","ru":"go — идти, ехать","uz":"go — bormoq"},{"e":1,"q":"have → ___","a":["had"],"r":"irr","ru":"have — иметь","uz":"have — ega bo'lmoq"},{"e":1,"q":"see → ___","a":["saw"],"r":"irr","ru":"see — видеть","uz":"see — ko'rmoq"},{"e":1,"q":"buy → ___","a":["bought"],"r":"irr","ru":"buy — покупать","uz":"buy — sotib olmoq"},{"e":1,"q":"eat → ___","a":["ate"],"r":"irr","ru":"eat — есть, кушать","uz":"eat — yemoq"},{"e":1,"q":"take → ___","a":["took"],"r":"irr","ru":"take — брать","uz":"take — olmoq"},{"e":1,"q":"make → ___","a":["made"],"r":"irr","ru":"make — делать","uz":"make — qilmoq, yasamoq"},{"e":1,"q":"come → ___","a":["came"],"r":"irr","ru":"come — приходить","uz":"come — kelmoq"},{"e":1,"q":"write → ___","a":["wrote"],"r":"irr","ru":"write — писать","uz":"write — yozmoq"},{"e":1,"q":"drink → ___","a":["drank"],"r":"irr","ru":"drink — пить","uz":"drink — ichmoq"},{"e":1,"q":"get → ___","a":["got"],"r":"irr","ru":"get — получать","uz":"get — olmoq"},{"e":1,"q":"speak → ___","a":["spoke"],"r":"irr","ru":"speak — говорить","uz":"speak — gapirmoq"},{"e":2,"q":"I ___ (watch) a film yesterday.","a":["watched"],"r":"ed","ru":"Вчера я смотрел фильм.","uz":"Kecha men film ko'rdim."},{"e":2,"q":"She ___ (visit) her aunt last week.","a":["visited"],"r":"ed","ru":"На прошлой неделе она навестила тётю.","uz":"O'tgan hafta u xolasinikiga bordi."},{"e":2,"q":"We ___ (go) to the park on Sunday.","a":["went"],"r":"irr","ru":"В воскресенье мы ходили в парк.","uz":"Yakshanba kuni biz parkka bordik."},{"e":2,"q":"He ___ (buy) a new phone two days ago.","a":["bought"],"r":"irr","ru":"Два дня назад он купил новый телефон.","uz":"U ikki kun oldin yangi telefon sotib oldi."},{"e":2,"q":"They ___ (study) for the exam last night.","a":["studied"],"r":"ied","ru":"Вчера вечером они готовились к экзамену.","uz":"Kecha kechqurun ular imtihonga tayyorlanishdi."},{"e":2,"q":"I ___ (get) up at 7 o'clock this morning.","a":["got"],"r":"irr","ru":"Сегодня утром я встал в 7 часов.","uz":"Bugun ertalab men soat 7 da turdim."},{"e":2,"q":"My mother ___ (make) a big cake for my birthday.","a":["made"],"r":"irr","ru":"Мама испекла большой торт на мой день рождения.","uz":"Onam tug'ilgan kunimga katta tort pishirdi."},{"e":2,"q":"The bus ___ (stop) in front of the school.","a":["stopped"],"r":"dbl","ru":"Автобус остановился перед школой.","uz":"Avtobus maktab oldida to'xtadi."},{"e":2,"q":"Our teacher ___ (write) a long email yesterday.","a":["wrote"],"r":"irr","ru":"Вчера наш учитель написал длинное письмо.","uz":"Kecha o'qituvchimiz uzun xat yozdi."},{"e":2,"q":"We ___ (live) in Samarkand in 2015.","a":["lived"],"r":"d","ru":"В 2015 году мы жили в Самарканде.","uz":"2015-yilda biz Samarqandda yashadik."},{"e":3,"q":"I watched TV last night.","a":["I didn't watch TV last night."],"r":"didnt","ru":"Вчера вечером я не смотрел телевизор.","uz":"Kecha kechqurun men televizor ko'rmadim."},{"e":3,"q":"She went to school yesterday.","a":["She didn't go to school yesterday."],"r":"didnt","ru":"Вчера она не ходила в школу.","uz":"Kecha u maktabga bormadi."},{"e":3,"q":"They played football on Saturday.","a":["They didn
