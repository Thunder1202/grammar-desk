</div><script src="app.js"></script><script>window.GD_QUIZ={"id":"present-perfect-continuous","rules":{"f":{"en":"Form: <b>have / has + been + verb-ing</b>. I <b>have been</b> working. She <b>has been</b> working. Short forms: I've been, she's been.","ru":"Форма: <b>have / has + been + глагол-ing</b>. I <b>have been</b> working. She <b>has been</b> working. Краткие формы: I've been, she's been.","uz":"Shakli: <b>have / has + been + fe'l-ing</b>. I <b>have been</b> working. She <b>has been</b> working. Qisqa shakllar: I've been, she's been."},"ing":{"en":"Spelling of -ing: make → making, run → running, lie → lying, study → studying.","ru":"Правописание -ing: make → making, run → running, lie → lying, study → studying.","uz":"-ing imlosi: make → making, run → running, lie → lying, study → studying."},"dur":{"en":"<b>Duration up to now</b>: an action started in the past and is still going on (or has just stopped). We stress <b>how long</b>: I <b>have been learning</b> English for three years.","ru":"<b>Длительность до настоящего момента</b>: действие началось в прошлом и продолжается (или только что закончилось). Важно <b>как долго</b>: I <b>have been learning</b> English for three years.","uz":"<b>Hozirgacha davomiylik</b>: ish o'tmishda boshlangan va davom etmoqda (yoki hozirgina tugagan). Muhimi — <b>qancha vaqt</b>: I <b>have been learning</b> English for three years."},"fs":{"en":"<b>for</b> + a period (for two hours, for a year). <b>since</b> + a starting point (since 8 o'clock, since Monday, since I arrived). <b>How long...?</b> asks about the duration.","ru":"<b>for</b> + период (for two hours, for a year). <b>since</b> + точка начала (since 8 o'clock, since Monday, since I arrived). <b>How long...?</b> спрашивает о длительности.","uz":"<b>for</b> + davr (for two hours, for a year). <b>since</b> + boshlanish nuqtasi (since 8 o'clock, since Monday, since I arrived). <b>How long...?</b> davomiylikni so'raydi."},"vis":{"en":"<b>Recent activity with a visible result</b>: you can see or feel the result now. You look tired. <b>Have you been running?</b> The grass is wet. It <b>has been raining</b>.","ru":"<b>Недавнее действие с видимым результатом</b>: результат виден сейчас. You look tired. <b>Have you been running?</b> The grass is wet. It <b>has been raining</b>.","uz":"<b>Yaqinda bo'lgan, natijasi ko'rinib turgan ish</b>: natija hozir ko'rinadi. You look tired. <b>Have you been running?</b> The grass is wet. It <b>has been raining</b>."},"neg":{"en":"Negative: <b>haven't / hasn't + been + verb-ing</b>: I <b>haven't been</b> sleeping well. She <b>hasn't been</b> working.","ru":"Отрицание: <b>haven't / hasn't + been + глагол-ing</b>: I <b>haven't been</b> sleeping well. She <b>hasn't been</b> working.","uz":"Inkor: <b>haven't / hasn't + been + fe'l-ing</b>: I <b>haven't been</b> sleeping well. She <b>hasn't been</b> working."},"q":{"en":"Question: <b>Have / Has + subject + been + verb-ing?</b> Have you been waiting long? Has she been working?","ru":"Вопрос: <b>Have / Has + подлежащее + been + глагол-ing?</b> Have you been waiting long? Has she been working?","uz":"So'roq: <b>Have / Has + ega + been + fe'l-ing?</b> Have you been waiting long? Has she been working?"},"sa":{"en":"Short answers use <b>have / has</b>: Yes, I <b>have</b>. / No, she <b>hasn't</b>. Do not repeat been + verb-ing.","ru":"Краткие ответы с <b>have / has</b>: Yes, I <b>have</b>. / No, she <b>hasn't</b>. been + глагол-ing не повторяйте.","uz":"Qisqa javoblar <b>have / has</b> bilan: Yes, I <b>have</b>. / No, she <b>hasn't</b>. been + fe'l-ing ni takrorlamang."},"hl":{"en":"Question: <b>How long + have / has + subject + been + verb-ing?</b> How long have you been living here?","ru":"Вопрос: <b>How long + have / has + подлежащее + been + глагол-ing?</b> How long have you been living here?","uz":"So'roq: <b>How long + have / has + ega + been + fe'l-ing?</b> How long have you been living here?"},"pp":{"en":"<b>Continuous</b> = the activity and how long (I've been reading all day). <b>Simple</b> = the result, how many / how much, finished (I've read three books).","ru":"<b>Continuous</b> = сам процесс и его длительность (I've been reading all day). <b>Simple</b> = результат, сколько, завершено (I've read three books).","uz":"<b>Continuous</b> = jarayon va uning davomiyligi (I've been reading all day). <b>Simple</b> = natija, nechta / qancha, tugagan (I've read three books)."},"state":{"en":"<b>State verbs</b> (know, like, love, want, need, believe, have = own) do not take the continuous: I <b>have known</b> him for years (not have been knowing).","ru":"<b>Глаголы состояния</b> (know, like, love, want, need, believe, have = владеть) не используются в continuous: I <b>have known</b> him for years (не have been knowing).","uz":"<b>Holat fe'llari</b> (know, like, love, want, need, believe, have = ega bo'lmoq) continuous da ishlatilmaydi: I <b>have known</b> him for years (have been knowing emas)."},"ps":{"en":"Finished time (yesterday, last week, in 2019) = <b>Past Simple</b>: I worked there in 2019. Up to now = Present Perfect Continuous: I <b>have been working</b> here since 2019.","ru":"Законченное время (yesterday, last week, in 2019) = <b>Past Simple</b>: I worked there in 2019. До настоящего момента = Present Perfect Continuous: I <b>have been working</b> here since 2019.","uz":"Tugagan vaqt (yesterday, last week, in 2019) = <b>Past Simple</b>: I worked there in 2019. Hozirgacha = Present Perfect Continuous: I <b>have been working</b> here since 2019."},"order":{"en":"Word order: <b>subject + have / has + been + verb-ing + the rest</b>. Questions: <b>(How long) + have / has + subject + been + verb-ing?</b>","ru":"Порядок слов: <b>подлежащее + have / has + been + глагол-ing + остальное</b>. Вопросы: <b>(How long) + have / has + подлежащее + been + глагол-ing?</b>","uz":"So'zlar tartibi: <b>ega + have / has + been + fe'l-ing + qolgani</b>. So'roq: <b>(How long) + have / has + ega + been + fe'l-ing?</b>"}},"ex":[{"h":{"en":"Write have or has.","ru":"Напишите have или has.","uz":"have yoki has yozing."}},{"h":{"en":"Write the verb in brackets in the Present Perfect Continuous. Write all words, for example: has been working.","ru":"Напишите глагол из скобок в Present Perfect Continuous. Пишите все слова, например: has been working.","uz":"Qavs ichidagi fe'lni Present Perfect Continuous da yozing. Hamma so'zlarni yozing, masalan: has been working."}},{"h":{"en":"Make the sentence negative. Write the full sentence.","ru":"Сделайте предложение отрицательным. Напишите его полностью.","uz":"Gapni inkor qiling. To'liq gapni yozing."}},{"h":{"en":"Make a question with How long. Write the full question.","ru":"Составьте вопрос с How long. Напишите вопрос полностью.","uz":"How long bilan savol tuzing. To'liq savolni yozing."}},{"h":{"en":"Write a short answer. ✓ = yes, ✗ = no. Example: Has he been working? (✓) → Yes, he has.","ru":"Напишите краткий ответ. ✓ = да, ✗ = нет. Например: Has he been working? (✓) → Yes, he has.","uz":"Qisqa javob yozing. ✓ = ha, ✗ = yo'q. Masalan: Has he been working? (✓) → Yes, he has."}},{"h":{"en":"Write for or since.","ru":"Напишите for или since.","uz":"for yoki since yozing."}},{"h":{"en":"Present Perfect or Present Perfect Continuous? Continuous = the activity and how long. Simple = the result and how many.","ru":"Present Perfect или Present Perfect Continuous? Continuous = процесс и длительность. Simple = результат и количество.","uz":"Present Perfect yoki Present Perfect Continuous? Continuous = jarayon va davomiylik. Simple = natija va miqdor."}},{"h":{"en":"Why? Look at the result. Write the verb in brackets in the Present Perfect Continuous.","ru":"Почему? Посмотрите на результат. Напишите глагол из скобок в Present Perfect Continuous.","uz":"Nega? Natijaga qarang. Qavs ichidagi fe'lni Present Perfect Continuous da yozing."}},{"h":{"en":"Up to now or finished? Write the verb in brackets: Present Perfect Continuous or Past Simple.","ru":"До сих пор или закончено? Напишите глагол: Present Perfect Continuous или Past Simple.","uz":"Hozirgacha yoki tugagan? Fe'lni yozing: Present Perfect Continuous yoki Past Simple."}},{"h":{"en":"Find the mistake and write the correct sentence.","ru":"Найдите ошибку и напишите правильное предложение.","uz":"Xatoni toping va to'g'ri gapni yozing."}},{"h":{"en":"Put the words in the correct order.","ru":"Расставьте слова в правильном порядке.","uz":"So'zlarni to'g'ri tartibga qo'ying."}}],"q":[{"e":0,"q":"I ___ been waiting for an hour.","a":["have"],"r":"f","ru":"Я жду уже час.","uz":"Men bir soatdan beri kutyapman."},{"e":0,"q":"She ___ been working here since 2020.","a":["has"],"r":"f","ru":"Она работает здесь с 2020 года.","uz":"U bu yerda 2020-yildan beri ishlaydi."},{"e":0,"q":"They ___ been playing football all morning.","a":["have"],"r":"f","ru":"Они играют в футбол всё утро.","uz":"Ular butun ertalab futbol o'ynayapti."},{"e":0,"q":"It ___ been raining since lunch.","a":["has"],"r":"f","ru":"Дождь идёт с обеда.","uz":"Tushlikdan beri yomg'ir yog'yapti."},{"e":0,"q":"We ___ been living in Tashkent for ten years.","a":["have"],"r":"f","ru":"Мы живём в Ташкенте десять лет.","uz":"Biz Toshkentda o'n yildan beri yashaymiz."},{"e":0,"q":"My brother ___ been learning to drive.","a":["has"],"r":"f","ru":"Мой брат учится водить.","uz":"Akam mashina haydashni o'rganyapti.","n":"My brother = he"},{"e":1,"q":"She ___ (study) for three hours.","a":["has been studying"],"r":"dur","ru":"Она занимается уже три часа.","uz":"U uch soatdan beri o'qiyapti."},{"e":1,"q":"I ___ (learn) English since 2022.","a":["have been learning"],"r":"dur","ru":"Я учу английский с 2022 года.","uz":"Men 2022-yildan beri ingliz tilini o'rganyapman."},{"e":1,"q":"They ___ (wait) for the bus for twenty minutes.","a":["have been waiting"],"r":"dur","ru":"Они ждут автобус двадцать минут.","uz":"Ular yigirma daqiqadan beri avtobusni kutyapti."},{"e":1,"q":"He ___ (run) in the park all morning.","a":["has been running"],"r":"ing","ru":"Он бегает в парке всё утро.","uz":"U butun ertalab parkda yugurayapti."},{"e":1,"q":"We ___ (write) emails since 9 o'clock.","a":["have been writing"],"r":"ing","ru":"Мы пишем письма с 9 часов.","uz":"Biz soat 9 dan beri xat yozyapmiz."},{"e":1,"q":"You ___ (sit) here for too long.","a":["have been sitting"],"r":"ing","ru":"Ты сидишь здесь слишком долго.","uz":"Siz bu yerda juda uzoq o'tiribsiz."},{"e":1,"q":"The children ___ (play) outside since lunch.","a":["have been playing"],"r":"dur","ru":"Дети играют на улице с обеда.","uz":"Bolalar tushlikdan beri tashqarida o'ynayapti."},{"e":1,"q":"My mother ___ (cook) all day.","a":["has been cooking"],"r":"dur","ru":"Мама готовит весь день.","uz":"Onam kun bo'yi ovqat pishiryapti."},{"e":1,"q":"It ___ (snow) since last night.","a":["has been snowing"],"r":"dur","ru":"Снег идёт со вчерашнего вечера.","uz":"Kecha kechqurundan beri qor yog'yapti."},{"e":1,"q":"I ___ (try) to call you all day.","a":["have been trying"],"r":"dur","ru":"Я весь день пытаюсь тебе дозвониться.","uz":"Men kun bo'yi sizga qo'ng'iroq qilishga urinyapman."},{"e":2,"q":"I have been sleeping well.","a":["I haven't been sleeping well.","I have not been sleeping well."],"r":"neg","ru":"Я плохо сплю.","uz":"Men yaxshi uxlamayapman."},{"e":2,"q":"She has been working hard.","a":["She hasn't been working hard.","She has not been working hard."],"r":"neg","ru":"Она не работает усердно.","uz":"U qattiq ishlamayapti."},{"e":2,"q":"They have been studying.","a":["They haven't been studying.","They have not been studying."],"r":"neg","ru":"Они не занимаются.","uz":"Ular o'qimayapti."},{"e":2,"q":"He has been feeling well.","a":["He hasn't been feeling well.","He has not been feeling well."],"r":"neg","ru":"Он неважно себя чувствует.","uz":"U o'zini yaxshi his qilmayapti."},{"e":2,"q":"We have been waiting long.","a":["We haven't been waiting long.","We have not been waiting long."],"r":"neg","ru":"Мы ждём недолго.","uz":"Biz uzoq kutmadik."},{"e":2,"q":"It has been raining.","a":["It hasn't been raining.","It has not been raining."],"r":"neg","ru":"Дождя не было.","uz":"Yomg'ir yog'mayapti."},{"e":3,"q":"you / learn / English","a":["How long have you been learning English?"],"r":"hl","ru":"Как долго ты учишь английский?","uz":"Siz ingliz tilini qancha vaqtdan beri o'rganyapsiz?"},{"e":3,"q":"she / work / here","a":["How long has she been working here?"],"r":"hl","ru":"Как долго она здесь работает?","uz":"U bu yerda qancha vaqtdan beri ishlaydi?"},{"e":3,"q":"they / wait","a":["How long have they been waiting?"],"r":"hl","ru":"Как долго они ждут?","uz":"Ular qancha vaqtdan beri kutyapti?"},{"e":3,"q":"it / rain","a":["How long has it been raining?"],"r":"hl","ru":"Как долго идёт дождь?","uz":"Yomg'ir qancha vaqtdan beri yog'yapti?"},{"e":3,"q":"he / drive","a":["How long has he been driving?"],"r":"hl","ru":"Как долго он за рулём?","uz":"U qancha vaqtdan beri mashina haydayapti?"},{"e":3,"q":"you / live / in this city","a":["How long have you been living in this city?"],"r":"hl","ru":"Как долго ты живёшь в этом городе?","uz":"Siz bu shaharda qancha vaqtdan beri yashayapsiz?"},{"e":3,"q":"your brother / play / the guitar","a":["How long has your brother been playing the guitar?"],"r":"hl","ru":"Как долго твой брат играет на гитаре?","uz":"Akangiz qancha vaqtdan beri gitara chalyapti?"},{"e":3,"q":"the children / sleep","a":["How long have the children been sleeping?"],"r":"hl","ru":"Как долго спят дети?","uz":"Bolalar qancha vaqtdan beri uxlayapti?"},{"e":4,"q":"Have you been waiting long? (✓)","a":["Yes, I have."],"r":"sa","ru":"Ты давно ждёшь? Да.","uz":"Anchadan beri kutyapsizmi? Ha."},{"e":4,"q":"Has she been working? (✗)","a":["No, she hasn't.","No, she has not."],"r":"sa","ru":"Она работала? Нет.","uz":"U ishlayaptimi? Yo'q."},{"e":4,"q":"Have they been studying? (✓)","a":["Yes, they have."],"r":"sa","ru":"Они занимались? Да.","uz":"Ular o'qiyaptimi? Ha."},{"e":4,"q":"Has it been raining? (✗)","a":["No, it hasn't.","No, it has not."],"r":"sa","ru":"Шёл дождь? Нет.","uz":"Yomg'ir yog'ayaptimi? Yo'q."},{"e":5,"q":"I have been working here ___ 2018.","a":["since"],"r":"fs","ru":"Я работаю здесь с 2018 года.","uz":"Men bu yerda 2018-yildan beri ishlayman."},{"e":5,"q":"She has been studying ___ three hours.","a":["for"],"r":"fs","ru":"Она занимается три часа.","uz":"U uch soatdan beri o'qiyapti."},{"e":5,"q":"They have been living here ___ ten years.","a":["for"],"r":"fs","ru":"Они живут здесь десять лет.","uz":"Ular bu yerda o'n yildan beri yashaydi."},{"e":5,"q":"He has been waiting ___ 8 o'clock.","a":["since"],"r":"fs","ru":"Он ждёт с 8 часов.","uz":"U soat 8 dan beri kutyapti."},{"e":5,"q":"We have been friends ___ a long time.","a":["for"],"r":"fs","ru":"Мы давно дружим.","uz":"Biz uzoq vaqtdan beri do'stmiz."},{"e":5,"q":"It has been snowing ___ Monday.","a":["since"],"r":"fs","ru":"Снег идёт с понедельника.","uz":"Dushanbadan beri qor yog'yapti."},{"e":5,"q":"I have been learning to swim ___ I was ten.","a":["since"],"r":"fs","ru":"Я учусь плавать с десяти лет.","uz":"Men o'n yoshimdan beri suzishni o'rganyapman."},{"e":5,"q":"She has been ill ___ two weeks.","a":["for"],"r":"fs","ru":"Она болеет две недели.","uz":"U ikki haftadan beri kasal."},{"e":6,"q":"I ___ (read) this book for two weeks.","a":["have been reading"],"r":"pp","ru":"Я читаю эту книгу две недели.","uz":"Men bu kitobni ikki haftadan beri o'qiyapman."},{"e":6,"q":"I ___ (read) three books this month.","a":["have read"],"r":"pp","ru":"В этом месяце я прочитал три книги.","uz":"Bu oy men uchta kitob o'qidim."},{"e":6,"q":"She ___ (finish) her homework. She can watch TV now.","a":["has finished"],"r":"pp","ru":"Она закончила домашнее задание. Теперь можно смотреть телевизор.","uz":"U uy vazifasini tugatdi. Endi televizor ko'rishi mumkin."},{"e":6,"q":"He ___ (write) emails all morning.","a":["has been writing"],"r":"pp","ru":"Он пишет письма всё утро.","uz":"U butun ertalab xat yozyapti."},{"e":6,"q":"They ___ (build) the house for six months.","a":["have been building"],"r":"pp","ru":"Они строят дом шесть месяцев.","uz":"Ular uyni olti oydan beri qurishyapti."},{"e":6,"q":"I ___ (write) ten pages today.","a":["have written"],"r":"pp","ru":"Сегодня я написал десять страниц.","uz":"Bugun men o'n bet yozdim."},{"e":6,"q":"I ___ (send) five emails this morning.","a":["have sent"],"r":"pp","ru":"Сегодня утром я отправил пять писем.","uz":"Bugun ertalab men beshta xat yubordim."},{"e":6,"q":"She ___ (paint) the kitchen. It looks great now!","a":["has painted"],"r":"pp","ru":"Она покрасила кухню. Теперь она выглядит отлично!","uz":"U oshxonani bo'yadi. Endi u juda chiroyli ko'rinadi!"},{"e":6,"q":"We ___ (drive) for five hours. Let's stop.","a":["have been driving"],"r":"pp","ru":"Мы едем пять часов. Давай остановимся.","uz":"Biz besh soatdan beri haydayapmiz. Keling, to'xtaylik."},{"e":6,"q":"I ___ (know) him for ten years.","a":["have known"],"r":"state","ru":"Я знаю его десять лет.","uz":"Men uni o'n yildan beri bilaman."},{"e":7,"q":"Why are your hands dirty? — I ___ (work) in the garden.","a":["have been working"],"r":"vis","ru":"Почему у тебя грязные руки? — Я работал в саду.","uz":"Nega qo'llaringiz iflos? — Men bog'da ishlagan edim."},{"e":7,"q":"You look tired. ___ you been running?","a":["Have"],"r":"vis","ru":"Ты выглядишь усталым. Ты бегал?","uz":"Charchagan ko'rinasiz. Yugurdingizmi?"},{"e":7,"q":"The grass is wet. It ___ (rain).","a":["has been raining"],"r":"vis","ru":"Трава мокрая. Шёл дождь.","uz":"O't nam. Yomg'ir yog'ib turgan edi."},{"e":7,"q":"Her eyes are red. She ___ (cry).","a":["has been crying"],"r":"vis","ru":"У неё красные глаза. Она плакала.","uz":"Uning ko'zlari qizargan. U yig'lagan."},{"e":7,"q":"The kitchen smells good. Mum ___ (bake).","a":["has been baking"],"r":"vis","ru":"На кухне вкусно пахнет. Мама пекла.","uz":"Oshxonadan yaxshi hid kelyapti. Onam non yopgan."},{"e":7,"q":"He is out of breath. He ___ (climb) the stairs.","a":[
