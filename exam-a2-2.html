</div><script src="app.js"></script><script>window.GD_EXAM={"id":"a2-2","level":"a2.html","lvl":"A2","topics":{"object-pronouns":"Object pronouns","modals-must-have-to-should":"Modals: must, have to, should","too-enough-too-much-many":"Too, enough, too much / many","question-tags":"Question tags","infinitive-vs-gerund":"Infinitive vs gerund","indefinite-pronouns":"Indefinite pronouns"},"next":{"u":"adjectives-and-adverbs.html","t":"Adjectives and adverbs","k":"nxt"},"q":[{"s":"object-pronouns","q":"I know ___. She is my teacher.","o":["she","her","hers"],"a":1,"w":[["She is the subject form. After a verb we need an object.","She — форма подлежащего, а после глагола нужен объект.","She ega shakli, fe'ldan keyin esa obyekt kerak."],["After know we use the object form: her.","После know нужна объектная форма: her.","Know dan keyin obyekt shakli keladi: her."],["Hers means something that belongs to her.","Hers значит «её вещь».","Hers uning narsasi degan ma'noni bildiradi."]]},{"s":"object-pronouns","q":"Please help ___. We are lost.","o":["we","our","us"],"a":2,"w":[["We is the subject form.","We — форма подлежащего.","We ega shakli."],["Our needs a noun after it.","После our нужно существительное.","Our dan keyin ot kerak."],["After help we need the object form: us.","После help нужна объектная форма: us.","Help dan keyin obyekt shakli keladi: us."]]},{"s":"modals-must-have-to-should","q":"You ___ eat more fruit. It's good for you.","o":["should","should to","shoulds"],"a":0,"w":[["Should gives advice.","Should — это совет.","Should maslahat beradi."],["There is no to after should.","После should нет to.","Should dan keyin to kelmaydi."],["Should never takes -s.","Should никогда не получает -s.","Should hech qachon -s olmaydi."]]},{"s":"modals-must-have-to-should","q":"She ___ wear a uniform at work. It is the rule.","o":["have to","has to","must to"],"a":1,"w":[["Have to changes to has to with she.","С she have to меняется на has to.","She bilan have to has to ga aylanadi."],["She + has to: a rule she must follow.","She + has to: правило, которому она следует.","She + has to: u bajarishi kerak bo'lgan qoida."],["There is no to after must.","После must нет to.","Must dan keyin to kelmaydi."]]},{"s":"too-enough-too-much-many","q":"This coffee is ___ hot. I can't drink it.","o":["too","too much","enough"],"a":0,"w":[["Too + adjective means more than is good.","Too + прилагательное — больше, чем нужно.","Too + sifat: keragidan ortiq degani."],["Too much goes with a noun we cannot count, not an adjective.","Too much идёт с неисчисляемым существительным, а не с прилагательным.","Too much sanalmaydigan ot bilan keladi, sifat bilan emas."],["Enough comes after an adjective: hot enough.","Enough ставится после прилагательного: hot enough.","Enough sifatdan keyin keladi: hot enough."]]},{"s":"too-enough-too-much-many","q":"He is not ___ to drive a car. He is only 12.","o":["enough old","too old","old enough"],"a":2,"w":[["Enough goes after the adjective, not before it.","Enough ставим после прилагательного, а не перед ним.","Enough sifatdan oldin emas, keyin keladi."],["Too old does not fit: the problem is that he is young.","Too old не подходит: проблема в том, что он молод.","Too old mos emas: muammo uning yoshligida."],["Adjective + enough: old enough.","Прилагательное + enough: old enough.","Sifat + enough: old enough."]]},{"s":"question-tags","q":"You are a student, ___?","o":["aren't you","are you","don't you"],"a":0,"w":[["A positive sentence takes a negative tag.","После утверждения нужен отрицательный хвостик.","Tasdiq gapdan keyin inkor qo'shimcha so'roq keladi."],["A positive sentence cannot take a positive tag here.","После утверждения хвостик здесь не может быть положительным.","Tasdiq gapdan keyin bu yerda tasdiq so'roq kelmaydi."],["The sentence uses are, so the tag uses are too.","В предложении are, значит и в хвостике are.","Gapda are bor, shuning uchun qo'shimcha so'roqda ham are keladi."]]},{"s":"question-tags","q":"She doesn't like cats, ___?","o":["doesn't she","does she","is she"],"a":1,"w":[["A negative sentence takes a positive tag.","После отрицания нужен положительный хвостик.","Inkor gapdan keyin tasdiq qo'shimcha so'roq keladi."],["Negative sentence + does she?","Отрицание + does she?","Inkor gap + does she?"],["The helper verb here is does, not is.","Вспомогательный глагол здесь does, а не is.","Bu yerda yordamchi fe'l is emas, does."]]},{"s":"infinitive-vs-gerund","q":"I want ___ a new phone.","o":["to buy","buying","buy"],"a":0,"w":[["After want we use to + verb.","После want нужно to + глагол.","Want dan keyin to + fe'l keladi."],["Want is not followed by -ing.","После want не ставим -ing.","Want dan keyin -ing kelmaydi."],["We need to before buy.","Перед buy нужен to.","Buy oldidan to kerak."]]},{"s":"infinitive-vs-gerund","q":"She enjoys ___ books.","o":["read","to read","reading"],"a":2,"w":[["Enjoy cannot go with the bare verb.","После enjoy не ставим голый глагол.","Enjoy dan keyin fe'lning asl shakli kelmaydi."],["Enjoy is not followed by to + verb.","После enjoy не ставим to + глагол.","Enjoy dan keyin to + fe'l kelmaydi."],["After enjoy we use -ing.","После enjoy нужно -ing.","Enjoy dan keyin -ing keladi."]]},{"s":"indefinite-pronouns","q":"Would you like ___ to drink?","o":["something","nobody","anywhere"],"a":0,"w":[["We use something when we offer a thing to someone.","Предлагая что-то, используем something.","Biror narsa taklif qilganda something ishlatiladi."],["Nobody is about people, not about a drink.","Nobody — о людях, а не о напитке.","Nobody odamlar haqida, ichimlik haqida emas."],["Anywhere is about places.","Anywhere — о местах.","Anywhere joylar haqida."]]},{"s":"indefinite-pronouns","q":"I didn't eat ___ this morning.","o":["nothing","anything","something"],"a":1,"w":[["Didn't is already negative. English does not use two negatives.","Didn't уже отрицание, двух отрицаний в английском нет.","Didn't o'zi inkor. Ingliz tilida ikki inkor ishlatilmaydi."],["After a negative verb we use anything.","После отрицательного глагола нужно anything.","Inkor fe'ldan keyin anything keladi."],["Something is for positive sentences.","Something — для утвердительных предложений.","Something tasdiq gaplar uchun."]]}]};
