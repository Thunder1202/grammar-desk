</div><script src="app.js"></script><script>window.GD_QUIZ={"id":"present-continuous","rules":{"be":{"en":"Use <b>am</b> with I, <b>is</b> with he / she / it, <b>are</b> with you / we / they: I <b>am</b> reading, she <b>is</b> reading, they <b>are</b> reading.","ru":"Используйте <b>am</b> с I, <b>is</b> с he / she / it, <b>are</b> с you / we / they: I <b>am</b> reading, she <b>is</b> reading, they <b>are</b> reading.","uz":"<b>am</b> I bilan, <b>is</b> he / she / it bilan, <b>are</b> you / we / they bilan ishlatiladi: I <b>am</b> reading, she <b>is</b> reading, they <b>are</b> reading."},"ing":{"en":"Form: <b>am / is / are + verb-ing</b>. Most verbs just add <b>-ing</b>: play → playing, work → working, study → studying.","ru":"Форма: <b>am / is / are + глагол-ing</b>. Большинство глаголов просто получают <b>-ing</b>: play → playing, work → working, study → studying.","uz":"Shakli: <b>am / is / are + fe'l-ing</b>. Ko'pchilik fe'llarga shunchaki <b>-ing</b> qo'shiladi: play → playing, work → working, study → studying."},"e":{"en":"Verb ends in <b>-e</b>: drop the e, add <b>-ing</b>: make → making, write → writing, have → having. (Not with -ee: see → seeing.)","ru":"Глагол оканчивается на <b>-e</b>: уберите e и добавьте <b>-ing</b>: make → making, write → writing, have → having. (Но не с -ee: see → seeing.)","uz":"Fe'l <b>-e</b> bilan tugasa: e ni tashlab, <b>-ing</b> qo'shing: make → making, write → writing, have → having. (-ee bilan emas: see → seeing.)"},"dbl":{"en":"One short vowel + one consonant at the end: <b>double the consonant</b>: run → running, sit → sitting, swim → swimming, stop → stopping.","ru":"Одна короткая гласная + одна согласная в конце: <b>удвойте согласную</b>: run → running, sit → sitting, swim → swimming, stop → stopping.","uz":"Oxirida bitta qisqa unli + bitta undosh bo'lsa: <b>undoshni ikkilantiring</b>: run → running, sit → sitting, swim → swimming, stop → stopping."},"ie":{"en":"Verb ends in <b>-ie</b>: ie → <b>ying</b>: lie → lying, die → dying.","ru":"Глагол оканчивается на <b>-ie</b>: ie → <b>ying</b>: lie → lying, die → dying.","uz":"Fe'l <b>-ie</b> bilan tugasa: ie → <b>ying</b>: lie → lying, die → dying."},"neg":{"en":"Negative: <b>am / is / are + not + verb-ing</b>: She <b>isn't</b> sleeping. They <b>aren't</b> working. I <b>'m not</b> eating. Do not use don't!","ru":"Отрицание: <b>am / is / are + not + глагол-ing</b>: She <b>isn't</b> sleeping. They <b>aren't</b> working. I <b>'m not</b> eating. Не используйте don't!","uz":"Inkor: <b>am / is / are + not + fe'l-ing</b>: She <b>isn't</b> sleeping. They <b>aren't</b> working. I <b>'m not</b> eating. don't ishlatilmaydi!"},"q":{"en":"Question: <b>Am / Is / Are + subject + verb-ing?</b> Is she sleeping? Are they working?","ru":"Вопрос: <b>Am / Is / Are + подлежащее + глагол-ing?</b> Is she sleeping? Are they working?","uz":"So'roq: <b>Am / Is / Are + ega + fe'l-ing?</b> Is she sleeping? Are they working?"},"sa":{"en":"Short answers use <b>am / is / are</b>, not the verb: Yes, I <b>am</b>. / No, she <b>isn't</b>. / No, I'<b>m not</b>.","ru":"Краткие ответы строятся с <b>am / is / are</b>, а не с глаголом: Yes, I <b>am</b>. / No, she <b>isn't</b>. / No, I'<b>m not</b>.","uz":"Qisqa javoblar <b>am / is / are</b> bilan tuziladi, fe'l bilan emas: Yes, I <b>am</b>. / No, she <b>isn't</b>. / No, I'<b>m not</b>."},"wh":{"en":"Question word first: <b>What / Where / Why / Who + am / is / are + subject + verb-ing?</b> What are you doing?","ru":"Сначала вопросительное слово: <b>What / Where / Why / Who + am / is / are + подлежащее + глагол-ing?</b> What are you doing?","uz":"Avval so'roq so'z: <b>What / Where / Why / Who + am / is / are + ega + fe'l-ing?</b> What are you doing?"},"now":{"en":"We use it for actions happening <b>now</b>: <b>now, at the moment, today, these days, this week, Look! Listen!</b>","ru":"Используем для действий, которые происходят <b>сейчас</b>: <b>now, at the moment, today, these days, this week, Look! Listen!</b>","uz":"<b>Hozir</b> bo'layotgan ishlar uchun ishlatiladi: <b>now, at the moment, today, these days, this week, Look! Listen!</b>"},"ps":{"en":"Present Simple = habits and facts (every day, always). Present Continuous = right now or temporary: He plays football on Sundays. He <b>is playing</b> now.","ru":"Present Simple = привычки и факты (every day, always). Present Continuous = прямо сейчас или временно: He plays football on Sundays. He <b>is playing</b> now.","uz":"Present Simple = odat va faktlar (every day, always). Present Continuous = aynan hozir yoki vaqtincha: He plays football on Sundays. He <b>is playing</b> now."},"state":{"en":"<b>State verbs</b> (know, like, love, want, need, understand, hate, prefer) are NOT used in the continuous: I <b>know</b> (not I am knowing).","ru":"<b>Глаголы состояния</b> (know, like, love, want, need, understand, hate, prefer) НЕ употребляются в continuous: I <b>know</b> (не I am knowing).","uz":"<b>Holat fe'llari</b> (know, like, love, want, need, understand, hate, prefer) continuous shaklda ISHLATILMAYDI: I <b>know</b> (I am knowing emas)."},"fut":{"en":"Present Continuous also means a <b>fixed plan</b> in the near future: I'm meeting Ali tomorrow. We're flying to Dubai on Friday.","ru":"Present Continuous также означает <b>твёрдый план</b> на ближайшее будущее: I'm meeting Ali tomorrow. We're flying to Dubai on Friday.","uz":"Present Continuous yaqin kelajakdagi <b>qat'iy reja</b>ni ham bildiradi: I'm meeting Ali tomorrow. We're flying to Dubai on Friday."},"alw":{"en":"<b>always</b> + Present Continuous = a habit that annoys us: He <b>is always losing</b> his keys!","ru":"<b>always</b> + Present Continuous = раздражающая привычка: He <b>is always losing</b> his keys!","uz":"<b>always</b> + Present Continuous = bizni bezovta qiladigan odat: He <b>is always losing</b> his keys!"},"order":{"en":"Word order: <b>subject + am / is / are + verb-ing + the rest</b>. Questions: <b>(question word) + am / is / are + subject + verb-ing?</b>","ru":"Порядок слов: <b>подлежащее + am / is / are + глагол-ing + остальное</b>. Вопросы: <b>(вопросительное слово) + am / is / are + подлежащее + глагол-ing?</b>","uz":"So'zlar tartibi: <b>ega + am / is / are + fe'l-ing + qolgani</b>. So'roq: <b>(so'roq so'z) + am / is / are + ega + fe'l-ing?</b>"}},"ex":[{"h":{"en":"Write am, is or are.","ru":"Напишите am, is или are.","uz":"am, is yoki are yozing."}},{"h":{"en":"Write the -ing form. Example: play → playing.","ru":"Напишите форму с -ing. Например: play → playing.","uz":"-ing shaklini yozing. Masalan: play → playing."}},{"h":{"en":"Write the verb in brackets in the Present Continuous. Write both words, for example: is reading.","ru":"Напишите глагол из скобок в Present Continuous. Пишите оба слова, например: is reading.","uz":"Qavs ichidagi fe'lni Present Continuous da yozing. Ikkala so'zni yozing, masalan: is reading."}},{"h":{"en":"Make the sentence negative. Write the full sentence.","ru":"Сделайте предложение отрицательным. Напишите его полностью.","uz":"Gapni inkor qiling. To'liq gapni yozing."}},{"h":{"en":"Make a question. Write the full question.","ru":"Составьте вопрос. Напишите вопрос полностью.","uz":"Savol tuzing. To'liq savolni yozing."}},{"h":{"en":"Write a short answer. ✓ = yes, ✗ = no. Example: Is he sleeping? (✓) → Yes, he is.","ru":"Напишите краткий ответ. ✓ = да, ✗ = нет. Например: Is he sleeping? (✓) → Yes, he is.","uz":"Qisqa javob yozing. ✓ = ha, ✗ = yo'q. Masalan: Is he sleeping? (✓) → Yes, he is."}},{"h":{"en":"Questions with a question word. Write the missing word or the full question.","ru":"Вопросы с вопросительным словом. Напишите пропущенное слово или весь вопрос.","uz":"So'roq so'zli savollar. Tushib qolgan so'zni yoki to'liq savolni yozing."}},{"h":{"en":"Present Simple or Present Continuous? Write the correct one.","ru":"Present Simple или Present Continuous? Напишите верный вариант.","uz":"Present Simple yoki Present Continuous? To'g'risini yozing."}},{"h":{"en":"Find the mistake and write the correct sentence.","ru":"Найдите ошибку и напишите правильное предложение.","uz":"Xatoni toping va to'g'ri gapni yozing."}},{"h":{"en":"Future plans and annoying habits. Write the verb in the Present Continuous.","ru":"Планы на будущее и раздражающие привычки. Напишите глагол в Present Continuous.","uz":"Kelajak rejalari va bezovta qiluvchi odatlar. Fe'lni Present Continuous da yozing."}},{"h":{"en":"Put the words in the correct order.","ru":"Расставьте слова в правильном порядке.","uz":"So'zlarni to'g'ri tartibga qo'ying."}}],"q":[{"e":0,"q":"I ___ reading a book.","a":["am"],"r":"be","ru":"Я читаю книгу.","uz":"Men kitob o'qiyapman."},{"e":0,"q":"She ___ sleeping.","a":["is"],"r":"be","ru":"Она спит.","uz":"U uxlayapti."},{"e":0,"q":"They ___ playing football.","a":["are"],"r":"be","ru":"Они играют в футбол.","uz":"Ular futbol o'ynayapti."},{"e":0,"q":"We ___ eating lunch.","a":["are"],"r":"be","ru":"Мы обедаем.","uz":"Biz tushlik qilyapmiz."},{"e":0,"q":"My brother ___ watching TV.","a":["is"],"r":"be","ru":"Мой брат смотрит телевизор.","uz":"Akam televizor ko'ryapti.","n":"My brother = he"},{"e":0,"q":"You ___ running very fast.","a":["are"],"r":"be","ru":"Ты бежишь очень быстро.","uz":"Siz juda tez yugurayapsiz."},{"e":0,"q":"The dog ___ drinking water.","a":["is"],"r":"be","ru":"Собака пьёт воду.","uz":"It suv ichyapti.","n":"The dog = it"},{"e":0,"q":"The children ___ singing.","a":["are"],"r":"be","ru":"Дети поют.","uz":"Bolalar qo'shiq aytyapti.","n":"The children = they"},{"e":1,"q":"play → ___","a":["playing"],"r":"ing","ru":"play — играть","uz":"play — o'ynamoq"},{"e":1,"q":"work → ___","a":["working"],"r":"ing","ru":"work — работать","uz":"work — ishlamoq"},{"e":1,"q":"study → ___","a":["studying"],"r":"ing","ru":"study — учиться","uz":"study — o'qimoq, o'rganmoq","n":"study ends in -y: keep the y and add -ing."},{"e":1,"q":"make → ___","a":["making"],"r":"e","ru":"make — делать","uz":"make — qilmoq, yasamoq"},{"e":1,"q":"write → ___","a":["writing"],"r":"e","ru":"write — писать","uz":"write — yozmoq"},{"e":1,"q":"have → ___","a":["having"],"r":"e","ru":"have — иметь, есть","uz":"have — ega bo'lmoq, yemoq"},{"e":1,"q":"dance → ___","a":["dancing"],"r":"e","ru":"dance — танцевать","uz":"dance — raqsga tushmoq"},{"e":1,"q":"run → ___","a":["running"],"r":"dbl","ru":"run — бегать","uz":"run — yugurmoq"},{"e":1,"q":"sit → ___","a":["sitting"],"r":"dbl","ru":"sit — сидеть","uz":"sit — o'tirmoq"},{"e":1,"q":"swim → ___","a":["swimming"],"r":"dbl","ru":"swim — плавать","uz":"swim — suzmoq"},{"e":1,"q":"stop → ___","a":["stopping"],"r":"dbl","ru":"stop — останавливаться","uz":"stop — to'xtamoq"},{"e":1,"q":"lie → ___","a":["lying"],"r":"ie","ru":"lie — лежать","uz":"lie — yotmoq"},{"e":2,"q":"Look! It ___ (rain).","a":["is raining"],"r":"now","ru":"Смотри! Идёт дождь.","uz":"Qara! Yomg'ir yog'yapti."},{"e":2,"q":"I ___ (do) my homework now.","a":["am doing"],"r":"now","ru":"Я делаю домашнее задание сейчас.","uz":"Men hozir uy vazifamni qilyapman."},{"e":2,"q":"Listen! Aziz ___ (sing).","a":["is singing"],"r":"now","ru":"Слушай! Азиз поёт.","uz":"Tinglang! Aziz qo'shiq aytyapti."},{"e":2,"q":"My parents ___ (work) in the garden.","a":["are working"],"r":"ing","ru":"Мои родители работают в саду.","uz":"Ota-onam bog'da ishlayapti."},{"e":2,"q":"We ___ (have) breakfast at the moment.","a":["are having"],"r":"e","ru":"Мы сейчас завтракаем.","uz":"Biz hozir nonushta qilyapmiz.","n":"have breakfast = eat breakfast, so we can use -ing."},{"e":2,"q":"She ___ (write) an email.","a":["is writing"],"r":"e","ru":"Она пишет электронное письмо.","uz":"U elektron xat yozyapti."},{"e":2,"q":"The baby ___ (sleep) now.","a":["is sleeping"],"r":"now","ru":"Малыш сейчас спит.","uz":"Chaqaloq hozir uxlayapti."},{"e":2,"q":"They ___ (swim) in the pool.","a":["are swimming"],"r":"dbl","ru":"Они плавают в бассейне.","uz":"Ular basseynda suzyapti."},{"e":2,"q":"I ___ (sit) on the sofa.","a":["am sitting"],"r":"dbl","ru":"Я сижу на диване.","uz":"Men ning.","a":["Is it raining?"],"r":"q","ru":"Идёт дождь?","uz":"Yomg'ir yog'yaptimi?"},{"e":4,"q":"Your mother is cooking.","a":["Is your mother cooking?"],"r":"q","ru":"Твоя мама готовит?","uz":"Onangiz ovqat pishiryaptimi?"},{"e":4,"q":"The students are writing.","a":["Are the students writing?"],"r":"q","ru":"Студенты пишут?","uz":"Talabalar yozyaptimi?"},{"e":4,"q":"You are learning English.","a":["Are you learning English?"],"r":"q","ru":"Ты учишь английский?","uz":"Siz ingliz tilini o'rganyapsizmi?"},{"e":4,"q":"Aziz is waiting for us.","a":["Is Aziz waiting for us?"],"r":"q","ru":"Азиз ждёт нас?","uz":"Aziz bizni kutyaptimi?"},{"e":5,"q":"Is she sleeping? (✓)","a":["Yes, she is."],"r":"sa","ru":"Она спит? Да.","uz":"U uxlayaptimi? Ha."},{"e":5,"q":"Are they playing? (✗)","a":["No, they aren't.","No, they are not."],"r":"sa","ru":"Они играют? Нет.","uz":"Ular o'ynayaptimi? Yo'q."},{"e":5,"q":"Are you listening? (✓)","a":["Yes, I am."],"r":"sa","ru":"Ты слушаешь? Да.","uz":"Tinglayapsizmi? Ha."},{"e":5,"q":"Is it raining? (✗)","a":["No, it isn't.","No, it is not."],"r":"sa","ru":"Идёт дождь? Нет.","uz":"Yomg'ir yog'yaptimi? Yo'q."},{"e":5,"q":"Is he working? (✗)","a":["No, he isn't.","No, he is not."],"r":"sa","ru":"Он работает? Нет.","uz":"U ishlayaptimi? Yo'q."},{"e":5,"q":"Are you eating? (✗)","a":["No, I'm not.","No, I am not."],"r":"sa","ru":"Ты ешь? Нет.","uz":"Yeyapsizmi? Yo'q.","n":"After I, we say I'm not (not I amn't)."},{"e":6,"q":"What ___ you doing?","a":["are"],"r":"wh","ru":"Что ты делаешь?","uz":"Siz nima qilyapsiz?"},{"e":6,"q":"Where ___ she going?","a":["is"],"r":"wh","ru":"Куда она идёт?","uz":"U qayerga ketyapti?"},{"e":6,"q":"Why ___ they laughing?","a":["are"],"r":"wh","ru":"Почему они смеются?","uz":"Ular nega kulishyapti?"},{"e":6,"q":"Who ___ he talking to?","a":["is"],"r":"wh","ru":"С кем он разговаривает?","uz":"U kim bilan gaplashyapti?"},{"e":6,"q":"where / he / go","a":["Where is he going?"],"r":"wh","ru":"Куда он идёт?","uz":"U qa
