</div><script src="app.js"></script><script>window.GD_EXAM={"id":"a1-2","level":"a1.html","lvl":"A1","topics":{"countable-and-uncountable-nouns":"Countable and uncountable nouns","articles-a-an-the":"Articles: a / an / the","past-simple-of-to-be":"Past Simple of to be","past-simple":"Past Simple","can-cant":"Can / can't","have-got":"Have got"},"next":{"u":"prepositions-of-place-and-time.html","t":"Prepositions of place and time","k":"nxt"},"q":[{"s":"countable-and-uncountable-nouns","q":"I need some ___.","o":["water","waters","a water"],"a":0,"w":[["Water cannot be counted, so it has no plural.","Water не считается, поэтому нет множественного числа.","Water sanalmaydi, shuning uchun ko'plik shakli yo'q."],["We do not add -s to water.","К water не добавляем -s.","Water ga -s qo'shilmaydi."],["We do not use a with water.","С water не используем a.","Water bilan a ishlatilmaydi."]]},{"s":"countable-and-uncountable-nouns","q":"There are three ___ on the table.","o":["apple","apples","some apple"],"a":1,"w":[["After three the noun must be plural.","После three нужно множественное число.","Three dan keyin ot ko'plikda bo'ladi."],["Apples can be counted: three apples.","Яблоки можно считать: three apples.","Olmani sanash mumkin: three apples."],["Three and some do not go together here.","Three и some здесь вместе не ставятся.","Bu yerda three va some birga kelmaydi."]]},{"s":"articles-a-an-the","q":"She is ___ doctor.","o":["an","a","(no word)"],"a":1,"w":[["An goes before a vowel sound. Doctor starts with d.","An — перед гласным звуком, а doctor начинается с d.","An unli tovushdan oldin keladi. Doctor d bilan boshlanadi."],["We use a before a job, and doctor starts with a consonant sound.","Перед профессией нужен a, а doctor начинается с согласного звука.","Kasb oldidan a keladi, doctor esa undosh tovush bilan boshlanadi."],["English needs a word before a job. We cannot leave it out.","В английском перед профессией нужен артикль, его нельзя пропустить.","Ingliz tilida kasb oldidan artikl kerak, uni tushirib bo'lmaydi."]]},{"s":"articles-a-an-the","q":"This is ___ orange.","o":["a","an","some"],"a":1,"w":[["A goes before a consonant sound. Orange starts with a vowel sound.","A — перед согласным звуком, а orange начинается с гласного.","A undosh tovushdan oldin keladi. Orange unli bilan boshlanadi."],["Orange starts with a vowel sound, so we use an.","Orange начинается с гласного звука, поэтому an.","Orange unli tovush bilan boshlanadi, shuning uchun an."],["Here it is one orange. Some is for plurals or things we cannot count.","Здесь один апельсин, а some — для множественного числа и неисчисляемых.","Bu yerda bitta apelsin. Some ko'plik yoki sanalmaydigan narsalar uchun."]]},{"s":"past-simple-of-to-be","q":"I ___ at home yesterday.","o":["was","were","am"],"a":0,"w":[["Yesterday is past, and I takes was.","Yesterday — прошлое, а с I ставим was.","Yesterday o'tgan zamon, I bilan was keladi."],["Were goes with you, we and they.","Were ставим с you, we и they.","Were you, we va they bilan keladi."],["Am is present, but yesterday is past.","Am — настоящее время, а yesterday — прошлое.","Am hozirgi zamon, yesterday esa o'tgan."]]},{"s":"past-simple-of-to-be","q":"They ___ at school last Monday.","o":["was","weren't","wasn't"],"a":1,"w":[["They takes were, not was.","С they нужно were, а не was.","They bilan was emas, were keladi."],["They + were + not: they weren't.","They + were + not: получается they weren't.","They + were + not: natijada they weren't."],["Wasn't goes with I, he, she and it.","Wasn't ставим с I, he, she и it.","Wasn't I, he, she va it bilan keladi."]]},{"s":"past-simple","q":"We ___ a film last night.","o":["watch","watched","watching"],"a":1,"w":[["Last night is past, so the verb must change.","Last night — прошлое, глагол должен измениться.","Last night o'tgan zamon, fe'l o'zgarishi kerak."],["Regular verbs add -ed in the past.","Правильные глаголы в прошлом получают -ed.","Oddiy fe'llar o'tgan zamonda -ed oladi."],["Watching needs a helper verb like was or were.","Перед watching нужен was или were.","Watching oldidan was yoki were kerak."]]},{"s":"past-simple","q":"She ___ to Bukhara last year.","o":["goed","go","went"],"a":2,"w":[["Go is irregular. There is no form goed.","Go — неправильный глагол, формы goed нет.","Go noto'g'ri fe'l, goed degan shakl yo'q."],["Last year is past, so go must change.","Last year — прошлое, go должен измениться.","Last year o'tgan zamon, go o'zgarishi kerak."],["The past of go is went.","Прошедшая форма go — went.","Go ning o'tgan zamon shakli went."]]},{"s":"can-cant","q":"Birds ___ fly.","o":["can","cans","can to"],"a":0,"w":[["Can + verb shows ability.","Can + глагол показывает умение.","Can + fe'l qobiliyatni bildiradi."],["Can never takes -s.","Can никогда не получает -s.","Can hech qachon -s olmaydi."],["There is no to after can.","После can нет to.","Can dan keyin to kelmaydi."]]},{"s":"can-cant","q":"___ you swim?","o":["Do","Can","Are"],"a":1,"w":[["Do is for normal verbs. Here we ask about ability with can.","Do — для обычных глаголов, а об умении спрашиваем с can.","Do oddiy fe'llar uchun. Qobiliyatni can bilan so'raymiz."],["For a question, put can first: Can you swim?","В вопросе can ставим первым: Can you swim?","So'roqda can birinchi keladi: Can you swim?"],["Are you swim is not correct English.","Are you swim — неправильно.","Are you swim noto'g'ri."]]},{"s":"have-got","q":"I ___ two brothers.","o":["has got","have got","am got"],"a":1,"w":[["Has got goes with he, she and it.","Has got ставим с he, she и it.","Has got he, she va it bilan keladi."],["I takes have got.","С I используем have got.","I bilan have got keladi."],["We never say am got.","Am got не бывает.","Am got degan shakl yo'q."]]},{"s":"have-got","q":"___ she got a car?","o":["Have","Does","Has"],"a":2,"w":[["Have goes with I, you, we and they.","Have ставим с I, you, we и they.","Have I, you, we va they bilan keladi."],["With have got the question starts with has or have, not does.","Вопрос с have got начинается с has или have, а не does.","Have got so'rog'i does bilan emas, has yoki have bilan boshlanadi."],["She takes has: Has she got a car?","С she используем has: Has she got a car?","She bilan has keladi: Has she got a car?"]]}]};
