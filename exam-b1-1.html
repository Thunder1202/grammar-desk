</div><script src="app.js"></script><script>window.GD_EXAM={"id":"b1-1","level":"b1.html","lvl":"B1","topics":{"present-perfect-vs-past-simple":"Present Perfect vs Past Simple","present-perfect-continuous":"Present Perfect Continuous","past-perfect":"Past Perfect","future-forms-review":"Future forms review","first-conditional":"First Conditional","second-conditional":"Second Conditional"},"next":{"u":"passive-voice-present-and-past.html","t":"Passive voice (present and past)","k":"nxt"},"q":[{"s":"present-perfect-vs-past-simple","q":"I ___ my keys yesterday.","o":["lost","have lost","have losing"],"a":0,"w":[["Yesterday is a finished time, so we use the past simple.","Yesterday — законченное время, поэтому past simple.","Yesterday tugagan vaqt, shuning uchun past simple."],["Present perfect cannot go with yesterday.","Present perfect не сочетается с yesterday.","Present perfect yesterday bilan kelmaydi."],["After have we need the past participle: lost.","После have нужна третья форма: lost.","Have dan keyin uchinchi shakl keladi: lost."]]},{"s":"present-perfect-vs-past-simple","q":"She ___ here since 2020.","o":["lived","has lived","lives"],"a":1,"w":[["Lived would mean it is finished, but since shows it continues.","Lived значило бы, что это закончилось, а since говорит, что продолжается.","Lived tugaganini bildirardi, since esa davom etayotganini ko'rsatadi."],["Since + start point takes the present perfect.","Since + начальная точка требует present perfect.","Since + boshlanish nuqtasi present perfect talab qiladi."],["The present simple does not go with since here.","Present simple здесь не сочетается с since.","Present simple bu yerda since bilan kelmaydi."]]},{"s":"present-perfect-continuous","q":"I'm tired because I ___ all day.","o":["have been working","have working","worked been"],"a":0,"w":[["A long activity up to now with a result: have been + -ing.","Длительное действие до сих пор с результатом: have been + -ing.","Hozirgacha davom etgan, natijasi bor ish: have been + -ing."],["Been is missing between have and working.","Между have и working пропущено been.","Have va working orasida been tushib qolgan."],["Worked been is not a real form.","Worked been — такой формы нет.","Worked been degan shakl yo'q."]]},{"s":"present-perfect-continuous","q":"How long ___ you been waiting?","o":["did","were","have"],"a":2,"w":[["Did goes with the base verb, not with been waiting.","Did идёт с начальной формой, а не с been waiting.","Did asl shakl bilan keladi, been waiting bilan emas."],["Were you been is not correct.","Were you been — неправильно.","Were you been xato."],["The form is have + been + -ing.","Форма: have + been + -ing.","Shakl: have + been + -ing."]]},{"s":"past-perfect","q":"When we arrived, the film ___.","o":["had already started","has already started","already start"],"a":0,"w":[["It started before we arrived, so we use the past perfect.","Он начался до нашего прихода, поэтому past perfect.","U biz kelishimizdan oldin boshlangan, shuning uchun past perfect."],["Has started links to now, but this story is in the past.","Has started связано с настоящим, а рассказ о прошлом.","Has started hozirga bog'liq, hikoya esa o'tmish haqida."],["Already start has no helper verb and no past form.","В already start нет вспомогательного глагола и формы прошлого.","Already start da yordamchi fe'l ham, o'tgan shakl ham yo'q."]]},{"s":"past-perfect","q":"She was hungry because she ___ breakfast.","o":["hadn't eaten","hasn't eaten","didn't ate"],"a":0,"w":[["Not eating came before she was hungry: past perfect.","Она не поела раньше, чем проголодалась: past perfect.","Ovqat yemagani och qolishidan oldin bo'lgan: past perfect."],["Hasn't eaten is about now, but the story is in the past.","Hasn't eaten — о настоящем, а рассказ о прошлом.","Hasn't eaten hozir haqida, hikoya esa o'tmish haqida."],["After didn't we need the base verb: didn't eat.","После didn't нужна начальная форма: didn't eat.","Didn't dan keyin asl shakl keladi: didn't eat."]]},{"s":"future-forms-review","q":"The train ___ at 8:15 tomorrow. Here's the timetable.","o":["leaves","is leave","will to leave"],"a":0,"w":[["For timetables we use the present simple.","Для расписаний используем present simple.","Jadvallar uchun present simple ishlatiladi."],["Is leave is not a real form.","Is leave — такой формы нет.","Is leave degan shakl yo'q."],["There is no to after will.","После will нет to.","Will dan keyin to kelmaydi."]]},{"s":"future-forms-review","q":"I think he ___ the job. He is very good.","o":["will get","gets","is get"],"a":0,"w":[["An opinion about the future: will, often after I think.","Мнение о будущем: will, часто после I think.","Kelajak haqidagi fikr: will, ko'pincha I think dan keyin."],["The present simple is not used for an opinion about the future.","Present simple не используем для мнения о будущем.","Kelajak haqidagi fikr uchun present simple ishlatilmaydi."],["Is get is not a real form.","Is get — такой формы нет.","Is get degan shakl yo'q."]]},{"s":"first-conditional","q":"If it ___ tomorrow, we will stay at home.","o":["rains","will rain","rained"],"a":0,"w":[["After if we use the present, even about the future.","После if ставим настоящее, даже о будущем.","If dan keyin kelasi zamon haqida ham hozirgi zamon keladi."],["We do not use will in the if part.","В части с if не используем will.","If qismida will ishlatilmaydi."],["Rained with will does not fit a real future plan.","Rained вместе с will не подходит для реального будущего.","Rained will bilan real kelajakka mos kelmaydi."]]},{"s":"first-conditional","q":"She will be angry if you ___ late.","o":["are","will be","were being"],"a":0,"w":[["If + present, will in the other part.","If + настоящее, в другой части will.","If + hozirgi zamon, ikkinchi qismda will."],["The if part does not take will.","В части с if не бывает will.","If qismida will kelmaydi."],["Were being does not fit a real future situation.","Were being не подходит для реального будущего.","Were being real kelajak holatiga mos emas."]]},{"s":"second-conditional","q":"If I ___ a lot of money, I would buy a house.","o":["had","have","would have"],"a":0,"w":[["It is not real now: if + past, then would.","Это нереально сейчас: if + прошедшее, затем would.","Bu hozir real emas: if + o'tgan zamon, keyin would."],["Have would be the first conditional with will.","Have был бы в первом типе с will.","Have bo'lsa, birinchi tur will bilan kelardi."],["We do not use would in the if part.","В части с if не используем would.","If qismida would ishlatilmaydi."]]},{"s":"second-conditional","q":"If I were you, I ___ to the doctor.","o":["would go","will go","went"],"a":0,"w":[["If I were you gives advice with would.","If I were you — совет с would.","If I were you would bilan maslahat beradi."],["Will belongs to real situations, not to if I were you.","Will — для реальных ситуаций, не для if I were you.","Will real holatlar uchun, if I were you uchun emas."],["The main part needs would + verb, not the past.","В главной части нужно would + глагол, а не прошедшее.","Bosh qismda o'tgan zamon emas, would + fe'l kerak."]]}]};
