</div><script src="app.js"></script><script>window.GD_QUIZ={"id":"future-perfect","rules":{"f":{"en":"Form: <b>will + have + past participle</b> for all people: I <b>will have finished</b>, she <b>will have finished</b>. Short form: I'll have finished.","ru":"Форма: <b>will + have + причастие прошедшего времени</b> для всех лиц: I <b>will have finished</b>, she <b>will have finished</b>. Краткая форма: I'll have finished.","uz":"Shakli: <b>will + have + o'tgan zamon sifatdoshi</b> barcha shaxslar uchun: I <b>will have finished</b>, she <b>will have finished</b>. Qisqa shakl: I'll have finished."},"pp":{"en":"Participles: regular verbs add <b>-ed</b> (finish → finished). Irregular verbs have a special 3rd form: do → <b>done</b>, write → <b>written</b>, take → <b>taken</b>, go → <b>gone</b>, see → <b>seen</b>, build → <b>built</b>.","ru":"Причастия: у правильных глаголов <b>-ed</b> (finish → finished). У неправильных особая 3-я форма: do → <b>done</b>, write → <b>written</b>, take → <b>taken</b>, go → <b>gone</b>, see → <b>seen</b>, build → <b>built</b>.","uz":"Sifatdoshlar: muntazam fe'llarga <b>-ed</b> (finish → finished). Noto'g'ri fe'llarda maxsus 3-shakl: do → <b>done</b>, write → <b>written</b>, take → <b>taken</b>, go → <b>gone</b>, see → <b>seen</b>, build → <b>built</b>."},"use":{"en":"Use it for an action that <b>will be finished before a certain time in the future</b>: By 6 pm I <b>will have finished</b> my work. (At 6 the work is already done.)","ru":"Используется для действия, которое <b>закончится до определённого момента в будущем</b>: By 6 pm I <b>will have finished</b> my work. (В 6 работа уже будет сделана.)","uz":"<b>Kelajakdagi aniq vaqtgacha tugagan bo'ladigan</b> ish uchun ishlatiladi: By 6 pm I <b>will have finished</b> my work. (Soat 6 da ish allaqachon tugagan bo'ladi.)"},"by":{"en":"<b>by</b> + time = not later than that time: <b>by Friday, by 5 pm, by next year, by the time</b>. With the Future Perfect we use <b>by</b>, not <b>until</b>.","ru":"<b>by</b> + время = не позже этого времени: <b>by Friday, by 5 pm, by next year, by the time</b>. С Future Perfect используется <b>by</b>, а не <b>until</b>.","uz":"<b>by</b> + vaqt = shu vaqtdan kechikmay: <b>by Friday, by 5 pm, by next year, by the time</b>. Future Perfect bilan <b>by</b> ishlatiladi, <b>until</b> emas."},"until":{"en":"<b>until / till</b> = up to that time, with an action that continues (Future Simple): I will wait <b>until</b> 6 pm. <b>by</b> = finished before that time: I will have finished <b>by</b> 6 pm.","ru":"<b>until / till</b> = вплоть до этого времени, с длящимся действием (Future Simple): I will wait <b>until</b> 6 pm. <b>by</b> = закончено до этого времени: I will have finished <b>by</b> 6 pm.","uz":"<b>until / till</b> = shu vaqtgacha, davom etadigan ish bilan (Future Simple): I will wait <b>until</b> 6 pm. <b>by</b> = shu vaqtdan oldin tugagan: I will have finished <b>by</b> 6 pm."},"bythe":{"en":"<b>By the time / before / when</b> + <b>Present Simple</b> (not will): By the time you <b>arrive</b>, I <b>will have cooked</b> dinner. Never: By the time you will arrive.","ru":"<b>By the time / before / when</b> + <b>Present Simple</b> (не will): By the time you <b>arrive</b>, I <b>will have cooked</b> dinner. Нельзя: By the time you will arrive.","uz":"<b>By the time / before / when</b> + <b>Present Simple</b> (will emas): By the time you <b>arrive</b>, I <b>will have cooked</b> dinner. Mumkin emas: By the time you will arrive."},"dur":{"en":"<b>Duration up to a future time</b> (with state verbs or for + period): By June she <b>will have worked</b> here for five years. They <b>will have been</b> married for 20 years by then.","ru":"<b>Длительность до момента в будущем</b> (с глаголами состояния или for + период): By June she <b>will have worked</b> here for five years. They <b>will have been</b> married for 20 years by then.","uz":"<b>Kelajakdagi paytgacha davomiylik</b> (holat fe'llari yoki for + davr bilan): By June she <b>will have worked</b> here for five years. They <b>will have been</b> married for 20 years by then."},"neg":{"en":"Negative: <b>won't have + past participle</b>: I <b>won't have finished</b> by Friday. They <b>won't have arrived</b>.","ru":"Отрицание: <b>won't have + причастие</b>: I <b>won't have finished</b> by Friday. They <b>won't have arrived</b>.","uz":"Inkor: <b>won't have + sifatdosh</b>: I <b>won't have finished</b> by Friday. They <b>won't have arrived</b>."},"q":{"en":"Question: <b>Will + subject + have + past participle?</b> Will you have finished by six? Will she have left?","ru":"Вопрос: <b>Will + подлежащее + have + причастие?</b> Will you have finished by six? Will she have left?","uz":"So'roq: <b>Will + ega + have + sifatdosh?</b> Will you have finished by six? Will she have left?"},"sa":{"en":"Short answers: Yes, I <b>will</b>. / No, she <b>won't</b>. Do not repeat have + participle.","ru":"Краткие ответы: Yes, I <b>will</b>. / No, she <b>won't</b>. have + причастие не повторяйте.","uz":"Qisqa javoblar: Yes, I <b>will</b>. / No, she <b>won't</b>. have + sifatdosh ni takrorlamang."},"fs":{"en":"<b>Future Simple</b> = a decision, promise or prediction (I'll finish it). <b>Future Perfect</b> = already done by a future time (I'll have finished it by noon).","ru":"<b>Future Simple</b> = решение, обещание или предсказание (I'll finish it). <b>Future Perfect</b> = уже сделано к моменту в будущем (I'll have finished it by noon).","uz":"<b>Future Simple</b> = qaror, va'da yoki bashorat (I'll finish it). <b>Future Perfect</b> = kelajakdagi paytgacha allaqachon tugagan (I'll have finished it by noon)."},"pred":{"en":"We also use it for <b>predictions about the present</b>: It's 8 pm. They <b>will have arrived</b> home by now. (I think they have arrived.)","ru":"Также используется для <b>предположений о настоящем</b>: It's 8 pm. They <b>will have arrived</b> home by now. (Думаю, они уже приехали.)","uz":"<b>Hozirgi payt haqida taxminlar</b> uchun ham ishlatiladi: It's 8 pm. They <b>will have arrived</b> home by now. (Menimcha, ular allaqachon yetib kelishgan.)"},"order":{"en":"Word order: <b>subject + will + have + participle + (by + time)</b>. Questions: <b>(question word) + will + subject + have + participle?</b>","ru":"Порядок слов: <b>подлежащее + will + have + причастие + (by + время)</b>. Вопросы: <b>(вопросительное слово) + will + подлежащее + have + причастие?</b>","uz":"So'zlar tartibi: <b>ega + will + have + sifatdosh + (by + vaqt)</b>. So'roq: <b>(so'roq so'z) + will + ega + have + sifatdosh?</b>"}},"ex":[{"h":{"en":"Write the past participle (3rd form). Example: do → done.","ru":"Напишите причастие (3-ю форму). Например: do → done.","uz":"Sifatdoshni (3-shaklni) yozing. Masalan: do → done."}},{"h":{"en":"Write the verb in brackets in the Future Perfect. Write all words, for example: will have finished.","ru":"Напишите глагол из скобок в Future Perfect. Пишите все слова, например: will have finished.","uz":"Qavs ichidagi fe'lni Future Perfect da yozing. Hamma so'zlarni yozing, masalan: will have finished."}},{"h":{"en":"Make the sentence negative. Write the full sentence.","ru":"Сделайте предложение отрицательным. Напишите его полностью.","uz":"Gapni inkor qiling. To'liq gapni yozing."}},{"h":{"en":"Make a question. Write the full question.","ru":"Составьте вопрос. Напишите вопрос полностью.","uz":"Savol tuzing. To'liq savolni yozing."}},{"h":{"en":"Write a short answer. ✓ = yes, ✗ = no. Example: Will he have finished? (✓) → Yes, he will.","ru":"Напишите краткий ответ. ✓ = да, ✗ = нет. Например: Will he have finished? (✓) → Yes, he will.","uz":"Qisqa javob yozing. ✓ = ha, ✗ = yo'q. Masalan: Will he have finished? (✓) → Yes, he will."}},{"h":{"en":"Write by or until.","ru":"Напишите by или until.","uz":"by yoki until yozing."}},{"h":{"en":"Future Simple or Future Perfect? Write the verb in brackets in the correct form.","ru":"Future Simple или Future Perfect? Напишите глагол из скобок в нужной форме.","uz":"Future Simple yoki Future Perfect? Qavs ichidagi fe'lni to'g'ri shaklda yozing."}},{"h":{"en":"How long by then? Write the verb in brackets in the Future Perfect.","ru":"Сколько времени к тому моменту? Напишите глагол из скобок в Future Perfect.","uz":"O'sha paytga kelib qancha vaqt? Qavs ichidagi fe'lni Future Perfect da yozing."}},{"h":{"en":"By the time, before, when: write the verb in brackets in the correct form (Future Perfect or Present Simple).","ru":"By the time, before, when: напишите глагол из скобок в нужной форме (Future Perfect или Present Simple).","uz":"By the time, before, when: qavs ichidagi fe'lni to'g'ri shaklda yozing (Future Perfect yoki Present Simple)."}},{"h":{"en":"Find the mistake and write the correct sentence.","ru":"Найдите ошибку и напишите правильное предложение.","uz":"Xatoni toping va to'g'ri gapni yozing."}},{"h":{"en":"Put the words in the correct order.","ru":"Расставьте слова в правильном порядке.","uz":"So'zlarni to'g'ri tartibga qo'ying."}}],"q":[{"e":0,"q":"do → ___","a":["done"],"r":"pp","ru":"do — делать","uz":"do — qilmoq"},{"e":0,"q":"write → ___","a":["written"],"r":"pp","ru":"write — писать","uz":"write — yozmoq"},{"e":0,"q":"take → ___","a":["taken"],"r":"pp","ru":"take — брать","uz":"take — olmoq"},{"e":0,"q":"build → ___","a":["built"],"r":"pp","ru":"build — строить","uz":"build — qurmoq"},{"e":0,"q":"see → ___","a":["seen"],"r":"pp","ru":"see — видеть","uz":"see — ko'rmoq"},{"e":0,"q":"finish → ___","a":["finished"],"r":"pp","ru":"finish — заканчивать","uz":"finish — tugatmoq"},{"e":0,"q":"learn → ___","a":["learned","learnt"],"r":"pp","ru":"learn — учить","uz":"learn — o'rganmoq"},{"e":0,"q":"leave → ___","a":["left"],"r":"pp","ru":"leave — уходить","uz":"leave — ketmoq"},{"e":1,"q":"By 6 pm I ___ (finish) my work.","a":["will have finished"],"r":"use","ru":"К 6 вечера я закончу работу.","uz":"Soat 6 gacha men ishimni tugatgan bo'laman."},{"e":1,"q":"She ___ (write) the report by Friday.","a":["will have written"],"r":"use","ru":"К пятнице она напишет отчёт.","uz":"Juma kuniga kelib u hisobotni yozgan bo'ladi."},{"e":1,"q":"By next year we ___ (build) a new house.","a":["will have built"],"r":"use","ru":"К следующему году мы построим новый дом.","uz":"Kelasi yilga kelib biz yangi uy qurgan bo'lamiz."},{"e":1,"q":"They ___ (leave) before we arrive.","a":["will have left"],"r":"use","ru":"Они уйдут до нашего прихода.","uz":"Biz yetib kelmasdan oldin ular ketgan bo'ladi."},{"e":1,"q":"By the end of the month I ___ (save) $500.","a":["will have saved"],"r":"use","ru":"К концу месяца я накоплю 500 долларов.","uz":"Oy oxiriga kelib men 500 dollar yig'gan bo'laman."},{"e":1,"q":"The film ___ (start) by the time we get there.","a":["will have started"],"r":"use","ru":"К тому времени как мы приедем, фильм уже начнётся.","uz":"Biz yetib borgunimizcha film boshlangan bo'ladi."},{"e":1,"q":"My sister ___ (graduate) by June.","a":["will have graduated"],"r":"use","ru":"К июню моя сестра окончит университет.","uz":"Singlim iyunga kelib bitirgan bo'ladi."},{"e":1,"q":"By 2030 scientists ___ (find) a cure.","a":["will have found"],"r":"use","ru":"К 2030 году учёные найдут лекарство.","uz":"2030-yilga kelib olimlar davo topgan bo'ladi."},{"e":1,"q":"By Monday I ___ (read) the whole book.","a":["will have read"],"r":"use","ru":"К понедельнику я прочитаю всю книгу.","uz":"Dushanbaga kelib men butun kitobni o'qib bo'lgan bo'laman."},{"e":1,"q":"You ___ (forget) all about it by next week.","a":["will have forgotten"],"r":"use","ru":"К следующей неделе ты об этом совсем забудешь.","uz":"Kelasi haftaga kelib siz buni butunlay unutgan bo'lasiz."},{"e":2,"q":"I will have finished by Friday.","a":["I won't have finished by Friday.","I will not have finished by Friday."],"r":"neg","ru":"К пятнице я не закончу.","uz":"Jumaga kelib men tugatmagan bo'laman."},{"e":2,"q":"She will have arrived by noon.","a":["She won't have arrived by noon.","She will not have arrived by noon."],"r":"neg","ru":"К полудню она не приедет.","uz":"Tushga kelib u yetib kelmagan bo'ladi."},{"e":2,"q":"They will have built the bridge by 2030.","a":["They won't have built the bridge by 2030.","They will not have built the bridge by 2030."],"r":"neg","ru":"К 2030 году они не построят мост.","uz":"2030-yilga kelib ular ko'prikni qurmagan bo'ladi."},{"e":2,"q":"We will have sold the house by June.","a":["We won't have sold the house by June.","We will not have sold the house by June."],"r":"neg","ru":"К июню мы не продадим дом.","uz":"Iyunga kelib biz uyni sotmagan bo'lamiz."},{"e":2,"q":"He will have learned English by next year.","a":["He won't have learned English by next year.","He will not have learned English by next year.","He won't have learnt English by next year.","He will not have learnt English by next year."],"r":"neg","ru":"К следующему году он не выучит английский.","uz":"Kelasi yilga kelib u ingliz tilini o'rganmagan bo'ladi."},{"e":2,"q":"You will have done everything.","a":["You won't have done everything.","You will not have done everything."],"r":"neg","ru":"Ты не сделаешь всё.","uz":"Siz hammasini qilmagan bo'lasiz."},{"e":3,"q":"you / finish / by six","a":["Will you have finished by six?"],"r":"q","ru":"Ты закончишь к шести?","uz":"Oltigacha tugatgan bo'lasizmi?"},{"e":3,"q":"she / leave / by then","a":["Will she have left by then?"],"r":"q","ru":"Она уйдёт к тому времени?","uz":"U o'sha paytgacha ketgan bo'ladimi?"},{"e":3,"q":"they / arrive / by noon","a":["Will they have arrived by noon?"],"r":"q","ru":"Они приедут к полудню?","uz":"Ular tushgacha yetib kelgan bo'ladimi?"},{"e":3,"q":"he / graduate / by next year","a":["Will he have graduated by next year?"],"r":"q","ru":"Он окончит университет к следующему году?","uz":"U kelasi yilgacha bitirgan bo'ladimi?"},{"e":3,"q":"you / read / the book / by Monday","a":["Will you have read the book by Monday?"],"r":"q","ru":"Ты прочитаешь книгу к понедельнику?","uz":"Dushanbagacha kitobni o'qib bo'lgan bo'lasizmi?"},{"e":3,"q":"the shop / close / by 9","a":["Will the shop have closed by 9?"],"r":"q","ru":"Магазин закроется к 9?","uz":"Do'kon 9 gacha yopilgan bo'ladimi?"},{"e":4,"q":"Will you have finished by six? (✓)","a":["Yes, I will."],"r":"sa","ru":"Ты закончишь к шести? Да.","uz":"Oltigacha tugatgan bo'lasizmi? Ha."},{"e":4,"q":"Will she have left? (✗)","a":["No, she won't.","No, she will not."],"r":"sa","ru":"Она уйдёт к тому времени? Нет.","uz":"U ketgan bo'ladimi? Yo'q."},{"e":4,"q":"Will they have arrived? (✓)","a":["Yes, they will."],"r":"sa","ru":"Они приедут? Да.","uz":"Ular yetib kelgan bo'ladimi? Ha."},{"e":4,"q":"Will he have graduated? (✗)","a":["No, he won't.","No, he will not."],"r":"sa","ru":"Он окончит? Нет.","uz":"U bitirgan bo'ladimi? Yo'q."},{"e":5,"q":"I will have finished the work ___ 5 o'clock. (not later than)","a":["by"],"r":"by","ru":"К 5 часам я закончу работу.","uz":"Men ishni soat 5 gacha tugatgan bo'laman."},{"e":5,"q":"I will wait for you ___ 5 o'clock. (up to that time)","a":["until"],"r":"until","ru":"Я буду ждать тебя до 5 часов.","uz":"Men sizni soat 5 gacha kutaman."},{"e":5,"q":"She will have left ___ Friday. (not later than)","a":["by"],"r":"by","ru":"К пятнице она уедет.","uz":"Jumaga kelib u ketgan bo'ladi."},{"e":5,"q":"We will stay here ___ the rain stops. (up to that time)","a":["until"],"r":"until","ru":"Мы будем здесь, пока не кончится дождь.","uz":"Yomg'ir tinguncha biz shu yerda qolamiz."},{"e":5,"q":"The report will be ready ___ tomorrow morning. (not later than)","a":["by"],"r":"by","ru":"Отчёт будет готов к завтрашнему утру.","uz":"Hisobot ertaga ertalabgacha tayyor bo'ladi."},{"e":5,"q":"He will work ___ midnight. (up to that time)","a":["until"],"r":"until","ru":"Он будет работать до полуночи.","uz":"U yarim tungacha ishlaydi."},{"e":6,"q":"I'm busy now. I ___ (call) you tomorrow. (a promise)","a":["will call","'ll call"],"r":"fs","ru":"Сейчас я занят. Я позвоню тебе завтра.","uz":"Hozir bandman. Ertaga sizga qo'ng'iroq qilaman."},{"e":6,"q":"Don't call me at 7. I ___ (already / leave).","a":["will have already left"],"r":"fs","ru":"Не звони мне в 7. Я уже уйду.","uz":"Soat 7 da qo'ng'iroq qilmang. Men allaqachon ketgan bo'laman."},{"e":6,"q":"I think she ___ (win) the race. (a prediction)","a":["will win","'ll win"],"r":"fs","ru":"Думаю, она выиграет забег.","uz":"Menimcha, u musobaqada g'alaba qozonadi."},{"e":6,"q":"By the end of the race she ___ (run) 10 km.","a":["will have run"],"r":"fs","ru":"К концу забега она пробежит 10 км.","uz":"Poyga oxiriga kelib u 10 km yugurgan bo'ladi."},{"e":6,"q":"I'm sure you ___ (love) this film. (a prediction)","a":["will love","'ll love"],"r":"fs","ru":"Уверен, тебе понравится этот фильм.","uz":"Ishonchim komilki, bu film sizga yoqadi."},{"e":6,"q":"By the time you read this, I ___ (arrive) in Rome.","a":["will have arrived"],"r":"fs","ru":"К тому времени как ты это прочтёшь, я уже буду в Риме.","uz":"Buni o'qiguningizcha men Rimga yetib borgan bo'laman."},{"e":6,"q":"It's 9 pm. Mum ___ (arrive) home by now. (a guess)","a":["will have arrived"],"r":"pred","ru":"Сейчас 9 вечера. Мама, наверное, уже дома.","uz":"Soat kechki 9. Onam hozirga kelib uyga yetib kelgan bo'lsa kerak."},{"e":6,"q":"The post ___ (come) by now. Let's check the mailbox. (a guess)","a":["will have come"],"r":"pred","ru":"Почта, наверное, уже пришла. Давай проверим ящик.","uz":"Pochta hozirgacha kelgan bo'lsa kerak. Pochta qutisini tekshiraylik."},{"e":7,"q":"By June she ___ (work) here for five years.","a":["will have worked"],"r":"dur","ru":"К июню она будет работать здесь пять лет.","uz":"Iyunga kelib u bu yerda besh yil ishlagan bo'ladi."},{"e":7,"q":"In October they ___ (be) married for twenty years.","a":["will have been"],"r":"dur","ru":"В октябре они будут женаты двадцать лет.","uz":"Oktyabrda ular yigirma yildan beri turmush qurgan bo'lishadi."},{"e":7,"q":"By 2030 I ___ (live) in this city for 15 years.","a":["will have lived"],"r":"dur","ru":"К 2030 году я буду жить в этом городе 15 лет.","
