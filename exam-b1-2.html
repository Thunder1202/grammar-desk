</div><script src="app.js"></script><script>window.GD_EXAM={"id":"b1-2","level":"b1.html","lvl":"B1","topics":{"passive-voice-present-and-past":"Passive voice (present and past)","modals-of-deduction":"Modals of deduction","reported-speech-statements":"Reported speech (statements)","relative-clauses":"Relative clauses","used-to-would":"Used to / would","gerund-and-infinitive":"Gerund and infinitive"},"next":{"u":"articles-review.html","t":"Articles review","k":"nxt"},"q":[{"s":"passive-voice-present-and-past","q":"English ___ all over the world.","o":["is spoken","speaks","is speaking"],"a":0,"w":[["People speak it, so we use the passive: is + past participle.","На нём говорят люди, поэтому пассив: is + третья форма.","Unda odamlar gapiradi, shuning uchun passiv: is + uchinchi shakl."],["English does not do the speaking itself.","Английский сам не говорит.","Ingliz tili o'zi gapirmaydi."],["This is the active form. English is not doing the action.","Это активная форма, а английский не выполняет действие.","Bu faol shakl, ingliz tili ishni bajarmaydi."]]},{"s":"passive-voice-present-and-past","q":"This bridge ___ in 1950.","o":["was built","is built","built"],"a":0,"w":[["1950 is the past, and someone built it: was + past participle.","1950 — прошлое, и его кто-то построил: was + третья форма.","1950 o'tgan zamon, uni kimdir qurgan: was + uchinchi shakl."],["Is built is present, but 1950 is the past.","Is built — настоящее, а 1950 — прошлое.","Is built hozirgi zamon, 1950 esa o'tgan."],["Without was it means the bridge built something.","Без was получается, что мост что-то построил.","Was bo'lmasa, ko'prik nimadir qurgan bo'lib chiqadi."]]},{"s":"modals-of-deduction","q":"She has three cars. She ___ be rich.","o":["must","can't","should to"],"a":0,"w":[["We are almost sure it is true: must.","Мы почти уверены, что это так: must.","Bu rost ekaniga deyarli ishonamiz: must."],["Can't means we are sure it is not true.","Can't значит, что мы уверены: это неправда.","Can't bu rost emasligiga ishonchni bildiradi."],["There is no to after should.","После should нет to.","Should dan keyin to kelmaydi."]]},{"s":"modals-of-deduction","q":"That ___ be Tom. He is in London now.","o":["must","can't","has"],"a":1,"w":[["Must would mean we are sure it is Tom.","Must значило бы, что мы уверены, что это Том.","Must Tom ekaniga ishonchni bildirardi."],["We are sure it is not Tom: can't.","Мы уверены, что это не Том: can't.","Bu Tom emasligiga ishonamiz: can't."],["Has be is not correct.","Has be — неправильно.","Has be xato."]]},{"s":"reported-speech-statements","q":"Ali said, \"I am tired.\" = Ali said that he ___ tired.","o":["was","is being","were"],"a":0,"w":[["Reported speech moves one tense back: am to was.","В косвенной речи время сдвигается: am становится was.","O'zlashtirma gapda zamon bir pog'ona orqaga ketadi: am was ga."],["Is being does not change the tense back.","Is being не сдвигает время назад.","Is being zamonni orqaga surmaydi."],["He takes was, not were.","С he нужно was, а не were.","He bilan were emas, was keladi."]]},{"s":"reported-speech-statements","q":"She ___ me that she was busy.","o":["told","said","spoke"],"a":0,"w":[["Tell needs a person: told me.","После tell нужен человек: told me.","Tell dan keyin odam keladi: told me."],["Said cannot go straight with me. We say said to me.","Said нельзя сразу с me: говорят said to me.","Said to'g'ridan-to'g'ri me bilan kelmaydi: said to me deyiladi."],["Spoke does not report words this way.","Spoke так не передаёт чужие слова.","Spoke gapni bunday o'zlashtirmaydi."]]},{"s":"relative-clauses","q":"The woman ___ lives next door is a nurse.","o":["who","which","where"],"a":0,"w":[["Who is for people.","Who — для людей.","Who odamlar uchun."],["Which is for things.","Which — для предметов.","Which narsalar uchun."],["Where is for places.","Where — для мест.","Where joylar uchun."]]},{"s":"relative-clauses","q":"This is the town ___ I was born.","o":["which","where","who"],"a":1,"w":[["With which we would need in at the end: which I was born in.","С which нужно in в конце: which I was born in.","Which bilan oxirida in kerak: which I was born in."],["Where is for places, and born needs a place here.","Where — для мест, здесь речь о месте рождения.","Where joylar uchun, bu yerda tug'ilgan joy haqida gap."],["Who is for people.","Who — для людей.","Who odamlar uchun."]]},{"s":"used-to-would","q":"I ___ live in Bukhara, but now I live in Tashkent.","o":["used to","use to","am used to"],"a":0,"w":[["A past state that is not true now: used to + verb.","Прошлое состояние, которого теперь нет: used to + глагол.","Endi yo'q o'tmish holati: used to + fe'l."],["In a positive sentence we write used to, with -d.","В утверждении пишем used to, с -d.","Tasdiq gapda used to, -d bilan yoziladi."],["Am used to means I am familiar with it, and it needs -ing.","Am used to значит «привык» и требует -ing.","Am used to odatlanganlikni bildiradi va -ing talab qiladi."]]},{"s":"used-to-would","q":"When I was a child, my grandfather ___ tell me stories every night.","o":["would","will","was"],"a":0,"w":[["Would can show a repeated action in the past.","Would показывает повторявшееся действие в прошлом.","Would o'tmishda takrorlangan ishni bildiradi."],["Will is about the future.","Will — о будущем.","Will kelajak haqida."],["Was tell is not a real form.","Was tell — такой формы нет.","Was tell degan shakl yo'q."]]},{"s":"gerund-and-infinitive","q":"I'm interested in ___ French.","o":["learning","to learn","learn"],"a":0,"w":[["After a preposition like in we use -ing.","После предлога, например in, нужно -ing.","In kabi predlogdan keyin -ing keladi."],["To + verb does not follow a preposition.","To + глагол не ставим после предлога.","Predlogdan keyin to + fe'l kelmaydi."],["The bare verb does not follow a preposition.","Голый глагол не ставим после предлога.","Predlogdan keyin fe'lning asl shakli kelmaydi."]]},{"s":"gerund-and-infinitive","q":"He promised ___ me tomorrow.","o":["to call","calling","call"],"a":0,"w":[["After promise we use to + verb.","После promise нужно to + глагол.","Promise dan keyin to + fe'l keladi."],["Promise is not followed by -ing.","После promise не ставим -ing.","Promise dan keyin -ing kelmaydi."],["We need to before call.","Перед call нужен to.","Call oldidan to kerak."]]}]};
