</div><script src="app.js"></script><script>window.GD_EXAM={"id":"a1-3","level":"a1.html","lvl":"A1","topics":{"prepositions-of-place-and-time":"Prepositions of place and time","question-forms":"Question forms","demonstratives":"Demonstratives (this / that / these / those)","imperatives":"Imperatives (commands and instructions)","plural-nouns":"Plural nouns","possessive-pronouns":"Possessive pronouns","basic-linkers":"Basic linkers (and, but, or, because, so)"},"next":{"u":"a2.html","t":"A2","k":"nlv"},"q":[{"s":"prepositions-of-place-and-time","q":"The cat is ___ the table.","o":["under","of","to"],"a":0,"w":[["Under shows the place below something.","Under показывает место ниже чего-то.","Under biror narsaning ostini bildiradi."],["Of shows that something belongs to something. It does not show a place.","Of показывает принадлежность, а не место.","Of tegishlilikni bildiradi, joyni emas."],["To shows movement, not a place.","To показывает движение, а не место.","To harakatni bildiradi, joyni emas."]]},{"s":"prepositions-of-place-and-time","q":"My birthday is ___ May.","o":["at","on","in"],"a":2,"w":[["At is for clock times: at 5 o'clock.","At — для времени на часах: at 5 o'clock.","At soat uchun: at 5 o'clock."],["On is for days: on Monday.","On — для дней: on Monday.","On kunlar uchun: on Monday."],["We use in with months.","С месяцами используем in.","Oylar bilan in keladi."]]},{"s":"question-forms","q":"Where ___ you live?","o":["do","does","are"],"a":0,"w":[["You + normal verb takes do.","С you и обычным глаголом нужен do.","You va oddiy fe'l bilan do keladi."],["Does goes with he, she and it.","Does ставим с he, she и it.","Does he, she va it bilan keladi."],["Live is a normal verb, so we use do, not be.","Live — обычный глагол, поэтому do, а не be.","Live oddiy fe'l, shuning uchun be emas, do keladi."]]},{"s":"question-forms","q":"___ old are you?","o":["What","How","Who"],"a":1,"w":[["We do not say what old.","What old не говорят.","What old deyilmaydi."],["We ask about age with how old.","О возрасте спрашиваем how old.","Yoshni how old bilan so'raymiz."],["Who asks about a person.","Who спрашивает о человеке.","Who odam haqida so'raydi."]]},{"s":"demonstratives","q":"___ is my phone here, in my hand.","o":["That","This","These"],"a":1,"w":[["That is for something far from you.","That — о том, что далеко.","That uzoqdagi narsa uchun."],["One thing, near you: this.","Один предмет рядом: this.","Bitta yaqin narsa: this."],["These is for many things.","These — для нескольких предметов.","These bir nechta narsa uchun."]]},{"s":"demonstratives","q":"Look at ___ birds in the sky!","o":["this","that","those"],"a":2,"w":[["This is for one thing. Birds is plural.","This — для одного предмета, а birds — множественное.","This bitta narsa uchun. Birds ko'plikda."],["That is for one thing. Birds is plural.","That — для одного предмета, а birds — множественное.","That bitta narsa uchun. Birds ko'plikda."],["Many things, far away: those.","Несколько предметов вдалеке: those.","Uzoqdagi bir nechta narsa: those."]]},{"s":"imperatives","q":"___ the door, please.","o":["Open","Opens","To open"],"a":0,"w":[["To tell someone to do something, use the bare verb.","Просьба или команда — глагол без изменений.","Buyruq yoki iltimosda fe'l o'zgarmaydi."],["We do not add -s in a command.","В команде не добавляем -s.","Buyruqda -s qo'shilmaydi."],["We do not use to in a command.","В команде не используем to.","Buyruqda to ishlatilmaydi."]]},{"s":"imperatives","q":"___ run in the classroom!","o":["No","Not","Don't"],"a":2,"w":[["No is not used before a verb in a command.","No не ставим перед глаголом в команде.","Buyruqda fe'l oldidan no kelmaydi."],["A negative command does not start with not.","Запрет не начинается с not.","Taqiq not bilan boshlanmaydi."],["Don't + verb tells someone not to do it.","Don't + глагол — это запрет.","Don't + fe'l taqiqni bildiradi."]]},{"s":"plural-nouns","q":"I have two ___.","o":["childs","children","child"],"a":1,"w":[["Child has an irregular plural, so not -s.","У child неправильное множественное число, без -s.","Child ning ko'pligi noto'g'ri, -s olmaydi."],["The plural of child is children.","Множественное число child — children.","Child ning ko'pligi children."],["After two we need a plural.","После two нужно множественное число.","Two dan keyin ko'plik kerak."]]},{"s":"plural-nouns","q":"There are five ___ in the bag.","o":["box","boxs","boxes"],"a":2,"w":[["After five the noun must be plural.","После five нужно множественное число.","Five dan keyin ot ko'plikda bo'ladi."],["After -x we add -es, not -s.","После -x добавляем -es, а не -s.","-x dan keyin -s emas, -es qo'shiladi."],["Words ending in -x add -es.","Слова на -x получают -es.","-x bilan tugagan so'zlar -es oladi."]]},{"s":"possessive-pronouns","q":"This bag is not yours. It's ___.","o":["my","mine","me"],"a":1,"w":[["My needs a noun after it: my bag.","После my нужно существительное: my bag.","My dan keyin ot kerak: my bag."],["Mine stands alone, with no noun after it.","Mine стоит без существительного.","Mine otsiz keladi."],["Me is an object word, it does not show who has it.","Me — объектное местоимение, владельца не показывает.","Me obyekt olmoshi, egani ko'rsatmaydi."]]},{"s":"possessive-pronouns","q":"That is their house. It is ___.","o":["their","them","theirs"],"a":2,"w":[["Their needs a noun after it.","После their нужно существительное.","Their dan keyin ot kerak."],["Them is an object word.","Them — объектное местоимение.","Them obyekt olmoshi."],["At the end, with no noun, we use theirs.","В конце, без существительного, ставим theirs.","Oxirida, otsiz, theirs ishlatiladi."]]},{"s":"basic-linkers","q":"I like tea ___ I don't like coffee.","o":["but","and","or"],"a":0,"w":[["The two ideas are different, so we use but.","Две мысли противоположны, поэтому but.","Ikki fikr qarama-qarshi, shuning uchun but."],["And joins similar ideas.","And соединяет похожие мысли.","And o'xshash fikrlarni bog'laydi."],["Or gives a choice.","Or предлагает выбор.","Or tanlovni bildiradi."]]},{"s":"basic-linkers","q":"I am tired ___ I went to bed late.","o":["so","because","or"],"a":1,"w":[["So shows the result, not the reason.","So показывает результат, а не причину.","So natijani bildiradi, sababni emas."],["Going to bed late is the reason, so we use because.","Поздний сон — причина, поэтому because.","Kech uxlash sabab, shuning uchun because."],["Or gives a choice.","Or предлагает выбор.","Or tanlovni bildiradi."]]}]};
