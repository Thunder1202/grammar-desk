</div><script src="app.js"></script><script>window.GD_EXAM={"id":"a1-1","level":"a1.html","lvl":"A1","topics":{"to-be":"To be (am / is / are)","possessives":"Possessives","present-simple":"Present Simple","present-continuous":"Present Continuous","present-simple-vs-continuous":"Present Simple vs Continuous","there-is-there-are":"There is / There are"},"next":{"u":"countable-and-uncountable-nouns.html","t":"Countable and uncountable nouns","k":"nxt"},"q":[{"s":"to-be","q":"She ___ my sister.","o":["is","are","am"],"a":0,"w":[["She takes is.","С she используем is.","She bilan is ishlatiladi."],["Are goes with you, we and they.","Are ставим с you, we и they.","Are you, we va they bilan keladi."],["Am goes only with I.","Am ставим только с I.","Am faqat I bilan keladi."]]},{"s":"to-be","q":"We ___ from Tashkent.","o":["am","is","are"],"a":2,"w":[["Am goes only with I.","Am ставим только с I.","Am faqat I bilan keladi."],["Is goes with he, she and it.","Is ставим с he, she и it.","Is he, she va it bilan keladi."],["We takes are.","С we используем are.","We bilan are ishlatiladi."]]},{"s":"possessives","q":"This is ___ book. I bought it.","o":["my","me","I"],"a":0,"w":[["My shows that the book is mine.","My показывает, что книга моя.","My kitob meniki ekanini bildiradi."],["Me is an object word. It cannot go before a noun.","Me — объектное местоимение, перед существительным не ставится.","Me obyekt olmoshi, otdan oldin kelmaydi."],["I is a subject word. It cannot go before a noun.","I — подлежащее, перед существительным не ставится.","I ega vazifasida keladi, otdan oldin kelmaydi."]]},{"s":"possessives","q":"This is ___ car.","o":["Tom's","Toms","Tom"],"a":0,"w":[["We add 's to a name to show who has it.","Добавляем 's к имени, чтобы показать владельца.","Egasini ko'rsatish uchun ismga 's qo'shamiz."],["Without the apostrophe it looks like a plural.","Без апострофа это похоже на множественное число.","Apostrofsiz bu ko'plik shakliga o'xshaydi."],["A name alone does not show who has the car.","Одно имя не показывает владельца.","Ismning o'zi egasini ko'rsatmaydi."]]},{"s":"present-simple","q":"He ___ football every Sunday.","o":["play","plays","playing"],"a":1,"w":[["With he we must add -s.","С he нужно добавить -s.","He bilan -s qo'shish kerak."],["He + verb + -s: he plays.","He + глагол + -s: he plays.","He + fe'l + -s: he plays."],["Playing needs is before it, and every Sunday shows a habit.","Перед playing нужен is, а every Sunday говорит о привычке.","Playing oldidan is kerak, every Sunday esa odatni bildiradi."]]},{"s":"present-simple","q":"They ___ like fish.","o":["doesn't","don't","aren't"],"a":1,"w":[["Doesn't goes with he, she and it.","Doesn't ставим с he, she и it.","Doesn't he, she va it bilan keladi."],["They takes don't in the negative.","С they в отрицании нужен don't.","They bilan inkorda don't keladi."],["Like is a normal verb, so we need do, not be.","Like — обычный глагол, поэтому нужен do, а не be.","Like oddiy fe'l, shuning uchun be emas, do kerak."]]},{"s":"present-continuous","q":"Look! The baby ___.","o":["sleeps","sleep","is sleeping"],"a":2,"w":[["Sleeps is for habits, not for right now.","Sleeps — о привычках, а не о данном моменте.","Sleeps odat uchun, hozirgi payt uchun emas."],["The baby is he or she, and this form is not right.","Baby — это he или she, эта форма не подходит.","Baby he yoki she hisoblanadi, bu shakl to'g'ri emas."],["Look! shows it is happening now: be + -ing.","Look! показывает, что это происходит сейчас: be + -ing.","Look! hozir bo'layotganini bildiradi: be + -ing."]]},{"s":"present-continuous","q":"I ___ a letter now.","o":["am writing","writing","write"],"a":0,"w":[["Now needs be + -ing: am writing.","С now нужно be + -ing: am writing.","Now bilan be + -ing kerak: am writing."],["We cannot drop am before writing.","Нельзя убрать am перед writing.","Writing oldidan am tushib qolmasligi kerak."],["Write is for habits, not for now.","Write — о привычках, а не о том, что сейчас.","Write odat uchun, hozirgi payt uchun emas."]]},{"s":"present-simple-vs-continuous","q":"I usually ___ tea, but today I am drinking coffee.","o":["drink","am drinking","drinks"],"a":0,"w":[["Usually shows a habit, so we use the simple form.","Usually говорит о привычке, поэтому простая форма.","Usually odatni bildiradi, shuning uchun oddiy shakl keladi."],["Be + -ing is for now, not for habits.","Be + -ing — о том, что сейчас, а не о привычках.","Be + -ing hozirgi payt uchun, odat uchun emas."],["Drinks goes with he, she and it, not I.","Drinks ставим с he, she и it, а не с I.","Drinks he, she va it bilan keladi, I bilan emas."]]},{"s":"present-simple-vs-continuous","q":"Be quiet! Mum ___ on the phone.","o":["talks","is talking","talk"],"a":1,"w":[["Talks is for habits. Be quiet! shows it is now.","Talks — о привычках, а Be quiet! показывает, что это сейчас.","Talks odat uchun. Be quiet! hozirligini bildiradi."],["It is happening now: is + talking.","Это происходит сейчас: is + talking.","Bu hozir bo'lmoqda: is + talking."],["Mum is she, so this form is wrong too.","Mum — это she, поэтому форма тоже неверна.","Mum she hisoblanadi, shu sababli bu shakl ham xato."]]},{"s":"there-is-there-are","q":"There ___ a park near my house.","o":["are","is","be"],"a":1,"w":[["Are goes with plurals. A park is one thing.","Are — для множественного числа, а a park — один предмет.","Are ko'plik uchun. A park bitta narsa."],["One thing takes there is.","С одним предметом — there is.","Bitta narsa bilan there is keladi."],["We must use a real form: is or are.","Нужна настоящая форма: is или are.","Aniq shakl kerak: is yoki are."]]},{"s":"there-is-there-are","q":"___ there any eggs in the box?","o":["Is","Are","Do"],"a":1,"w":[["Eggs is plural, so is does not fit.","Eggs — множественное число, поэтому is не подходит.","Eggs ko'plikda, shuning uchun is to'g'ri kelmaydi."],["Plural question: Are there any eggs?","Вопрос с множественным числом: Are there any eggs?","Ko'plikdagi so'roq: Are there any eggs?"],["With there we use be, not do.","С there используем be, а не do.","There bilan do emas, be ishlatiladi."]]}]};
