</div><script src="app.js"></script><script>window.GD_EXAM={"id":"b2-1","level":"b2.html","lvl":"B2","topics":{"third-conditional":"Third Conditional","mixed-conditionals":"Mixed conditionals","passive-voice-all-tenses":"Passive voice (all tenses)","reported-speech-full":"Reported speech (full)","future-perfect-and-continuous":"Future perfect and continuous","past-modals-of-deduction":"Past modals of deduction"},"next":{"u":"perfect-modals.html","t":"Perfect modals","k":"nxt"},"q":[{"s":"third-conditional","q":"If you had told me, I ___ you.","o":["would have helped","would help","will help"],"a":0,"w":[["An unreal past result: would have + past participle.","Нереальный результат в прошлом: would have + третья форма.","O'tmishdagi noreal natija: would have + uchinchi shakl."],["Would help is about now, but had told refers to the past.","Would help — о настоящем, а had told — о прошлом.","Would help hozir haqida, had told esa o'tmishga oid."],["Will help is for a real future situation.","Will help — для реального будущего.","Will help real kelajak uchun."]]},{"s":"third-conditional","q":"We wouldn't have missed the train if we ___ earlier.","o":["had left","left","would leave"],"a":0,"w":[["The if part of an unreal past takes the past perfect.","В части с if о нереальном прошлом нужен past perfect.","O'tmishdagi noreal holatda if qismida past perfect keladi."],["Left alone would be the second conditional.","Просто left — это второй тип.","Faqat left ikkinchi turga xos."],["We do not use would in the if part.","В части с if не используем would.","If qismida would ishlatilmaydi."]]},{"s":"mixed-conditionals","q":"If I had studied medicine, I ___ a doctor now.","o":["would be","would have been","will be"],"a":0,"w":[["Past condition, present result: would + verb, because of now.","Условие в прошлом, результат сейчас: would + глагол, ведь есть now.","Shart o'tmishda, natija hozir: would + fe'l, chunki now bor."],["Would have been is a past result, but now shows the present.","Would have been — результат в прошлом, а now указывает на настоящее.","Would have been o'tmishdagi natija, now esa hozirni ko'rsatadi."],["Will be is for a real future.","Will be — для реального будущего.","Will be real kelajak uchun."]]},{"s":"mixed-conditionals","q":"If she weren't so shy, she ___ to the party last night.","o":["would have gone","would go","goes"],"a":0,"w":[["Present condition, past result: would have + past participle.","Условие в настоящем, результат в прошлом: would have + третья форма.","Shart hozirda, natija o'tmishda: would have + uchinchi shakl."],["Would go does not match last night.","Would go не сочетается с last night.","Would go last night bilan mos kelmaydi."],["Goes is present, but last night is past.","Goes — настоящее, а last night — прошлое.","Goes hozirgi zamon, last night esa o'tgan."]]},{"s":"passive-voice-all-tenses","q":"The road ___ at the moment.","o":["is being repaired","is repaired","has repaired"],"a":0,"w":[["Passive and happening now: is being + past participle.","Пассив и сейчас: is being + третья форма.","Passiv va hozir: is being + uchinchi shakl."],["Is repaired is a general fact, not at the moment.","Is repaired — общий факт, а не at the moment.","Is repaired umumiy fakt, at the moment emas."],["Has repaired is active: the road cannot repair anything.","Has repaired — актив, а дорога ничего не ремонтирует.","Has repaired faol shakl, yo'l hech narsani ta'mirlamaydi."]]},{"s":"passive-voice-all-tenses","q":"The results ___ by Friday.","o":["will have been published","will have published","are publishing"],"a":0,"w":[["Passive, finished before a future time: will have been + past participle.","Пассив, завершится к моменту в будущем: will have been + третья форма.","Passiv, kelajakdagi paytgacha tugaydi: will have been + uchinchi shakl."],["Without been the form is active, but results do not publish.","Без been форма активная, а результаты ничего не публикуют.","Been bo'lmasa, shakl faol bo'ladi, natijalar esa nashr qilmaydi."],["This is active, and it does not show by Friday.","Это актив, и он не передаёт by Friday.","Bu faol shakl, by Friday ma'nosini ham bermaydi."]]},{"s":"reported-speech-full","q":"She asked me where ___.","o":["I lived","did I live","do I live"],"a":0,"w":[["Reported questions use normal word order: subject + verb.","В косвенном вопросе обычный порядок: подлежащее + глагол.","O'zlashtirma so'roqda oddiy tartib: ega + fe'l."],["We do not use did in a reported question.","В косвенном вопросе не используем did.","O'zlashtirma so'roqda did ishlatilmaydi."],["This keeps question order and the wrong tense.","Здесь порядок вопроса и неверное время.","Bu yerda so'roq tartibi va noto'g'ri zamon."]]},{"s":"reported-speech-full","q":"He told me ___ the door.","o":["not to open","don't open","not open"],"a":0,"w":[["A reported negative order: not to + verb.","Косвенный запрет: not to + глагол.","O'zlashtirma taqiq: not to + fe'l."],["Don't open is direct speech, not reported.","Don't open — прямая речь.","Don't open ko'chirma gap."],["We need to after not.","После not нужен to.","Not dan keyin to kerak."]]},{"s":"future-perfect-and-continuous","q":"By 2030, I ___ here for twenty years.","o":["will have worked","will work","am working"],"a":0,"w":[["By + future time, looking back: will have + past participle.","By + будущий момент, взгляд назад: will have + третья форма.","By + kelajak payti, orqaga qarash: will have + uchinchi shakl."],["Will work does not show the period up to 2030.","Will work не показывает период до 2030 года.","Will work 2030 gacha bo'lgan davrni ko'rsatmaydi."],["Am working is about now.","Am working — о настоящем.","Am working hozir haqida."]]},{"s":"future-perfect-and-continuous","q":"This time tomorrow, I ___ on a beach.","o":["will be lying","will have lain","lie"],"a":0,"w":[["In progress at a future moment: will be + -ing.","Действие в процессе в будущий момент: will be + -ing.","Kelajakdagi paytda davom etayotgan ish: will be + -ing."],["Will have lain shows something finished by then.","Will have lain показывает завершённость к этому моменту.","Will have lain o'sha paytgacha tugaganini bildiradi."],["The plain present does not fit this time tomorrow.","Простое настоящее не подходит к this time tomorrow.","Oddiy hozirgi zamon this time tomorrow ga mos emas."]]},{"s":"past-modals-of-deduction","q":"The ground is wet. It ___ last night.","o":["must have rained","must rain","can't have rained"],"a":0,"w":[["Almost sure about the past: must have + past participle.","Почти уверены насчёт прошлого: must have + третья форма.","O'tmish haqida deyarli ishonch: must have + uchinchi shakl."],["Must rain talks about the present or a rule.","Must rain — о настоящем или о правиле.","Must rain hozir yoki qoida haqida."],["Can't have rained says it did not rain, but the ground is wet.","Can't have rained значит, что дождя не было, а земля мокрая.","Can't have rained yomg'ir yog'maganini bildiradi, yer esa ho'l."]]},{"s":"past-modals-of-deduction","q":"He ___ the email. I never sent it.","o":["can't have read","must have read","should read"],"a":0,"w":[["Sure it did not happen: can't have + past participle.","Уверены, что этого не было: can't have + третья форма.","Bo'lmaganiga ishonch: can't have + uchinchi shakl."],["Must have read says he did read it.","Must have read значит, что он прочитал.","Must have read o'qiganini bildiradi."],["Should read is advice, not a guess about the past.","Should read — совет, а не предположение о прошлом.","Should read maslahat, o'tmish haqidagi taxmin emas."]]}]};
</script><script src="exam.js"></script></body></html>
