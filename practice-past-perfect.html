</div><script src="app.js"></script><script>window.GD_QUIZ={"id":"past-perfect","rules":{"f":{"en":"Form: <b>had + past participle</b> for all people: I <b>had finished</b>, she <b>had finished</b>, they <b>had finished</b>. Short form: <b>'d</b> (I'd finished).","ru":"Форма: <b>had + причастие прошедшего времени</b> для всех лиц: I <b>had finished</b>, she <b>had finished</b>, they <b>had finished</b>. Краткая форма: <b>'d</b> (I'd finished).","uz":"Shakli: <b>had + o'tgan zamon sifatdoshi</b> barcha shaxslar uchun: I <b>had finished</b>, she <b>had finished</b>, they <b>had finished</b>. Qisqa shakl: <b>'d</b> (I'd finished)."},"pp":{"en":"Participles: regular verbs add <b>-ed</b> (finish → finished). Irregular verbs have a special 3rd form: go → <b>gone</b>, see → <b>seen</b>, eat → <b>eaten</b>, write → <b>written</b>, take → <b>taken</b>, begin → <b>begun</b>.","ru":"Причастия: у правильных глаголов <b>-ed</b> (finish → finished). У неправильных особая 3-я форма: go → <b>gone</b>, see → <b>seen</b>, eat → <b>eaten</b>, write → <b>written</b>, take → <b>taken</b>, begin → <b>begun</b>.","uz":"Sifatdoshlar: muntazam fe'llarga <b>-ed</b> (finish → finished). Noto'g'ri fe'llarda maxsus 3-shakl: go → <b>gone</b>, see → <b>seen</b>, eat → <b>eaten</b>, write → <b>written</b>, take → <b>taken</b>, begin → <b>begun</b>."},"use":{"en":"Use it for the <b>earlier past</b>: an action that happened <b>before</b> another past action or time. When I arrived, the film <b>had started</b>. (First: it started. Then: I arrived.)","ru":"Используется для <b>более раннего прошлого</b>: действие произошло <b>раньше</b> другого действия в прошлом. When I arrived, the film <b>had started</b>. (Сначала фильм начался. Потом я пришёл.)","uz":"<b>Oldingi o'tmish</b> uchun ishlatiladi: ish boshqa o'tgan ishdan <b>oldin</b> bo'lgan. When I arrived, the film <b>had started</b>. (Avval film boshlangan. Keyin men keldim.)"},"ps":{"en":"Two past actions: the <b>first</b> one = Past Perfect, the <b>second</b> one = Past Simple. She <b>had left</b> before I <b>called</b>.","ru":"Два действия в прошлом: <b>первое</b> = Past Perfect, <b>второе</b> = Past Simple. She <b>had left</b> before I <b>called</b>.","uz":"O'tmishdagi ikki ish: <b>birinchisi</b> = Past Perfect, <b>ikkinchisi</b> = Past Simple. She <b>had left</b> before I <b>called</b>."},"neg":{"en":"Negative: <b>hadn't + past participle</b>: I <b>hadn't eaten</b>. They <b>hadn't arrived</b>.","ru":"Отрицание: <b>hadn't + причастие</b>: I <b>hadn't eaten</b>. They <b>hadn't arrived</b>.","uz":"Inkor: <b>hadn't + sifatdosh</b>: I <b>hadn't eaten</b>. They <b>hadn't arrived</b>."},"q":{"en":"Question: <b>Had + subject + past participle?</b> Had you finished? Had she left?","ru":"Вопрос: <b>Had + подлежащее + причастие?</b> Had you finished? Had she left?","uz":"So'roq: <b>Had + ega + sifatdosh?</b> Had you finished? Had she left?"},"sa":{"en":"Short answers: Yes, I <b>had</b>. / No, she <b>hadn't</b>. Do not repeat the verb.","ru":"Краткие ответы: Yes, I <b>had</b>. / No, she <b>hadn't</b>. Глагол не повторяйте.","uz":"Qisqa javoblar: Yes, I <b>had</b>. / No, she <b>hadn't</b>. Fe'lni takrorlamang."},"conj":{"en":"<b>after</b> + Past Perfect (first action), then Past Simple. <b>before / by the time / when</b>: the Past Perfect goes with the earlier action. After she <b>had finished</b>, she went out. She <b>had finished</b> before he came.","ru":"<b>after</b> + Past Perfect (первое действие), затем Past Simple. <b>before / by the time / when</b>: Past Perfect — с более ранним действием. After she <b>had finished</b>, she went out. She <b>had finished</b> before he came.","uz":"<b>after</b> + Past Perfect (birinchi ish), keyin Past Simple. <b>before / by the time / when</b>: Past Perfect oldingi ish bilan keladi. After she <b>had finished</b>, she went out. She <b>had finished</b> before he came."},"adv":{"en":"<b>already, just, never, ever, yet, still</b> are used with the Past Perfect too: I had <b>never</b> seen snow before. She hadn't called <b>yet</b>. Put <b>already / just / never</b> between had and the participle.","ru":"<b>already, just, never, ever, yet, still</b> используются и с Past Perfect: I had <b>never</b> seen snow before. She hadn't called <b>yet</b>. <b>already / just / never</b> ставятся между had и причастием.","uz":"<b>already, just, never, ever, yet, still</b> Past Perfect bilan ham ishlatiladi: I had <b>never</b> seen snow before. She hadn't called <b>yet</b>. <b>already / just / never</b> had va sifatdosh orasiga qo'yiladi."},"rep":{"en":"In <b>reported speech</b> we move back one tense: \"I <b>have seen</b> it\" → He said he <b>had seen</b> it. \"I <b>saw</b> it\" → He said he <b>had seen</b> it.","ru":"В <b>косвенной речи</b> время сдвигается назад: \"I <b>have seen</b> it\" → He said he <b>had seen</b> it. \"I <b>saw</b> it\" → He said he <b>had seen</b> it.","uz":"<b>Ko'chirma gapda</b> zamon bir qadam orqaga suriladi: \"I <b>have seen</b> it\" → He said he <b>had seen</b> it. \"I <b>saw</b> it\" → He said he <b>had seen</b> it."},"same":{"en":"If actions happen one after another and you tell them in order, use <b>Past Simple</b> for both: I got home and cooked dinner. Use the Past Perfect only to show which action was <b>earlier</b> when the order is not clear.","ru":"Если действия идут одно за другим и вы рассказываете по порядку, используйте <b>Past Simple</b> для обоих: I got home and cooked dinner. Past Perfect нужен, чтобы показать, какое действие было <b>раньше</b>, когда порядок неочевиден.","uz":"Ishlar birin-ketin bo'lsa va tartib bilan aytsangiz, ikkalasiga <b>Past Simple</b>: I got home and cooked dinner. Past Perfect faqat qaysi ish <b>oldin</b> bo'lganini ko'rsatish kerak bo'lganda ishlatiladi."},"order":{"en":"Word order: <b>subject + had + (never / already) + participle + the rest</b>. Questions: <b>Had + subject + participle?</b>","ru":"Порядок слов: <b>подлежащее + had + (never / already) + причастие + остальное</b>. Вопросы: <b>Had + подлежащее + причастие?</b>","uz":"So'zlar tartibi: <b>ega + had + (never / already) + sifatdosh + qolgani</b>. So'roq: <b>Had + ega + sifatdosh?</b>"}},"ex":[{"h":{"en":"Write the past participle (3rd form). Example: go → gone.","ru":"Напишите причастие (3-ю форму). Например: go → gone.","uz":"Sifatdoshni (3-shaklni) yozing. Masalan: go → gone."}},{"h":{"en":"Write the verb in brackets in the Past Perfect. Write both words, for example: had finished.","ru":"Напишите глагол из скобок в Past Perfect. Пишите оба слова, например: had finished.","uz":"Qavs ichidagi fe'lni Past Perfect da yozing. Ikkala so'zni yozing, masalan: had finished."}},{"h":{"en":"Make the sentence negative. Write the full sentence.","ru":"Сделайте предложение отрицательным. Напишите его полностью.","uz":"Gapni inkor qiling. To'liq gapni yozing."}},{"h":{"en":"Make a question. Write the full question.","ru":"Составьте вопрос. Напишите вопрос полностью.","uz":"Savol tuzing. To'liq savolni yozing."}},{"h":{"en":"Write a short answer. ✓ = yes, ✗ = no. Example: Had he left? (✓) → Yes, he had.","ru":"Напишите краткий ответ. ✓ = да, ✗ = нет. Например: Had he left? (✓) → Yes, he had.","uz":"Qisqa javob yozing. ✓ = ha, ✗ = yo'q. Masalan: Had he left? (✓) → Yes, he had."}},{"h":{"en":"Which action was first? Write the verb in brackets: Past Perfect (first action) or Past Simple (second action).","ru":"Какое действие было первым? Напишите глагол: Past Perfect (первое действие) или Past Simple (второе).","uz":"Qaysi ish birinchi bo'lgan? Fe'lni yozing: Past Perfect (birinchi ish) yoki Past Simple (ikkinchi ish)."}},{"h":{"en":"Write the verb in brackets after after, before, by the time or when.","ru":"Напишите глагол из скобок после after, before, by the time или when.","uz":"after, before, by the time yoki when dan keyin qavs ichidagi fe'lni yozing."}},{"h":{"en":"Write the missing word: already, just, never, yet or before.","ru":"Напишите пропущенное слово: already, just, never, yet или before.","uz":"Tushib qolgan so'zni yozing: already, just, never, yet yoki before."}},{"h":{"en":"Reported speech. Write the verb in brackets in the Past Perfect.","ru":"Косвенная речь. Напишите глагол из скобок в Past Perfect.","uz":"Ko'chirma gap. Qavs ichidagi fe'lni Past Perfect da yozing."}},{"h":{"en":"Find the mistake and write the correct sentence.","ru":"Найдите ошибку и напишите правильное предложение.","uz":"Xatoni toping va to'g'ri gapni yozing."}},{"h":{"en":"Join the two sentences with the word in brackets. Write the full sentence.","ru":"Соедините два предложения словом в скобках. Напишите предложение полностью.","uz":"Ikki gapni qavs ichidagi so'z bilan birlashtiring. To'liq gapni yozing."}},{"h":{"en":"Put the words in the correct order.","ru":"Расставьте слова в правильном порядке.","uz":"So'zlarni to'g'ri tartibga qo'ying."}}],"q":[{"e":0,"q":"go → ___","a":["gone"],"r":"pp","ru":"go — идти, ехать","uz":"go — bormoq"},{"e":0,"q":"see → ___","a":["seen"],"r":"pp","ru":"see — видеть","uz":"see — ko'rmoq"},{"e":0,"q":"eat → ___","a":["eaten"],"r":"pp","ru":"eat — есть","uz":"eat — yemoq"},{"e":0,"q":"write → ___","a":["written"],"r":"pp","ru":"write — писать","uz":"write — yozmoq"},{"e":0,"q":"take → ___","a":["taken"],"r":"pp","ru":"take — брать","uz":"take — olmoq"},{"e":0,"q":"begin → ___","a":["begun"],"r":"pp","ru":"begin — начинать","uz":"begin — boshlamoq"},{"e":0,"q":"leave → ___","a":["left"],"r":"pp","ru":"leave — уходить, покидать","uz":"leave — ketmoq, tark etmoq"},{"e":0,"q":"buy → ___","a":["bought"],"r":"pp","ru":"buy — покупать","uz":"buy — sotib olmoq"},{"e":0,"q":"forget → ___","a":["forgotten"],"r":"pp","ru":"forget — забывать","uz":"forget — unutmoq"},{"e":0,"q":"study → ___","a":["studied"],"r":"pp","ru":"study — учиться","uz":"study — o'qimoq, o'rganmoq"},{"e":1,"q":"When I arrived, the film ___ (start).","a":["had started"],"r":"use","ru":"Когда я пришёл, фильм уже начался.","uz":"Men kelganimda film allaqachon boshlangan edi."},{"e":1,"q":"She ___ (leave) before I called.","a":["had left"],"r":"use","ru":"Она ушла до того, как я позвонил.","uz":"U men qo'ng'iroq qilishimdan oldin ketgan edi."},{"e":1,"q":"We were late. The bus ___ (go).","a":["had gone"],"r":"use","ru":"Мы опоздали. Автобус уже ушёл.","uz":"Biz kechikdik. Avtobus ketib bo'lgan edi."},{"e":1,"q":"He was hungry because he ___ (not / eat) all day.","a":["hadn't eaten"],"r":"neg","ru":"Он был голоден, потому что весь день не ел.","uz":"U och edi, chunki kun bo'yi ovqat yemagan edi."},{"e":1,"q":"I ___ (never / see) snow before I went to Russia.","a":["had never seen"],"r":"adv","ru":"Я никогда не видел снега, пока не поехал в Россию.","uz":"Rossiyaga borguncha men hech qachon qor ko'rmagan edim."},{"e":1,"q":"They ___ (already / finish) when we got there.","a":["had already finished"],"r":"adv","ru":"Когда мы туда пришли, они уже закончили.","uz":"Biz u yerga borganimizda ular allaqachon tugatib bo'lgan edi."},{"e":1,"q":"My friend didn't come because he ___ (forget).","a":["had forgotten"],"r":"use","ru":"Мой друг не пришёл, потому что забыл.","uz":"Do'stim kelmadi, chunki unutib qo'ygan edi."},{"e":1,"q":"The teacher was angry. We ___ (not / do) the homework.","a":["hadn't done"],"r":"neg","ru":"Учитель был сердит. Мы не сделали домашнее задание.","uz":"O'qituvchi jahli chiqqan edi. Biz uy vazifasini qilmagan edik."},{"e":1,"q":"By 2010 she ___ (move) to London.","a":["had moved"],"r":"use","ru":"К 2010 году она переехала в Лондон.","uz":"2010-yilga kelib u Londonga ko'chib o'tgan edi."},{"e":1,"q":"I could not open the door. I ___ (lose) my key.","a":["had lost"],"r":"use","ru":"Я не смог открыть дверь. Я потерял ключ.","uz":"Men eshikni ocholmadim. Kalitimni yo'qotib qo'ygan edim."},{"e":2,"q":"I had eaten.","a":["I hadn't eaten.","I had not eaten."],"r":"neg","ru":"Я не ел.","uz":"Men ovqat yemagan edim."},{"e":2,"q":"They had arrived.","a":["They hadn't arrived.","They had not arrived."],"r":"neg","ru":"Они не приехали.","uz":"Ular yetib kelmagan edi."},{"e":2,"q":"She had finished her work.","a":["She hadn't finished her work.","She had not finished her work."],"r":"neg","ru":"Она не закончила работу.","uz":"U ishini tugatmagan edi."},{"e":2,"q":"We had seen the film.","a":["We hadn't seen the film.","We had not seen the film."],"r":"neg","ru":"Мы не видели фильм.","uz":"Biz filmni ko'rmagan edik."},{"e":2,"q":"He had called me.","a":["He hadn't called me.","He had not called me."],"r":"neg","ru":"Он мне не звонил.","uz":"U menga qo'ng'iroq qilmagan edi."},{"e":2,"q":"I had been there before.","a":["I hadn't been there before.","I had not been there before."],"r":"neg","ru":"Я там раньше не был.","uz":"Men ilgari u yerda bo'lmagan edim."},{"e":3,"q":"you / finish / your work","a":["Had you finished your work?"],"r":"q","ru":"Ты закончил работу?","uz":"Siz ishingizni tugatgan edingizmi?"},{"e":3,"q":"she / leave","a":["Had she left?"],"r":"q","ru":"Она уже ушла?","uz":"U ketib bo'lgan edimi?"},{"e":3,"q":"they / arrive","a":["Had they arrived?"],"r":"q","ru":"Они уже приехали?","uz":"Ular yetib kelgan edimi?"},{"e":3,"q":"he / ever / see / snow","a":["Had he ever seen snow?"],"r":"q","ru":"Он когда-нибудь видел снег?","uz":"U hech qor ko'rgan edimi?"},{"e":3,"q":"you / meet / her / before","a":["Had you met her before?"],"r":"q","ru":"Ты встречал её раньше?","uz":"Siz u bilan ilgari uchrashgan edingizmi?"},{"e":3,"q":"the film / start","a":["Had the film started?"],"r":"q","ru":"Фильм уже начался?","uz":"Film boshlangan edimi?"},{"e":4,"q":"Had you finished? (✓)","a":["Yes, I had."],"r":"sa","ru":"Ты закончил? Да.","uz":"Tugatgan edingizmi? Ha."},{"e":4,"q":"Had she left? (✗)","a":["No, she hadn't.","No, she had not."],"r":"sa","ru":"Она ушла? Нет.","uz":"U ketib bo'lgan edimi? Yo'q."},{"e":4,"q":"Had they arrived? (✓)","a":["Yes, they had."],"r":"sa","ru":"Они приехали? Да.","uz":"Ular yetib kelgan edimi? Ha."},{"e":4,"q":"Had he called? (✗)","a":["No, he hadn't.","No, he had not."],"r":"sa","ru":"Он звонил? Нет.","uz":"U qo'ng'iroq qilgan edimi? Yo'q."},{"e":5,"q":"When we arrived, they ___ (already / leave).","a":["had already left"],"r":"ps","ru":"Когда мы приехали, они уже ушли.","uz":"Biz yetib kelganimizda ular allaqachon ketgan edi."},{"e":5,"q":"I ___ (see) the film, so I didn't go to the cinema.","a":["had seen"],"r":"ps","ru":"Я уже видел фильм, поэтому не пошёл в кино.","uz":"Men filmni ko'rgan edim, shuning uchun kinoga bormadim."},{"e":5,"q":"He ___ (open) the window because the room was hot.","a":["opened"],"r":"ps","ru":"Он открыл окно, потому что в комнате было жарко.","uz":"U derazani ochdi, chunki xona issiq edi."},{"e":5,"q":"She cried because she ___ (lose) her phone.","a":["had lost"],"r":"ps","ru":"Она плакала, потому что потеряла телефон.","uz":"U yig'ladi, chunki telefonini yo'qotib qo'ygan edi."},{"e":5,"q":"I woke up late, so I ___ (miss) the bus.","a":["missed"],"r":"ps","ru":"Я проснулся поздно, поэтому опоздал на автобус.","uz":"Men kech uyg'ondim, shuning uchun avtobusga kech qoldim."},{"e":5,"q":"When I got home, my mother ___ (cook) dinner.","a":["had cooked"],"r":"ps","ru":"Когда я пришёл домой, мама уже приготовила ужин.","uz":"Uyga kelganimda onam kechki ovqatni pishirib qo'ygan edi."},{"e":5,"q":"The film ___ (begin) when we sat down.","a":["had begun"],"r":"ps","ru":"Фильм уже начался, когда мы сели.","uz":"Biz o'tirganimizda film boshlanib bo'lgan edi."},{"e":5,"q":"We ___ (be) very tired, so we went to bed early.","a":["were"],"r":"ps","ru":"Мы очень устали, поэтому рано легли спать.","uz":"Biz juda charchagan edik, shuning uchun erta yotdik.","n":"This is a state, not an earlier action."},{"e":5,"q":"The thief ___ (run) away before the police came.","a":["had run"],"r":"ps","ru":"Вор убежал до приезда полиции.","uz":"O'g'ri politsiya kelmasidan oldin qochib ketgan edi."},{"e":5,"q":"I called her, but she ___ (already / go) out.","a":["had already gone"],"r":"ps","ru":"Я позвонил ей, но она уже ушла.","u
